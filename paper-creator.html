<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Paper Creator | THE STUDY POINT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef3f9;
}

header{
height:70px;
background:linear-gradient(135deg,#0d47a1,#1976d2);
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

header h2{
font-size:28px;
}

header button{
background:white;
color:#1565c0;
border:none;
padding:10px 18px;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

.container{
display:grid;
grid-template-columns:380px 1fr;
gap:25px;
padding:25px;
}

.panel{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.panel h3{
color:#1565c0;
margin-bottom:18px;
}

.inputBox{
margin-bottom:15px;
}

.inputBox label{
display:block;
margin-bottom:6px;
font-weight:600;
}

.inputBox input,
.inputBox select,
.inputBox textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
outline:none;
font-size:15px;
}

textarea{
height:100px;
resize:none;
}

.addBtn{
width:100%;
padding:14px;
background:#1565c0;
color:white;
border:none;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
margin-top:10px;
}

.preview{
background:white;
border-radius:18px;
padding:35px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
min-height:900px;
}

.paper{
max-width:800px;
margin:auto;
background:white;
border:2px solid #000;
padding:35px;
}

.paper h1{
text-align:center;
font-size:28px;
}

.paper h2{
text-align:center;
margin-top:8px;
font-size:18px;
}

.paper hr{
margin:18px 0;
}

.info{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
font-weight:600;
margin-bottom:20px;
}

.questionArea{
margin-top:25px;
}

.question{
margin-bottom:20px;
line-height:1.8;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<h2>📝 Paper Creator</h2>

<button onclick="location.href='admin-dashboard.html'">
🏠 Dashboard
</button>

</header>

<div class="container">

<div class="panel">

<h3>Paper Information</h3>

<div class="inputBox">
<label>School Name</label>
<input id="school" value="THE STUDY POINT">
</div>

<div class="inputBox">
<label>Exam Name</label>
<input id="exam" placeholder="Quarterly Examination">
</div>

<div class="inputBox">
<label>Class</label>
<select id="cls">
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
</select>
</div>

<div class="inputBox">
<label>Subject</label>
<input id="subject">
</div>

<div class="inputBox">
<label>Time</label>
<input id="time" placeholder="2 Hours">
</div>

<div class="inputBox">
<label>Maximum Marks</label>
<input id="marks" placeholder="50">
</div>

<div class="inputBox">
<label>Question Type</label>
<select id="type">
<option>MCQ</option>
<option>Very Short</option>
<option>Short Answer</option>
<option>Long Answer</option>
<option>Fill in the Blanks</option>
<option>True / False</option>
</select>
</div>

<div class="inputBox">
<label>Question</label>
<textarea id="question"></textarea>
</div>

<button class="addBtn">
➕ Add Question
</button>

</div>

<div class="preview">

<div class="paper">

<h1 id="pSchool">THE STUDY POINT</h1>

<h2 id="pExam">Question Paper</h2>

<hr>

<div class="info">

<span>Class : <span id="pClass">Class 1</span></span>

<span>Subject : <span id="pSubject">________</span></span>

<span>Time : <span id="pTime">2 Hours</span></span>

<span>Marks : <span id="pMarks">50</span></span>

</div>

<hr>

<div id="paperQuestions" class="questionArea">

<p style="text-align:center;color:#888;">
Questions will appear here...
</p>

</div>

</div>

</div>

</div>
<script>
const school = document.getElementById("school");
const exam = document.getElementById("exam");
const cls = document.getElementById("cls");
const subject = document.getElementById("subject");
const time = document.getElementById("time");
const marks = document.getElementById("marks");
const type = document.getElementById("type");
const question = document.getElementById("question");

const pSchool = document.getElementById("pSchool");
const pExam = document.getElementById("pExam");
const pClass = document.getElementById("pClass");
const pSubject = document.getElementById("pSubject");
const pTime = document.getElementById("pTime");
const pMarks = document.getElementById("pMarks");

const paperQuestions = document.getElementById("paperQuestions");

let questions=[];

function updateHeader(){
    pSchool.innerText=school.value || "THE STUDY POINT";
    pExam.innerText=exam.value || "Question Paper";
    pClass.innerText=cls.value;
    pSubject.innerText=subject.value || "________";
    pTime.innerText=time.value || "2 Hours";
    pMarks.innerText=marks.value || "50";
}

school.oninput=updateHeader;
exam.oninput=updateHeader;
cls.onchange=updateHeader;
subject.oninput=updateHeader;
time.oninput=updateHeader;
marks.oninput=updateHeader;

updateHeader();

document.querySelector(".addBtn").onclick=function(){

if(question.value.trim()==""){
alert("Please enter a question.");
return;
}

questions.push({
type:type.value,
text:question.value
});

renderQuestions();

question.value="";

};

function renderQuestions(){

paperQuestions.innerHTML="";

questions.forEach((q,index)=>{

paperQuestions.innerHTML += `
<div class="question">
<b>Q${index+1}. (${q.type})</b><br>
${q.text}
</div>
`;

});

}
</script>
</body>
  </html>
