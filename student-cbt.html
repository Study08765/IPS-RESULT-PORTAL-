<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CBT Exam Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style id="premium-css">

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:
linear-gradient(rgba(5,25,60,.18), rgba(5,25,60,.28)),
url("hero-bg.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
}

.container{
width:100%;
max-width:900px;
padding-top:40px;
}

.logo{
text-align:center;
margin-bottom:45px;
color:#fff;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

border:2px solid rgba(255,215,0,.35);

border-radius:30px;

padding:40px;

box-shadow:
0 15px 45px rgba(0,0,0,.35),
0 0 25px rgba(255,215,0,.15);

animation:fade .6s ease;
transition:.35s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:
0 20px 60px rgba(0,0,0,.45),
0 0 35px rgba(255,215,0,.25);
}

.card h2{
font-size:36px;
font-weight:900;
text-align:center;
margin-bottom:30px;
letter-spacing:1px;

background:linear-gradient(90deg,#FFD700,#FFF4B0,#FFD700);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 3px 10px rgba(0,0,0,.4);
}

.exam-card{
background:linear-gradient(135deg,#ffffff,#f8fafc);

border:2px solid rgba(255,215,0,.35);
border-radius:22px;

padding:24px;
margin-bottom:22px;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:
0 12px 30px rgba(0,0,0,.18),
0 0 18px rgba(255,215,0,.12);

transition:.35s;
}

.exam-card:hover{
    transform:translateY(-6px) scale(1.02);
    border-color:#FFD700;
}

.exam-code{
    font-size:30px;
    font-weight:900;
    color:#2563eb;
    letter-spacing:1px;
}

.select-btn{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
border:none;
padding:14px 24px;
border-radius:14px;
font-size:16px;
font-weight:700;
cursor:pointer;

box-shadow:0 8px 20px rgba(37,99,235,.35);
transition:.3s;
}

.select-btn:hover{
transform:scale(1.05);
box-shadow:0 12px 28px rgba(37,99,235,.45);
  }

#loginBox{
margin-top:30px;
padding-top:30px;
border-top:2px solid rgba(255,215,0,.25);
}

#selectedCode{
color:#fff;
margin-bottom:15px;
text-align:center;
}
.input-group{
position:relative;
margin-bottom:18px;
}

.input-group i{
position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
font-size:20px;
color:#2563eb;
z-index:2;
}

.input-group input{
padding-left:60px;
height:60px;
width:100%;
}
input{
width:100%;
height:60px;
padding:0 20px;

background:rgba(255,255,255,.95);

border:2px solid rgba(255,215,0,.35);
border-radius:16px;

font-size:18px;
font-weight:600;
color:#111;

outline:none;
transition:.3s;
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

input:focus{
border-color:#FFD700;
box-shadow:
0 0 20px rgba(255,215,0,.45),
0 8px 20px rgba(0,0,0,.15);
                      }

#continueBtn{
width:100%;
height:62px;
border:none;
border-radius:18px;
cursor:pointer;

background:linear-gradient(135deg,#2563eb,#1d4ed8,#0f172a);
color:#fff;

font-size:20px;
font-weight:800;
letter-spacing:1px;

box-shadow:
0 12px 30px rgba(37,99,235,.45),
0 0 20px rgba(37,99,235,.25);

transition:.35s;
}

#continueBtn:hover{
transform:translateY(-4px) scale(1.02);

background:linear-gradient(135deg,#1d4ed8,#2563eb,#0f172a);

box-shadow:
0 18px 40px rgba(37,99,235,.55),
0 0 30px rgba(37,99,235,.35);
}

@keyframes fade{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:600px){

.logo-img{
width:110px;
height:110px;
}

.logo h1{
font-size:38px;
font-weight:900;
letter-spacing:2px;
color:#FFD700;
}

.logo p{
font-size:18px;
}

.logo h2{
font-size:30px;
}

.logo h3{
font-size:18px;
}

.card{
padding:22px;
}

.exam-code{
font-size:22px;
}

  }

  .logo-img{
width:140px;
height:140px;
border-radius:50%;
background:#fff;
padding:8px;
border:4px solid #FFD700;
box-shadow:0 0 25px rgba(255,215,0,.7);
margin-bottom:20px;
}

.logo h1{
font-size:52px;
font-weight:900;
color:#FFD700;
letter-spacing:3px;
text-transform:uppercase;
text-shadow:
0 4px 12px #000,
0 0 25px rgba(255,215,0,.8);
}

.logo p{
font-size:24px;
font-weight:600;
margin-top:12px;
color:#fff;
  }

.logo h2{
margin-top:20px;
font-size:42px;
font-weight:900;
color:#fff;
text-transform:uppercase;
text-shadow:
0 3px 8px #000,
0 0 15px rgba(255,255,255,.8);
}

.logo h3{
margin-top:8px;
font-size:22px;
color:#FFD700;
letter-spacing:2px;
  }
#selectedCode{
display:inline-block;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:12px 22px;
border-radius:40px;
font-size:17px;
font-weight:700;
margin:0 auto 20px;
box-shadow:0 8px 20px rgba(37,99,235,.35);
text-align:center;
}

#loginBox{
text-align:center;
              }
</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="icon-512.png" class="logo-img" alt="IPS Logo">

<h1>THE STUDY POINT</h1>

<p>Computer Based Test</p>

<h2 id="examTitle">AVAILABLE EXAMS</h2>

<h3>SESSION 2026-27</h3>

</div>

<div class="card">

<h2>

Available Exam Codes

</h2>

<div id="examList">

Loading...

</div>

<div id="loginBox" style="display:none;">

<h3 id="selectedCode"></h3>

<div class="input-group">

<i class="fas fa-id-card"></i>

<input
type="text"
id="roll"
placeholder="Enter Roll Number">

</div>

<button id="continueBtn">

Continue

</button>

</div>

</div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
query,
where,
getDocs,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const examList = document.getElementById("examList");
const loginBox = document.getElementById("loginBox");
const selectedCode = document.getElementById("selectedCode");
const rollInput = document.getElementById("roll");
const continueBtn = document.getElementById("continueBtn");

let selectedExamId = "";
let selectedExamCode = "";

// Load OPEN Exams
async function loadExams() {

    examList.innerHTML = "Loading...";

    const snap = await getDocs(collection(db,"cbtTests"));

const now = new Date();
    let liveExamFound = false;

    examList.innerHTML = "";

    if (snap.empty) {
    examList.innerHTML = `
    <div style="
        background:#fff;
        border-radius:20px;
        padding:35px;
        text-align:center;
        color:#1e3a8a;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
    ">
        <div style="font-size:60px;">⏳</div>

        <h2 style="margin:10px 0;">
            No Live Exam
        </h2>

        <p>
            There is no active exam at this time.
            Please check again later.
        </p>
    </div>
    `;
    return;
    }

    snap.forEach((docSnap) => {

        const exam = docSnap.data();
liveExamFound = true;
        examList.innerHTML += `
        const start = new Date(exam.start);
const end = new Date(exam.end);

if(exam.status !== "OPEN"){
    return;
}

if(now < start){

examList.innerHTML = `
<div style="
background:#fff;
padding:25px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
">

<h2 style="color:#2563eb;">
📅 Upcoming Exam
</h2>

<p style="margin-top:10px;">
${exam.testName}
</p>

<p style="color:#666;">
Starts : ${exam.start}
</p>

</div>
`;

return;

    }

if(now > end){
    return;
    }
        <div class="exam-card">

            <div>
                <div class="exam-code">${exam.examCode}</div>
                <small>${exam.subject}</small>
            </div>

            <button class="select-btn"
            onclick="selectExam('${docSnap.id}','${exam.examCode}')">
            Select
            </button>

        </div>
        `;

    });
if(!liveExamFound){

examList.innerHTML = `
<div style="
background:#fff;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.15);
">

<div style="font-size:55px;">⏳</div>

<h2 style="color:#1d4ed8;">
No Live Exam
</h2>

<p style="margin-top:10px;color:#555;">
There is no live exam right now.
Please come back at the scheduled time.
</p>

</div>
`;

    }
}

window.selectExam = function(id, code) {

    selectedExamId = id;
    selectedExamCode = code;

    loginBox.style.display = "block";
    selectedCode.innerHTML =
'<i class="fas fa-check-circle"></i> Selected Exam : <b>' + code + '</b>';

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

};

continueBtn.onclick = async () => {

    const roll = rollInput.value.trim();

    if (roll == "") {
        alert("Enter Roll Number");
        return;
    }

    const q = query(
        collection(db, "students_v2"),
        where("Roll", "==", roll)
    );

    const snap = await getDocs(q);

    if (snap.empty) {
        alert("Invalid Roll Number");
        return;
    }

    const student = snap.docs[0].data();
const responseId = selectedExamId + "_" + student.Roll;

const responseSnap = await getDoc(
doc(db,"cbtResponses",responseId)
);

if(responseSnap.exists()){

const response = responseSnap.data();

if(response.submitted===true && response.allowRetest===false){

alert(
"Dear " + student.Name +
"\n\nYou have already submitted this exam.\nRe-examination is not allowed."
);

return;

}

  }
    sessionStorage.setItem("studentRoll", student.Roll);
    sessionStorage.setItem("studentName", student.Name);
    sessionStorage.setItem("studentClass", student.Class);
    sessionStorage.setItem("examId", selectedExamId);
    sessionStorage.setItem("examCode", selectedExamCode);

    location.href = "exam-dashboard.html";

};

loadExams();

</script>

</body>
  </html>
