<style>

/* =========================================================
   RESET
========================================================= */

/* =========================================================
   BODY

body{

linear-gradient(
rgba(5,25,60,.18),

),
url("hero-bg.jpg");

background-position:center;

background-attachment:fixed;

display:flex;

align-items:center;

/* =========================================================
   CONTAINER
========================================================= */

padding-top:40px;

/* =========================================================
   LOGO
========================================================= */

.logo{

}


.logo-img{

width:140px;

height:140px;

border-radius:50%;

padding:8px;

.logo h1{

.logo h2{

/* =========================================================
   MAIN CARD
========================================================= */

.card{

background:
rgba(255,255,255,.12);

backdrop-filter:blur(20px);

-webkit-backdrop-filter:blur(20px);

border:
2px solid
rgba(255,215,0,.35);

border-radius:30px;

padding:40px;

0 15px 45px
rgba(0,0,0,.35),

rgba(255,215,0,.15);

fade .6s ease;

}


.card:hover{

0 20px 60px
rgba(0,0,0,.45),

rgba(255,215,0,.25);
}


.card > h2{

font-size:36px;

font-weight:900;

text-align:center;

margin-bottom:30px;

letter-spacing:1px;

background:

linear-gradient(
90deg,
#FFD700,
#FFF4B0,
#FFD700
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

text-shadow:
0 3px 10px
rgba(0,0,0,.40);
}


/* =========================================================
   PREMIUM EXAM CARD
========================================================= */

.exam-card{

background:

linear-gradient(
145deg,
rgba(255,255,255,.98),
rgba(239,246,255,.98)
);

border:
1px solid
rgba(37,99,235,.15);

border-radius:24px;

padding:22px;

margin-bottom:18px;

display:flex;

align-items:center;

gap:20px;

box-shadow:

0 12px 30px
rgba(15,23,42,.12),

0 2px 8px
rgba(37,99,235,.08);

transition:

transform .25s ease,
box-shadow .25s ease,
border-color .25s ease;
}


.exam-card:hover{

transform:
translateY(-4px);

border-color:
rgba(37,99,235,.35);

box-shadow:

0 18px 40px
rgba(15,23,42,.18),

0 0 0 4px
rgba(37,99,235,.06);
}


/* =========================================================
   EXAM CODE
========================================================= */

.exam-code{

font-size:25px;

font-weight:900;

color:#1d4ed8;

letter-spacing:1px;

line-height:1.2;

margin-bottom:6px;
}


.exam-card small{

display:block;

color:#64748b;

font-size:13px;

font-weight:600;
}


/* =========================================================
   PREMIUM SELECT BUTTON
========================================================= */

.select-btn{

min-width:135px;

height:48px;

border:none;

border-radius:14px;

background:

linear-gradient(
135deg,
#2563eb,
#1d4ed8
);

color:#fff;

font-size:14px;

font-weight:800;

letter-spacing:.3px;

cursor:pointer;

box-shadow:

0 8px 18px
rgba(37,99,235,.30);

transition:

transform .2s ease,
box-shadow .2s ease;
}


.select-btn:hover{

transform:
translateY(-2px)
scale(1.03);

box-shadow:

0 12px 25px
rgba(37,99,235,.42);
}


.select-btn:active{

transform:
scale(.97);
}


/* =========================================================
   LOGIN BOX
========================================================= */

#loginBox{

margin-top:32px;

padding:28px;

border-radius:24px;

background:

linear-gradient(
145deg,
rgba(255,255,255,.98),
rgba(248,250,252,.98)
);

border:
1px solid
rgba(37,99,235,.15);

box-shadow:

0 18px 45px
rgba(15,23,42,.15);

animation:
loginAppear .35s ease;
}


@keyframes loginAppear{

from{

opacity:0;

transform:
translateY(15px);

}

to{

opacity:1;

transform:
translateY(0);

}

}


/* =========================================================
   SELECTED EXAM
========================================================= */

#selectedCode{

display:block;

width:100%;

padding:15px 18px;

margin:
0 0 22px;

border-radius:16px;

background:

linear-gradient(
135deg,
#eff6ff,
#dbeafe
);

border:
1px solid
#bfdbfe;

color:#1d4ed8;

font-size:16px;

font-weight:800;

text-align:center;

box-shadow:

inset
0 1px 0
rgba(255,255,255,.8);
}


/* =========================================================
   INPUT GROUP
========================================================= */

.input-group{

position:relative;

margin-bottom:16px;
}


.input-group i{

position:absolute;

left:18px;

top:50%;

transform:
translateY(-50%);

width:25px;

text-align:center;

color:#2563eb;

font-size:18px;

z-index:2;
}


.input-group input{

width:100%;

height:58px;

padding:
0 18px 0 55px;

border:
2px solid
#e2e8f0;

border-radius:15px;

background:#fff;

color:#0f172a;

font-size:16px;

font-weight:600;

outline:none;

box-shadow:

0 5px 15px
rgba(15,23,42,.06);

transition:

border-color .2s ease,
box-shadow .2s ease,
transform .2s ease;
}


.input-group input::placeholder{

color:#94a3b8;

font-weight:500;
}


.input-group input:focus{

border-color:#2563eb;

box-shadow:

0 0 0 4px
rgba(37,99,235,.10),

0 8px 20px
rgba(15,23,42,.08);

transform:
translateY(-1px);
}


/* =========================================================
   PIN INFO
========================================================= */

.pin-info{

display:flex;

align-items:center;

gap:8px;

padding:11px 14px;

margin:
2px 0 15px;

border-radius:12px;

background:

linear-gradient(
135deg,
#fffbeb,
#fef3c7
);

border:
1px solid
#fcd34d;

color:#92400e;

font-size:12px;

font-weight:700;

text-align:left;
}


/* =========================================================
   PREMIUM CONTINUE BUTTON
========================================================= */

#continueBtn{

width:100%;

height:60px;

margin-top:6px;

border:none;

border-radius:16px;

background:

linear-gradient(
135deg,
#0f172a,
#1d4ed8,
#2563eb
);

color:#fff;

font-size:18px;

font-weight:800;

letter-spacing:.5px;

cursor:pointer;

box-shadow:

0 12px 28px
rgba(29,78,216,.30);

position:relative;

overflow:hidden;

transition:

transform .2s ease,
box-shadow .2s ease;
}


#continueBtn::before{

content:"";

position:absolute;

top:0;

left:-100%;

width:70%;

height:100%;

background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.20),
transparent
);

transform:
skewX(-20deg);

transition:
left .6s ease;
}


#continueBtn:hover::before{

left:140%;
}


#continueBtn:hover{

transform:
translateY(-3px);

box-shadow:

0 17px 35px
rgba(29,78,216,.42);
}


#continueBtn:active{

transform:
translateY(0)
scale(.98);
}


#continueBtn:disabled{

opacity:.65;

cursor:not-allowed;

transform:none;

box-shadow:none;
}


/* =========================================================
   STATUS
========================================================= */

.status-message{

display:none;

margin-top:15px;

padding:13px 15px;

border-radius:13px;

background:#f8fafc;

border:
1px solid
#e2e8f0;

color:#1e3a8a;

text-align:center;

font-size:13px;

font-weight:700;

line-height:1.6;

box-shadow:
0 5px 15px
rgba(15,23,42,.06);
}


/* =========================================================
   NO LIVE EXAM
========================================================= */

.no-exam{

background:#fff;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:
0 10px 25px
rgba(0,0,0,.15);
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes fade{

from{

opacity:0;

transform:
translateY(25px);

}

to{

opacity:1;

transform:
translateY(0);

}

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

body{

padding:12px;

background-attachment:
scroll;
}


.container{

padding-top:15px;
}


.logo{

margin-bottom:25px;
}


.logo-img{

width:105px;

margin-bottom:12px;
}


.logo h1{

}


.logo p{

}

}

}

}

}


.exam-card{

gap:12px;
}

}


.exam-card small{

}


.select-btn{

0 14px;

}

/* =========================================================

========================================================= */

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="logo">

<img
src="icon-512.png"
class="logo-img"
alt="THE STUDY POINT">


<h1>
THE STUDY POINT
</h1>


<p>
Computer Based Test
</p>


<h2 id="examTitle">
AVAILABLE EXAMS
</h2>


<h3>
SESSION 2026-27
</h3>

</div>


<!-- =====================================================
     MAIN CARD
===================================================== -->

<div class="card">


<h2>
Available Exam Codes
</h2>


<div id="examList">

Loading...

</div>


<!-- =====================================================
     LOGIN BOX
===================================================== -->

<div
id="loginBox"
style="display:none;">


<h3 id="selectedCode">
</h3>


<!-- ROLL NUMBER -->

<div class="input-group">

<i class="fas fa-id-card"></i>

<input
type="text"
id="roll"
placeholder="Enter Roll Number"
autocomplete="off"
maxlength="30">

</div>


<!-- PIN INFORMATION -->

<div class="pin-info">

<i class="fas fa-shield-halved"></i>

<span>
इस परीक्षा का 4-digit Exam PIN Admin से प्राप्त करें।
</span>

</div>


<!-- EXAM PIN -->

<div class="input-group">

<i class="fas fa-key"></i>

<input
type="password"
id="examPin"
placeholder="Enter 4-Digit Exam PIN"
autocomplete="off"
inputmode="numeric"
maxlength="4">

</div>


<!-- CONTINUE -->

<button
id="continueBtn"
type="button">

<i class="fas fa-lock-open"></i>

&nbsp; CONTINUE TO EXAM

</button>


<!-- STATUS -->

<div
id="statusMessage"
class="status-message">
</div>


</div>


</div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db }
from "./firebase.js";


import {

collection,

query,

where,

getDocs,

doc,

getDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const examList =
document.getElementById(
"examList"
);


const loginBox =
document.getElementById(
"loginBox"
);


const selectedCode =
document.getElementById(
"selectedCode"
);


const rollInput =
document.getElementById(
"roll"
);


const pinInput =
document.getElementById(
"examPin"
);


const continueBtn =
document.getElementById(
"continueBtn"
);


const statusMessage =
document.getElementById(
"statusMessage"
);


/* =========================================================
   VARIABLES
========================================================= */

let selectedExamId="";

let selectedExamCode="";


/* =========================================================
   STATUS MESSAGE
========================================================= */

function showStatus(message){

statusMessage.textContent =
message;

statusMessage.style.display =
"block";

}


function hideStatus(){

statusMessage.textContent =
"";

statusMessage.style.display =
"none";

}


/* =========================================================
   LOAD EXAMS
========================================================= */

async function loadExams(){

examList.innerHTML =
"Loading...";


try{


const snap =
await getDocs(
collection(
db,
"cbtTests"
)
);


const now =
new Date();


let liveExamFound =
false;

let upcomingExamFound =
false;


examList.innerHTML =
"";


if(snap.empty){

showNoLiveExam();

return;

}


/* =====================================================
   LOOP EXAMS
===================================================== */

snap.forEach(
(docSnap)=>{


const exam =
docSnap.data();


const start =
new Date(
exam.start
);


const end =
new Date(
exam.end
);


/* ONLY OPEN */

if(
exam.status !==
"OPEN"
){

return;

}


/* =================================================
   UPCOMING
================================================= */

if(
now < start
){

upcomingExamFound =
true;


examList.innerHTML += `

<div style="
background:#fff;
padding:25px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
box-shadow:
0 10px 25px
rgba(0,0,0,.15);
">

<h2 style="
color:#2563eb;
">

📅 Upcoming Exam

</h2>


<p style="
margin-top:10px;
font-weight:700;
">

${escapeHTML(
exam.testName ||
exam.examCode ||
"CBT Exam"
)}

</p>


<p style="
color:#666;
margin-top:5px;
">

Starts :
${escapeHTML(
exam.start || ""
)}

</p>

</div>

`;


return;

}


/* =================================================
   EXPIRED
================================================= */

if(
now > end
){

return;

}


/* =================================================
   LIVE EXAM
================================================= */

liveExamFound =
true;


examList.innerHTML += `

<div class="exam-card">

<div>

<div class="exam-code">

${escapeHTML(
exam.examCode ||
"EXAM"
)}

</div>


<small>

${escapeHTML(
exam.subject ||
""
)}

</small>

</div>


<button
class="select-btn"
type="button"
onclick="selectExam(
'${escapeJS(docSnap.id)}',
'${escapeJS(
exam.examCode || ""
)}'
)">

<i class="fas fa-arrow-right"></i>

&nbsp; SELECT EXAM

</button>

</div>

`;

});


/* =================================================
   NO LIVE
================================================= */

if(
!liveExamFound
){

if(
upcomingExamFound
){

return;

}


showNoLiveExam();

}


}
catch(error){


console.error(
"Load Exam Error:",
error
);


examList.innerHTML = `

<div class="no-exam">

<div style="
font-size:45px;
">

⚠️

</div>


<h2 style="
color:#b91c1c;
">

Unable to Load Exams

</h2>


<p style="
margin-top:8px;
color:#555;
">

Please try again later.

</p>

</div>

`;

}

}


/* =========================================================
   NO LIVE EXAM
========================================================= */

function showNoLiveExam(){

examList.innerHTML = `

<div class="no-exam">

<div style="
font-size:55px;
">

⏳

</div>


<h2 style="
color:#1d4ed8;
">

No Live Exam

</h2>


<p style="
margin-top:10px;
color:#555;
">

There is no live exam right now.
Please come back at the scheduled time.

</p>

</div>

`;

}


/* =========================================================
   SELECT EXAM
========================================================= */

window.selectExam =
function(id,code){


selectedExamId =
id;


selectedExamCode =
code;


loginBox.style.display =
"block";


hideStatus();


selectedCode.innerHTML =

'<i class="fas fa-circle-check"></i> ' +

' Selected Exam : <b>' +

escapeHTML(code) +

'</b>';


rollInput.value =
"";


pinInput.value =
"";


setTimeout(
function(){

rollInput.focus();


loginBox.scrollIntoView({

behavior:"smooth",

block:"center"

});


},
100
);

};


/* =========================================================
   CONTINUE
========================================================= */

continueBtn.onclick =
async function(){


const roll =
rollInput.value.trim();


const examPin =
pinInput.value.trim();


/* =================================================
   ROLL VALIDATION
================================================= */

if(!roll){

showStatus(
"Please enter your Roll Number."
);

rollInput.focus();

return;

}


/* =================================================
   EXAM VALIDATION
================================================= */

if(!selectedExamId){

showStatus(
"Please select an exam first."
);

return;

}


/* =================================================
   PIN VALIDATION
================================================= */

if(
! /^\d{4}$/.test(examPin)
){

showStatus(
"Please enter a valid 4-digit Exam PIN."
);

pinInput.focus();

return;

}


continueBtn.disabled =
true;


continueBtn.innerHTML =
'<i class="fas fa-spinner fa-spin"></i> CHECKING...';


hideStatus();


try{


/* =================================================
   STEP 1
   GET EXAM
================================================= */

const examSnap =
await getDoc(

doc(
db,
"cbtTests",
selectedExamId
)

);


if(
!examSnap.exists()
){

showStatus(
"Exam not found."
);

continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


const exam =
examSnap.data();


/* =================================================
   CHECK STATUS
================================================= */

if(
exam.status !==
"OPEN"
){

showStatus(
"यह परीक्षा अभी उपलब्ध नहीं है."
);

continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


/* =================================================
   CHECK TIME
================================================= */

const now =
new Date();


const start =
new Date(
exam.start
);


const end =
new Date(
exam.end
);


if(
now < start
){

showStatus(
"यह परीक्षा अभी शुरू नहीं हुई है."
);

continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


if(
now > end
){

showStatus(
"इस परीक्षा का समय समाप्त हो चुका है."
);

continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


/* =================================================
   VERIFY EXAM PIN
================================================= */

const savedPin =
String(
exam.examPin || ""
).trim();


if(
!savedPin
){

showStatus(
"इस Exam का PIN अभी Admin ने generate नहीं किया है."
);

continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


if(
examPin !==
savedPin
){

showStatus(
"❌ गलत Exam PIN. कृपया सही 4-digit PIN डालें."
);

pinInput.value =
"";

pinInput.focus();


continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


/* =================================================
   STEP 2
   FIND STUDENT
================================================= */

let student =
null;


/* =================================================
   NEW STUDENT
================================================= */

const newStudentQuery =
query(

collection(
db,
"subscriptionStudents"
),

where(
"roll",
"==",
roll
)

);


const newStudentSnap =
await getDocs(
newStudentQuery
);


if(
!newStudentSnap.empty
){

const newData =
newStudentSnap
.docs[0]
.data();


const approved =

newData.status ===
"approved" ||

newData.status ===
"Approved" ||

newData.status ===
"APPROVED" ||

newData.enabled ===
true;


if(
!approved
){

showStatus(
"Your registration is pending Admin Approval. Please wait until the Admin approves your registration."
);

continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


student = {

Roll:
newData.roll ||
roll,

Name:
newData.name ||
"",

Class:
newData.className ||
"",

Mobile:
newData.mobile ||
"",

Father:
newData.fatherName ||
""

};

}


/* =================================================
   OLD STUDENT
================================================= */

if(
!student
){

const oldStudentQuery =
query(

collection(
db,
"students_v2"
),

where(
"Roll",
"==",
roll
)

);


const oldStudentSnap =
await getDocs(
oldStudentQuery
);


if(
!oldStudentSnap.empty
){

student =
oldStudentSnap
.docs[0]
.data();

}

}


/* =================================================
   STUDENT NOT FOUND
================================================= */

if(
!student
){

showStatus(
"Invalid Roll Number. Please enter a valid registered Roll Number."
);

continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}


/* =================================================
   CHECK PREVIOUS RESPONSE
================================================= */

const responseId =
selectedExamId +
"_" +
student.Roll;


const responseSnap =
await getDoc(

doc(
db,
"cbtResponses",
responseId
)

);


if(
responseSnap.exists()
){

const response =
responseSnap.data();


if(

response.submitted ===
true &&

response.allowRetest ===
false

){

showStatus(

"Dear " +
(student.Name || "Student") +
", you have already submitted this exam. Re-examination is not allowed."

);


continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

return;

}

}


/* =================================================
   CLEAR OLD SESSION
================================================= */

sessionStorage.clear();


/* =================================================
   SAVE STUDENT
================================================= */

sessionStorage.setItem(
"studentRoll",
student.Roll || roll
);


sessionStorage.setItem(
"studentName",
student.Name || ""
);


sessionStorage.setItem(
"studentClass",
student.Class || ""
);


sessionStorage.setItem(
"examId",
selectedExamId
);


sessionStorage.setItem(
"examCode",
selectedExamCode
);


/* =================================================
   PIN VERIFIED
================================================= */

sessionStorage.setItem(
"examPinVerified",
"true"
);


sessionStorage.setItem(
"verifiedExamId",
selectedExamId
);


/* =================================================
   OPEN DASHBOARD
================================================= */

location.href =
"exam-dashboard.html";


}
catch(error){


console.error(
"CBT Login Error:",
error
);


showStatus(
"Unable to verify details. Please try again."
);


continueBtn.disabled =
false;

continueBtn.innerHTML =
'<i class="fas fa-lock-open"></i> &nbsp; CONTINUE TO EXAM';

}

};


/* =========================================================
   ENTER KEY - ROLL
========================================================= */

rollInput.addEventListener(
"keydown",
function(event){

if(

event.key ===
"Enter" &&

!continueBtn.disabled

){

continueBtn.click();

}

});


/* =========================================================
   ENTER KEY - PIN
========================================================= */

pinInput.addEventListener(
"keydown",
function(event){

if(

event.key ===
"Enter" &&

!continueBtn.disabled

){

continueBtn.click();

}

});


/* =========================================================
   ONLY NUMBERS IN PIN
========================================================= */

pinInput.addEventListener(
"input",
function(){

this.value =
this.value
.replace(/\D/g,"")
.slice(0,4);

});


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(value){

return String(value)

.replace(
/\\/g,
"\\\\"
)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
'\\"'
)

.replace(
/\r/g,
"\\r"
)

.replace(
/\n/g,
"\\n"
);

}


/* =========================================================
   LOAD
========================================================= */

loadExams();

</script>

</body>

  </html>
