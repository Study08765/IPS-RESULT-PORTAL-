<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>THE STUDY POINT | Subject Wise Mock Tests</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Poppins,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    color:#173b62;

    background:
    radial-gradient(
        circle at 10% 5%,
        rgba(0,105,190,.10),
        transparent 30%
    ),
    radial-gradient(
        circle at 90% 25%,
        rgba(255,215,0,.08),
        transparent 30%
    ),
    linear-gradient(
        135deg,
        #edf7ff,
        #ffffff,
        #edf5ff
    );
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:58px;

    padding:
    7px 12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
    linear-gradient(
        135deg,
        #022653,
        #0759a8,
        #00396f
    );

    border-bottom:
    1px solid rgba(255,215,0,.45);

    box-shadow:
    0 7px 22px rgba(0,35,75,.25);

    color:#fff;

    position:relative;

    z-index:10;
}


.brand{

    display:flex;

    align-items:center;

    gap:8px;

    min-width:0;
}


.brand img{

    width:36px;
    height:36px;

    border-radius:50%;

    object-fit:cover;

    padding:2px;

    background:#fff;

    border:1px solid #ffd700;
}


.brand-title{

    color:#ffd700;

    font-size:13px;

    font-weight:900;

    line-height:1.1;

    white-space:nowrap;
}


.brand-sub{

    color:#d9efff;

    font-size:5px;

    font-weight:700;

    letter-spacing:.7px;

    margin-top:2px;
}


.dashboard-btn{

    border:
    1px solid rgba(255,215,0,.65);

    background:
    rgba(255,255,255,.10);

    color:#ffd700;

    border-radius:20px;

    padding:
    7px 10px;

    font-size:6px;

    font-weight:900;

    white-space:nowrap;

    cursor:pointer;
}


/* =====================================================
   MAIN
===================================================== */

.main{

    height:
    calc(100vh - 58px);

    overflow:hidden;

    width:100%;

    max-width:1000px;

    margin:auto;

    padding:
    9px 11px 10px;

    position:relative;
}


/* =====================================================
   HOME VIEW
===================================================== */

#homeView{

    height:100%;

    display:flex;

    flex-direction:column;
}


/* =====================================================
   HERO
===================================================== */

.hero{

    flex-shrink:0;

    height:92px;

    position:relative;

    overflow:hidden;

    padding:
    14px 17px;

    border-radius:21px;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #063d73,
        #087cc9,
        #07569a
    );

    border:
    1px solid rgba(255,255,255,.16);

    box-shadow:
    0 10px 26px rgba(0,70,140,.20);

    margin-bottom:8px;
}


.hero::before{

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    right:-70px;
    top:-105px;

    background:
    radial-gradient(
        circle,
        rgba(255,215,0,.24),
        transparent 68%
    );
}


.hero h1{

    position:relative;

    z-index:2;

    color:#ffd700;

    font-size:20px;

    font-weight:900;

    line-height:1.2;
}


.hero p{

    position:relative;

    z-index:2;

    color:#e6f6ff;

    font-size:7px;

    font-weight:600;

    margin-top:4px;
}


.hero-badge{

    position:relative;

    z-index:2;

    display:inline-flex;

    align-items:center;

    gap:4px;

    margin-top:7px;

    padding:
    4px 8px;

    border-radius:20px;

    background:
    rgba(0,0,0,.14);

    border:
    1px solid rgba(255,215,0,.35);

    color:#fff;

    font-size:5.5px;

    font-weight:800;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

    height:31px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:7px;

    background:#fff;

    border:
    1px solid #d7e5ef;

    border-radius:13px;

    padding:
    0 10px;

    box-shadow:
    0 5px 13px rgba(30,70,110,.06);

    margin-bottom:7px;
}


.search-box i{

    color:#0759a8;

    font-size:10px;
}


.search-box input{

    width:100%;

    border:0;

    outline:none;

    background:transparent;

    color:#173b62;

    font-size:7px;

    font-weight:600;
}


.search-box input::placeholder{

    color:#9aabba;
}


/* =====================================================
   SECTION HEADING
===================================================== */

.section-head{

    height:24px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:5px;
}


.section-head h2{

    color:#07549c;

    font-size:9px;

    font-weight:900;
}


.total-badge{

    padding:
    4px 7px;

    border-radius:15px;

    color:#8b6810;

    background:#fffbe9;

    border:
    1px solid #d8b43b;

    font-size:5.5px;

    font-weight:900;
}


/* =====================================================
   SUBJECT AREA
===================================================== */

.subject-area{

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    grid-template-rows:
    repeat(3,1fr);

    gap:7px;
}


/* =====================================================
   SUBJECT CARD
===================================================== */

.subject-card{

    position:relative;

    overflow:hidden;

    min-height:0;

    border-radius:16px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f3f9fd
    );

    border:
    1px solid #d4e3ed;

    box-shadow:
    0 6px 16px rgba(30,70,110,.08);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    cursor:pointer;

    transition:.22s ease;
}


.subject-card:hover{

    transform:
    translateY(-2px);

    border-color:#d5af34;

    box-shadow:
    0 10px 22px rgba(30,70,110,.13);
}


.subject-card::before{

    content:"";

    position:absolute;

    top:0;

    left:12%;

    right:12%;

    height:2px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #ffd700,
        #a67c10,
        #ffd700,
        transparent
    );
}


.subject-card::after{

    content:"";

    position:absolute;

    width:100px;
    height:100px;

    right:-55px;
    bottom:-55px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(0,100,180,.08),
        transparent 68%
    );
}


/* =====================================================
   SUBJECT NAME ABOVE BUTTON
===================================================== */

.subject-heading{

    position:relative;

    z-index:2;

    color:#07549c;

    font-size:17px;

    font-weight:900;

    line-height:1.1;

    margin-bottom:5px;

    text-transform:uppercase;
}


.subject-desc{

    position:relative;

    z-index:2;

    color:#71869a;

    font-size:5.5px;

    font-weight:700;

    margin-bottom:7px;
}


/* =====================================================
   LUXURY SUBJECT BUTTON
===================================================== */

.subject-button{

    position:relative;

    z-index:2;

    width:
    calc(100% - 20px);

    height:34px;

    border:0;

    border-radius:11px;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #032b5a,
        #0759a8,
        #003b78
    );

    border:
    1px solid rgba(255,215,0,.55);

    box-shadow:
    0 5px 12px rgba(0,55,110,.20),
    inset 0 1px 0 rgba(255,255,255,.15);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    font-size:7px;

    font-weight:900;

    cursor:pointer;
}


.subject-button i{

    color:#ffd700;

    font-size:9px;
}


.subject-count{

    position:absolute;

    z-index:3;

    right:13px;

    bottom:8px;

    padding:
    3px 5px;

    border-radius:7px;

    color:#86640a;

    background:#fffbe8;

    border:
    1px solid #dfc15c;

    font-size:4.5px;

    font-weight:900;
}


/* =====================================================
   SUBJECT COLORS
===================================================== */

.subject-card.hindi .subject-heading{
    color:#0759a8;
}

.subject-card.english .subject-heading{
    color:#5939a7;
}

.subject-card.mathematics .subject-heading{
    color:#08734b;
}

.subject-card.science .subject-heading{
    color:#087e78;
}

.subject-card.social .subject-heading{
    color:#9a6408;
}

.subject-card.drawing .subject-heading{
    color:#a32b56;
}


/* =====================================================
   SUBJECT VIEW
===================================================== */

#subjectView{

    display:none;

    height:100%;

    flex-direction:column;
}


#subjectView.show{

    display:flex;
}


/* =====================================================
   BACK
===================================================== */

.back-btn{

    height:29px;

    flex-shrink:0;

    align-self:flex-start;

    border:
    1px solid #d0dfeb;

    background:#fff;

    color:#07549c;

    border-radius:18px;

    padding:
    0 11px;

    font-size:6px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
    0 4px 10px rgba(30,70,110,.06);

    margin-bottom:6px;
}


/* =====================================================
   SELECTED SUBJECT HEADER
===================================================== */

.selected-header{

    height:63px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:10px;

    padding:
    8px 11px;

    border-radius:17px;

    background:
    linear-gradient(
        135deg,
        #063d73,
        #087cc9,
        #07569a
    );

    border:
    1px solid rgba(255,215,0,.38);

    box-shadow:
    0 8px 20px rgba(0,70,140,.16);

    margin-bottom:7px;
}


.selected-icon{

    width:43px;
    height:43px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    color:#ffd700;

    background:
    rgba(0,0,0,.16);

    border:
    1px solid #ffd700;

    font-size:18px;
}


.selected-name{

    color:#ffd700;

    font-size:17px;

    font-weight:900;
}


.selected-sub{

    color:#dcefff;

    font-size:6px;

    font-weight:700;

    margin-top:2px;
}


/* =====================================================
   TEST AREA
===================================================== */

.test-area{

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;
}


.test-list{

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

    gap:7px;
}


/* =====================================================
   TEST CARD FULL LINE
===================================================== */

.test-card{

    flex:1;

    min-height:0;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    gap:10px;

    padding:
    8px 10px;

    border-radius:15px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f7fbfe
    );

    border:
    1px solid #d6e4ee;

    box-shadow:
    0 5px 13px rgba(30,70,110,.07);
}


.test-card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:
    linear-gradient(
        180deg,
        #0759a8,
        #0ca85a
    );
}


.test-number{

    width:37px;
    height:37px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:11px;

    color:#ffd700;

    background:
    linear-gradient(
        145deg,
        #0759a8,
        #003b78
    );

    border:
    1px solid #d8b337;

    font-size:8px;

    font-weight:900;
}


.test-content{

    flex:1;

    min-width:0;
}


.test-name{

    color:#174d7f;

    font-size:10px;

    font-weight:900;

    line-height:1.35;
}


.test-meta{

    display:flex;

    flex-wrap:wrap;

    gap:4px;

    margin-top:4px;
}


.meta-pill{

    padding:
    3px 5px;

    border-radius:6px;

    color:#71869a;

    background:#f0f6fa;

    border:
    1px solid #dfeaf2;

    font-size:4.8px;

    font-weight:700;
}


/* =====================================================
   START BUTTON
===================================================== */

.start-test{

    width:105px;

    flex-shrink:0;

    height:32px;

    border:0;

    border-radius:10px;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #087a3b,
        #0ca85a
    );

    box-shadow:
    0 5px 12px rgba(0,120,60,.16);

    font-size:6px;

    font-weight:900;

    cursor:pointer;
}


.start-test i{

    font-size:7px;
}


/* =====================================================
   PAGINATION
===================================================== */

.pagination{

    height:35px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    margin-top:5px;
}


.page-btn{

    height:28px;

    min-width:75px;

    border:
    1px solid #d2e0eb;

    border-radius:14px;

    background:#fff;

    color:#07549c;

    font-size:5.5px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
    0 3px 9px rgba(30,70,110,.06);
}


.page-btn:disabled{

    opacity:.4;

    cursor:not-allowed;
}


.page-info{

    color:#71869a;

    font-size:5.5px;

    font-weight:900;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    flex:1;

    min-height:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    background:#fff;

    border:
    1px solid #dce8f3;

    border-radius:17px;

    color:#7890a5;

    font-size:8px;

    padding:20px;
}


.empty i{

    color:#9ab0c1;

    font-size:25px;

    margin-bottom:8px;
}


/* =====================================================
   TABLET
===================================================== */

@media(min-width:601px){

    .subject-area{

        gap:9px;
    }


    .subject-card{

        border-radius:19px;
    }


    .subject-heading{

        font-size:19px;
    }


    .subject-button{

        height:39px;

        font-size:8px;
    }


    .test-name{

        font-size:12px;
    }


    .start-test{

        width:125px;

        height:37px;

        font-size:7px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{

        height:55px;

        padding:
        6px 9px;
    }


    .main{

        height:
        calc(100vh - 55px);

        padding:
        7px 8px;
    }


    .brand img{

        width:31px;
        height:31px;
    }


    .brand-title{

        font-size:10px;
    }


    .brand-sub{

        font-size:4.5px;
    }


    .dashboard-btn{

        padding:
        6px 8px;

        font-size:5px;
    }


    .hero{

        height:83px;

        padding:
        12px 14px;

        border-radius:18px;

        margin-bottom:6px;
    }


    .hero h1{

        font-size:17px;
    }


    .hero p{

        font-size:5.5px;

        margin-top:3px;
    }


    .hero-badge{

        margin-top:6px;

        padding:
        3px 6px;

        font-size:4.5px;
    }


    .search-box{

        height:27px;

        margin-bottom:5px;

        border-radius:11px;
    }


    .search-box input{

        font-size:6px;
    }


    .section-head{

        height:20px;

        margin-bottom:4px;
    }


    .section-head h2{

        font-size:7px;
    }


    .total-badge{

        font-size:4.5px;

        padding:
        3px 6px;
    }


    .subject-area{

        gap:6px;
    }


    .subject-card{

        border-radius:14px;
    }


    .subject-heading{

        font-size:14px;

        margin-bottom:3px;
    }


    .subject-desc{

        font-size:4.5px;

        margin-bottom:5px;
    }


    .subject-button{

        width:
        calc(100% - 14px);

        height:29px;

        border-radius:9px;

        font-size:5.5px;

        gap:4px;
    }


    .subject-button i{

        font-size:7px;
    }


    .subject-count{

        right:8px;

        bottom:5px;

        font-size:3.8px;

        padding:
        2px 4px;
    }


    .back-btn{

        height:26px;

        font-size:5px;

        margin-bottom:5px;
    }


    .selected-header{

        height:55px;

        border-radius:14px;

        margin-bottom:5px;

        padding:
        6px 8px;
    }


    .selected-icon{

        width:38px;
        height:38px;

        border-radius:10px;

        font-size:15px;
    }


    .selected-name{

        font-size:14px;
    }


    .selected-sub{

        font-size:5px;
    }


    .test-list{

        gap:5px;
    }


    .test-card{

        padding:
        6px 7px;

        gap:7px;

        border-radius:12px;
    }


    .test-number{

        width:31px;
        height:31px;

        border-radius:9px;

        font-size:7px;
    }


    .test-name{

        font-size:7px;

        line-height:1.3;
    }


    .test-meta{

        margin-top:3px;

        gap:3px;
    }


    .meta-pill{

        font-size:3.8px;

        padding:
        2px 4px;
    }


    .start-test{

        width:82px;

        height:28px;

        border-radius:8px;

        font-size:4.5px;
    }


    .start-test i{

        font-size:5px;
    }


    .pagination{

        height:30px;

        margin-top:3px;
    }


    .page-btn{

        height:24px;

        min-width:62px;

        font-size:4.5px;
    }


    .page-info{

        font-size:4.5px;
    }

}


/* =====================================================
   VERY SMALL
===================================================== */

@media(max-width:350px){

    .hero{

        height:78px;
    }


    .hero h1{

        font-size:15px;
    }


    .subject-heading{

        font-size:12px;
    }


    .subject-button{

        font-size:5px;
    }


    .test-name{

        font-size:6.5px;
    }


    .start-test{

        width:75px;

        font-size:4px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="brand">

        <img
        src="icon-512.png"
        onerror="this.style.display='none'">

        <div>

            <div class="brand-title">
                THE STUDY POINT
            </div>

            <div class="brand-sub">
                SUBJECT-WISE MOCK TEST PORTAL
            </div>

        </div>

    </div>


    <button
    class="dashboard-btn"
    onclick="location.href='student-dashboard.html'">

        <i class="fa-solid fa-house"></i>

        &nbsp; DASHBOARD

    </button>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- =================================================
         HOME
    ================================================== -->

    <section id="homeView">


        <!-- HERO -->

        <div class="hero">

            <h1>

                <i class="fa-solid fa-graduation-cap"></i>

                SUBJECT-WISE MOCK TEST

            </h1>


            <p>

                Choose your subject and start your
                practice test.

            </p>


            <div class="hero-badge">

                <i class="fa-solid fa-shield-halved"></i>

                PREMIUM CBT PRACTICE

            </div>

        </div>



        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
            id="searchInput"
            type="search"
            placeholder="Search subject...">

        </div>



        <!-- HEADING -->

        <div class="section-head">

            <h2>

                <i class="fa-solid fa-layer-group"></i>

                &nbsp; SELECT SUBJECT

            </h2>


            <span
            id="totalBadge"
            class="total-badge">

                0 TESTS

            </span>

        </div>



        <!-- SUBJECTS -->

        <div
        id="subjectArea"
        class="subject-area">

        </div>


    </section>



    <!-- =================================================
         SUBJECT VIEW
    ================================================== -->

    <section
    id="subjectView">


        <button
        class="back-btn"
        onclick="showSubjects()">

            <i class="fa-solid fa-arrow-left"></i>

            &nbsp; BACK TO SUBJECTS

        </button>



        <div
        id="selectedHeader"
        class="selected-header">

        </div>



        <div class="test-area">

            <div
            id="testList"
            class="test-list">

            </div>


            <div
            id="pagination"
            class="pagination">

            </div>

        </div>


    </section>


</main>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import { db } from "./firebase.js";

import {

    collection,
    getDocs

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =====================================================
   SUBJECTS
===================================================== */

const subjects=[

    {
        key:"Hindi",
        cls:"hindi",
        icon:"fa-language",
        desc:"हिंदी विषय के अभ्यास टेस्ट"
    },

    {
        key:"English",
        cls:"english",
        icon:"fa-a",
        desc:"English practice tests"
    },

    {
        key:"Mathematics",
        cls:"mathematics",
        icon:"fa-calculator",
        desc:"गणित के अभ्यास टेस्ट"
    },

    {
        key:"Science",
        cls:"science",
        icon:"fa-flask",
        desc:"विज्ञान के अभ्यास टेस्ट"
    },

    {
        key:"Social Science",
        cls:"social",
        icon:"fa-earth-asia",
        desc:"सामाजिक विज्ञान के अभ्यास टेस्ट"
    },

    {
        key:"Drawing",
        cls:"drawing",
        icon:"fa-palette",
        desc:"Drawing & Art practice tests"
    }

];



/* =====================================================
   ELEMENTS
===================================================== */

const subjectArea=
document.getElementById(
    "subjectArea"
);

const homeView=
document.getElementById(
    "homeView"
);

const subjectView=
document.getElementById(
    "subjectView"
);

const selectedHeader=
document.getElementById(
    "selectedHeader"
);

const testList=
document.getElementById(
    "testList"
);

const pagination=
document.getElementById(
    "pagination"
);

const searchInput=
document.getElementById(
    "searchInput"
);

const totalBadge=
document.getElementById(
    "totalBadge"
);



let allTests=[];

let currentSubject="";

let currentTests=[];

let currentPage=1;


/*
   एक page पर कितने tests
   दिखाने हैं
*/

const TESTS_PER_PAGE=3;



/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

    return String(value ?? "")

    .replace(
        /[&<>"']/g,
        m=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m])
    );

}



/* =====================================================
   NORMALIZE SUBJECT
===================================================== */

function normalizeSubject(subject){

    const s=
    String(subject || "")
    .trim()
    .toLowerCase();


    /* HINDI */

    if(

        s==="hindi" ||

        s.includes("हिंदी")

    ){

        return "Hindi";

    }


    /* ENGLISH */

    if(

        s==="english" ||

        s.includes("अंग्रेज")

    ){

        return "English";

    }


    /* MATHEMATICS */

    if(

        s==="math" ||

        s==="maths" ||

        s==="mathematics" ||

        s.includes("गणित")

    ){

        return "Mathematics";

    }


    /* SCIENCE */

    if(

        s==="science" ||

        s.includes("विज्ञान")

    ){

        return "Science";

    }


    /* SOCIAL SCIENCE */

    if(

        s==="social science" ||

        s==="social sciences" ||

        s==="social studies" ||

        s==="sst" ||

        s.includes("social science") ||

        s.includes("सामाजिक विज्ञान")

    ){

        return "Social Science";

    }


    /* DRAWING */

    if(

        s==="drawing" ||

        s==="art" ||

        s==="arts" ||

        s.includes("drawing") ||

        s.includes("चित्रकला") ||

        s.includes("ड्राइंग")

    ){

        return "Drawing";

    }


    return String(subject || "")
    .trim();

}



/* =====================================================
   SUBJECT CONFIG
===================================================== */

function getSubjectConfig(subject){

    return subjects.find(
        x=>x.key===subject
    );

}



/* =====================================================
   LOAD TESTS
===================================================== */

async function loadTests(){

    subjectArea.innerHTML=`

        <div
        class="empty"
        style="grid-column:1/-1">

            <i class="fa-solid fa-spinner fa-spin"></i>

            Loading Subjects...

        </div>

    `;


    try{

        const snap=
        await getDocs(

            collection(
                db,
                "mockTests"
            )

        );


        allTests=[];


        snap.forEach(docSnap=>{

            const data=
            docSnap.data();


            if(
                data.published===true
            ){

                allTests.push({

                    id:docSnap.id,

                    ...data

                });

            }

        });


        totalBadge.textContent=

        allTests.length+

        (
            allTests.length===1
            ? " TEST"
            : " TESTS"
        );


        renderSubjects();

    }
    catch(error){

        console.error(error);


        subjectArea.innerHTML=`

            <div
            class="empty"
            style="grid-column:1/-1">

                <i class="fa-solid fa-triangle-exclamation"></i>

                Mock Tests load नहीं हो सके।

                <br><br>

                ${esc(error.message)}

            </div>

        `;

    }

}



/* =====================================================
   GET SUBJECT TESTS
===================================================== */

function getTests(subject){

    return allTests.filter(
        test=>
        normalizeSubject(
            test.subject
        )===subject
    );

}



/* =====================================================
   RENDER SUBJECTS
===================================================== */

function renderSubjects(){

    const search=
    searchInput.value
    .trim()
    .toLowerCase();


    subjectArea.innerHTML=


    subjects.map(subject=>{


        const matches=
        getTests(subject.key);


        const searchable=
        (
            subject.key+
            " "+
            subject.desc
        )
        .toLowerCase();


        if(
            search &&
            !searchable.includes(search)
        ){

            return "";

        }


        return `

            <div
            class="
                subject-card
                ${subject.cls}
            "
            onclick="
                openSubject(
                    '${subject.key}'
                )
            ">


                <div class="subject-heading">

                    ${subject.key}

                </div>


                <div class="subject-desc">

                    ${subject.desc}

                </div>


                <button
                class="subject-button"
                onclick="
                    event.stopPropagation();
                    openSubject(
                        '${subject.key}'
                    );
                ">

                    <i
                    class="
                    fa-solid
                    ${subject.icon}
                    "></i>

                    ${subject.key.toUpperCase()}
                    MOCK TESTS

                    <i
                    class="fa-solid fa-arrow-right">
                    </i>

                </button>


                <span
                class="subject-count">

                    ${matches.length}

                    ${
                        matches.length===1
                        ? " TEST"
                        : " TESTS"
                    }

                </span>


            </div>

        `;

    }).join("");


    if(!subjectArea.innerHTML){

        subjectArea.innerHTML=`

            <div
            class="empty"
            style="grid-column:1/-1">

                <i
                class="fa-solid fa-magnifying-glass">
                </i>

                कोई subject नहीं मिला।

            </div>

        `;

    }

}



/* =====================================================
   OPEN SUBJECT
===================================================== */

window.openSubject=function(subject){

    currentSubject=subject;

    currentTests=
    getTests(subject);

    currentPage=1;


    const config=
    getSubjectConfig(subject);


    if(!config)
        return;


    homeView.style.display=
    "none";


    subjectView.classList.add(
        "show"
    );


    selectedHeader.innerHTML=`

        <div class="selected-icon">

            <i
            class="
            fa-solid
            ${config.icon}
            ">
            </i>

        </div>


        <div>

            <div class="selected-name">

                ${esc(config.key)}

            </div>


            <div class="selected-sub">

                ${currentTests.length}

                ${
                    currentTests.length===1
                    ? " MOCK TEST"
                    : " MOCK TESTS"
                }

                AVAILABLE

            </div>

        </div>

    `;


    renderTestPage();


    window.scrollTo({
        top:0
    });

};



/* =====================================================
   RENDER TEST PAGE
===================================================== */

function renderTestPage(){

    const total=
    currentTests.length;


    if(!total){

        testList.innerHTML=`

            <div class="empty">

                <i
                class="fa-solid fa-book-open">
                </i>

                अभी इस subject में कोई Mock Test उपलब्ध नहीं है।

                <br><br>

                नए tests जल्द उपलब्ध होंगे।

            </div>

        `;


        pagination.innerHTML="";

        return;

    }


    const totalPages=
    Math.ceil(
        total/TESTS_PER_PAGE
    );


    if(
        currentPage>totalPages
    ){

        currentPage=totalPages;

    }


    const start=
    (currentPage-1)*
    TESTS_PER_PAGE;


    const pageTests=
    currentTests.slice(
        start,
        start+TESTS_PER_PAGE
    );


    testList.innerHTML=


    pageTests.map(
    (test,index)=>{


        const actualIndex=
        start+index;


        const totalQuestions=
        Number(

            test.questions?.length ??

            test.totalQuestions ??

            0

        );


        const time=
        Number(
            test.timeLimit || 0
        );


        return `

            <div class="test-card">


                <div class="test-number">

                    ${
                        String(
                            actualIndex+1
                        )
                        .padStart(2,"0")
                    }

                </div>


                <div class="test-content">


                    <div class="test-name">

                        ${esc(
                            test.testName ||
                            "Mock Test"
                        )}

                    </div>


                    <div class="test-meta">


                        <span
                        class="meta-pill">

                            <i
                            class="fa-solid fa-list-ol">
                            </i>

                            ${totalQuestions}
                            QUESTIONS

                        </span>


                        <span
                        class="meta-pill">

                            <i
                            class="fa-solid fa-clock">
                            </i>

                            ${time}
                            MINUTES

                        </span>


                        ${
                            test.className
                            ?

                            `

                            <span
                            class="meta-pill">

                                <i
                                class="
                                fa-solid
                                fa-graduation-cap">
                                </i>

                                ${esc(
                                    test.className
                                )}

                            </span>

                            `

                            :

                            ""

                        }


                    </div>

                </div>


                <button
                class="start-test"
                onclick="
                    startTest(
                        '${esc(test.id)}'
                    )
                ">

                    <i
                    class="
                    fa-solid
                    fa-play">
                    </i>

                    &nbsp;

                    START MOCK TEST

                </button>


            </div>

        `;

    })
    .join("");


    /* PAGINATION */

    if(totalPages>1){

        pagination.innerHTML=`

            <button
            class="page-btn"
            onclick="previousPage()"
            ${currentPage===1 ? "disabled" : ""}>

                <i
                class="fa-solid fa-chevron-left">
                </i>

                &nbsp; PREVIOUS

            </button>


            <span
            class="page-info">

                PAGE
                ${currentPage}
                /
                ${totalPages}

            </span>


            <button
            class="page-btn"
            onclick="nextPage()"
            ${currentPage===totalPages ? "disabled" : ""}>

                NEXT

                &nbsp;

                <i
                class="fa-solid fa-chevron-right">
                </i>

            </button>

        `;

    }
    else{

        pagination.innerHTML=`

            <span
            class="page-info">

                ${total} MOCK TEST${total===1 ? "" : "S"}

            </span>

        `;

    }

}



/* =====================================================
   PREVIOUS
===================================================== */

window.previousPage=function(){

    if(currentPage>1){

        currentPage--;

        renderTestPage();

    }

};



/* =====================================================
   NEXT
===================================================== */

window.nextPage=function(){

    const totalPages=
    Math.ceil(
        currentTests.length/
        TESTS_PER_PAGE
    );


    if(
        currentPage<totalPages
    ){

        currentPage++;

        renderTestPage();

    }

};



/* =====================================================
   BACK
===================================================== */

window.showSubjects=function(){

    subjectView.classList.remove(
        "show"
    );


    homeView.style.display=
    "flex";


    window.scrollTo({
        top:0
    });

};



/* =====================================================
   START MOCK TEST
===================================================== */

window.startTest=function(id){

    if(!id)
        return;


    localStorage.setItem(
        "selectedMockTest",
        id
    );


    location.href=
    "mock-test-attempt.html";

};



/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    renderSubjects
);



/* =====================================================
   START
===================================================== */

loadTests();

</script>

</body>
  </html>
