<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#0759a8">

<title>THE STUDY POINT | Mock Tests</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    min-height:100%;
}

body{

    width:100%;
    min-height:100vh;

    overflow-x:hidden;

    color:#163d63;

    background:
    radial-gradient(
        circle at 8% 5%,
        rgba(0,91,170,.09),
        transparent 28%
    ),
    radial-gradient(
        circle at 92% 25%,
        rgba(255,215,0,.07),
        transparent 28%
    ),
    linear-gradient(
        135deg,
        #edf7ff,
        #ffffff,
        #eef6ff
    );
}


/* =========================================================
   HEADER
========================================================= */

.header{

    width:100%;

    min-height:58px;

    padding:8px 11px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
    linear-gradient(
        135deg,
        #022653,
        #0759a8,
        #00396f
    );

    border-bottom:
    1px solid rgba(255,215,0,.45);

    box-shadow:
    0 6px 18px rgba(0,35,75,.24);

    position:sticky;
    top:0;
    z-index:1000;
}


.brand{

    display:flex;

    align-items:center;

    gap:8px;

    min-width:0;
}


.logo{

    width:34px;
    height:34px;

    border-radius:50%;

    background:#fff;

    padding:2px;

    border:
    1px solid #ffd700;

    object-fit:cover;

    flex-shrink:0;
}


.brand-text{

    min-width:0;
}


.brand-name{

    color:#ffd700;

    font-size:12px;

    font-weight:900;

    line-height:1.1;

    white-space:nowrap;
}


.brand-sub{

    color:#d9efff;

    font-size:5px;

    font-weight:700;

    letter-spacing:.5px;

    margin-top:2px;

    white-space:nowrap;
}


.dashboard{

    border:
    1px solid rgba(255,215,0,.65);

    background:
    rgba(255,255,255,.10);

    color:#ffd700;

    border-radius:18px;

    padding:6px 9px;

    font-size:6px;

    font-weight:900;

    white-space:nowrap;

    cursor:pointer;
}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:
    10px 10px 25px;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    padding:
    15px 14px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #064078,
        #087cc9,
        #07569a
    );

    border:
    1px solid rgba(255,255,255,.16);

    box-shadow:
    0 10px 25px rgba(0,70,140,.18);

    margin-bottom:10px;
}


.hero::after{

    content:"";

    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    right:-50px;
    top:-65px;

    background:
    radial-gradient(
        circle,
        rgba(255,215,0,.20),
        transparent 68%
    );
}


.hero-title{

    position:relative;
    z-index:2;

    color:#ffd700;

    font-size:19px;

    font-weight:900;

    line-height:1.25;
}


.hero-sub{

    position:relative;
    z-index:2;

    color:#e7f6ff;

    font-size:7px;

    font-weight:600;

    margin-top:4px;
}


/* =========================================================
   SUBJECT HEADING
========================================================= */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:
    7px 2px 8px;
}


.section-title span{

    color:#07549c;

    font-size:9px;

    font-weight:900;

    letter-spacing:.3px;
}


.count{

    color:#8b6810;

    background:#fffbea;

    border:
    1px solid #d9b53c;

    padding:4px 7px;

    border-radius:15px;

    font-size:5px;

    font-weight:900;
}


/* =========================================================
   SUBJECT GRID
========================================================= */

.subject-grid{

    display:grid;

    grid-template-columns:
    repeat(2,minmax(0,1fr));

    gap:9px;
}


/* =========================================================
   SUBJECT CARD
========================================================= */

.subject-card{

    position:relative;

    overflow:hidden;

    min-height:142px;

    border-radius:17px;

    border:
    1px solid #d5e2ed;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f5faff
    );

    box-shadow:
    0 7px 18px rgba(30,70,110,.09);

    transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}


.subject-card::before{

    content:"";

    position:absolute;

    top:0;

    left:8%;

    right:8%;

    height:3px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #ffd700,
        #a77d12,
        #ffd700,
        transparent
    );
}


.subject-card.open{

    border-color:#d3ad35;

    box-shadow:
    0 9px 23px rgba(130,100,20,.13);
}


/* =========================================================
   SUBJECT BUTTON
========================================================= */

.subject-button{

    width:100%;

    min-height:142px;

    border:0;

    outline:none;

    background:transparent;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:12px;

    position:relative;
}


.subject-icon{

    width:55px;
    height:55px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:15px;

    color:#ffd700;

    background:
    linear-gradient(
        145deg,
        #0759a8,
        #003b78
    );

    border:
    2px solid #d8b337;

    box-shadow:
    0 5px 0 #164a7c,
    0 8px 15px rgba(0,55,110,.16);

    font-size:24px;

    margin-bottom:9px;

    transition:.2s;
}


.subject-name{

    color:#07549c;

    font-size:17px;

    font-weight:900;

    letter-spacing:.2px;

    line-height:1.15;

    text-align:center;

    text-transform:uppercase;
}


/* =========================================================
   SUBJECT COLORS
========================================================= */

.subject-card[data-subject="hindi"]
.subject-icon{

    background:
    linear-gradient(
        145deg,
        #087cc9,
        #064078
    );
}


.subject-card[data-subject="english"]
.subject-icon{

    background:
    linear-gradient(
        145deg,
        #7352d5,
        #38226f
    );
}


.subject-card[data-subject="mathematics"]
.subject-icon{

    background:
    linear-gradient(
        145deg,
        #07875a,
        #035337
    );
}


.subject-card[data-subject="science"]
.subject-icon{

    background:
    linear-gradient(
        145deg,
        #0ca59c,
        #075d58
    );
}


.subject-card[data-subject="social-science"]
.subject-icon{

    background:
    linear-gradient(
        145deg,
        #d58a12,
        #805000
    );
}


.subject-card[data-subject="drawing"]
.subject-icon{

    background:
    linear-gradient(
        145deg,
        #e94d91,
        #8d1f54
    );
}


/* =========================================================
   TEST AREA
========================================================= */

.test-area{

    display:none;

    padding:
    8px 9px 10px;

    border-top:
    1px solid #e1ebf3;

    background:
    linear-gradient(
        180deg,
        #f8fbfe,
        #ffffff
    );
}


.subject-card.open
.test-area{

    display:block;

    animation:
    testOpen .2s ease;
}


@keyframes testOpen{

    from{
        opacity:0;
        transform:translateY(-4px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   TEST ITEM
========================================================= */

.test-item{

    width:100%;

    min-height:64px;

    margin-top:6px;

    padding:
    7px 8px;

    display:flex;

    align-items:center;

    gap:8px;

    border:
    1px solid #dce7f0;

    border-radius:12px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f7fbfe
    );

    box-shadow:
    0 3px 9px rgba(30,70,110,.05);
}


/* NUMBER */

.test-number{

    width:29px;
    height:29px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:9px;

    color:#ffd700;

    background:
    linear-gradient(
        145deg,
        #0759a8,
        #003b78
    );

    border:
    1px solid #d8b337;

    font-size:7px;

    font-weight:900;
}


/* CONTENT */

.test-content{

    flex:1;

    min-width:0;

    overflow:hidden;
}


.test-name{

    color:#174d7f;

    font-size:10px;

    font-weight:900;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.test-meta{

    display:flex;

    align-items:center;

    gap:4px;

    margin-top:4px;

    white-space:nowrap;

    overflow:hidden;
}


.meta{

    color:#71869a;

    background:#f0f6fa;

    border:
    1px solid #dfeaf2;

    border-radius:6px;

    padding:
    2px 4px;

    font-size:5px;

    font-weight:800;

    white-space:nowrap;
}


/* =========================================================
   START BUTTON
========================================================= */

.start-test{

    flex-shrink:0;

    border:0;

    min-width:70px;

    padding:
    8px 8px;

    border-radius:9px;

    cursor:pointer;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #087a3b,
        #0ca85a
    );

    box-shadow:
    0 4px 9px rgba(0,120,60,.16);

    font-size:6px;

    font-weight:900;

    white-space:nowrap;
}


.start-test:active{

    transform:scale(.97);
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-subjects{

    display:none;

    border:0;

    outline:none;

    color:#07549c;

    background:#fff;

    border:
    1px solid #d8e5ef;

    border-radius:12px;

    padding:
    6px 9px;

    font-size:6px;

    font-weight:900;

    cursor:pointer;

    margin-bottom:7px;

    box-shadow:
    0 3px 9px rgba(30,70,110,.06);
}


body.subject-open
.back-subjects{

    display:inline-flex;

    align-items:center;

    gap:4px;
}


/* =========================================================
   EMPTY / NO TEST
========================================================= */

.no-test{

    padding:
    12px 8px;

    text-align:center;

    color:#8397a9;

    font-size:7px;

    font-weight:700;

    background:#fff;

    border:
    1px dashed #d4e1eb;

    border-radius:10px;
}


/* =========================================================
   WHEN SUBJECT IS OPEN
========================================================= */

body.subject-open
.subject-grid{

    grid-template-columns:1fr;

    gap:8px;
}


body.subject-open
.subject-card{

    min-height:auto;
}


body.subject-open
.subject-button{

    min-height:68px;

    flex-direction:row;

    justify-content:flex-start;

    gap:10px;

    padding:9px 11px;
}


body.subject-open
.subject-icon{

    width:42px;
    height:42px;

    border-radius:11px;

    font-size:18px;

    margin-bottom:0;

    box-shadow:
    0 3px 0 #164a7c;
}


body.subject-open
.subject-name{

    font-size:15px;

    text-align:left;
}


body.subject-open
.subject-card:not(.open){

    display:none;
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    grid-column:
    1 / -1;

    text-align:center;

    padding:35px 15px;

    color:#7890a5;

    font-size:9px;

    background:#fff;

    border-radius:16px;

    border:
    1px solid #dce8f3;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .container{

        padding:
        15px 15px 30px;
    }


    .subject-grid{

        grid-template-columns:
        repeat(2,1fr);

        gap:12px;
    }


    .subject-card,
    .subject-button{

        min-height:155px;
    }


    .subject-icon{

        width:62px;
        height:62px;

        font-size:27px;
    }


    .subject-name{

        font-size:20px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .container{

        padding:
        9px 8px 20px;
    }


    .hero{

        padding:
        14px 13px;

        border-radius:16px;
    }


    .hero-title{

        font-size:17px;
    }


    .hero-sub{

        font-size:6px;
    }


    .section-title{

        margin-top:6px;
    }


    .subject-grid{

        gap:8px;
    }


    .subject-card,
    .subject-button{

        min-height:130px;
    }


    .subject-icon{

        width:51px;
        height:51px;

        font-size:22px;

        margin-bottom:8px;
    }


    .subject-name{

        font-size:15px;
    }


    .test-item{

        min-height:61px;

        padding:
        7px;

        gap:6px;
    }


    .test-number{

        width:27px;
        height:27px;

        font-size:6px;
    }


    .test-name{

        font-size:9px;
    }


    .meta{

        font-size:4.5px;
    }


    .start-test{

        min-width:66px;

        padding:
        7px 6px;

        font-size:5.5px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:350px){

    .brand-name{

        font-size:10px;
    }


    .dashboard{

        font-size:5px;

        padding:
        5px 7px;
    }


    .subject-card,
    .subject-button{

        min-height:118px;
    }


    .subject-icon{

        width:46px;
        height:46px;

        font-size:20px;
    }


    .subject-name{

        font-size:13px;
    }


    .test-name{

        font-size:8px;
    }


    .start-test{

        min-width:60px;

        font-size:5px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="brand">

        <img
        src="icon-512.png"
        class="logo"
        onerror="this.style.display='none'">

        <div class="brand-text">

            <div class="brand-name">
                THE STUDY POINT
            </div>

            <div class="brand-sub">
                SUBJECT-WISE MOCK TEST PORTAL
            </div>

        </div>

    </div>


    <button
    class="dashboard"
    onclick="goDashboard()">

        <i class="fa-solid fa-house"></i>
        DASHBOARD

    </button>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


    <!-- HERO -->

    <section class="hero">

        <div class="hero-title">

            <i class="fa-solid fa-graduation-cap"></i>

            SUBJECT-WISE MOCK TEST

        </div>


        <div class="hero-sub">

            Choose your subject and start your practice test.

        </div>

    </section>


    <!-- BACK -->

    <button
    id="backSubjects"
    class="back-subjects"
    onclick="closeSubject()">

        <i class="fa-solid fa-arrow-left"></i>

        BACK TO SUBJECTS

    </button>


    <!-- SECTION -->

    <div class="section-title">

        <span id="sectionTitle">

            <i class="fa-solid fa-layer-group"></i>

            SELECT SUBJECT

        </span>


        <span
        id="countBadge"
        class="count">

            6 SUBJECTS

        </span>

    </div>


    <!-- SUBJECT GRID -->

    <div
    id="subjectGrid"
    class="subject-grid">

        <div class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <br><br>

            Loading Mock Tests...

        </div>

    </div>


</main>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import { db } from "./firebase.js";

import {
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIXED SUBJECTS
========================================================= */

const SUBJECTS = [

    {
        key:"hindi",
        name:"HINDI",
        icon:"fa-language"
    },

    {
        key:"english",
        name:"ENGLISH",
        icon:"fa-a"
    },

    {
        key:"mathematics",
        name:"MATHEMATICS",
        icon:"fa-calculator"
    },

    {
        key:"science",
        name:"SCIENCE",
        icon:"fa-flask"
    },

    {
        key:"social-science",
        name:"SOCIAL SCIENCE",
        icon:"fa-earth-asia"
    },

    {
        key:"drawing",
        name:"DRAWING",
        icon:"fa-palette"
    }

];


let allTests=[];

let currentSubject=null;


/* =========================================================
   ELEMENTS
========================================================= */

const subjectGrid=
document.getElementById(
    "subjectGrid"
);

const countBadge=
document.getElementById(
    "countBadge"
);

const sectionTitle=
document.getElementById(
    "sectionTitle"
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

    return String(value ?? "")
    .replace(
        /[&<>"']/g,
        m=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m])
    );

}


/* =========================================================
   NORMALIZE SUBJECT
========================================================= */

function normalizeSubject(value){

    const s=
    String(value || "")
    .trim()
    .toLowerCase();


    if(
        s==="hindi" ||
        s.includes("हिंदी")
    ){

        return "hindi";

    }


    if(
        s==="english" ||
        s.includes("अंग्रेज")
    ){

        return "english";

    }


    if(
        s==="math" ||
        s==="maths" ||
        s==="mathematics" ||
        s.includes("गणित")
    ){

        return "mathematics";

    }


    if(
        s==="science" ||
        s.includes("विज्ञान")
    ){

        return "science";

    }


    if(
        s==="social science" ||
        s==="social-science" ||
        s==="sst" ||
        s.includes("सामाजिक")
    ){

        return "social-science";

    }


    if(
        s==="drawing" ||
        s.includes("चित्र") ||
        s.includes("ड्राइंग")
    ){

        return "drawing";

    }


    return "";

}


/* =========================================================
   LOAD FIRESTORE TESTS
========================================================= */

async function loadTests(){

    try{

        const snap=
        await getDocs(
            collection(
                db,
                "mockTests"
            )
        );


        allTests=[];


        snap.forEach(docSnap=>{

            const data=
            docSnap.data();


            if(
                data.published===true
            ){

                const subject=
                normalizeSubject(
                    data.subject
                );


                if(subject){

                    allTests.push({

                        id:docSnap.id,

                        ...data,

                        _subject:subject

                    });

                }

            }

        });


        updateCount();

        renderSubjects();

    }
    catch(error){

        console.error(
            "Mock test load error:",
            error
        );


        subjectGrid.innerHTML=`

            <div class="loading">

                <i
                class="fa-solid fa-triangle-exclamation"
                style="color:#c48b00;font-size:24px">
                </i>

                <br><br>

                Mock Tests load नहीं हो सके।

                <br><br>

                <small>
                    ${esc(error.message)}
                </small>

            </div>

        `;

    }

}


/* =========================================================
   UPDATE COUNT
========================================================= */

function updateCount(){

    countBadge.textContent=
    allTests.length+

    (
        allTests.length===1
        ? " TEST"
        : " TESTS"
    );

}


/* =========================================================
   RENDER SUBJECTS
========================================================= */

function renderSubjects(){

    subjectGrid.innerHTML=

    SUBJECTS.map(subject=>{

        return `

            <div
            class="subject-card"
            data-subject="${subject.key}"
            id="subject-${subject.key}">


                <button
                class="subject-button"
                type="button"
                onclick="openSubject('${subject.key}')">


                    <div class="subject-icon">

                        <i
                        class="fa-solid ${subject.icon}">
                        </i>

                    </div>


                    <div class="subject-name">

                        ${subject.name}

                    </div>


                </button>


                <div
                class="test-area"
                id="tests-${subject.key}">

                </div>


            </div>

        `;

    }).join("");

}


/* =========================================================
   OPEN SUBJECT
========================================================= */

window.openSubject=function(subjectKey){

    const subject=
    SUBJECTS.find(
        x=>x.key===subjectKey
    );


    if(!subject)
        return;


    currentSubject=
    subjectKey;


    document.body.classList.add(
        "subject-open"
    );


    document.querySelectorAll(
        ".subject-card"
    ).forEach(card=>{

        card.classList.remove(
            "open"
        );

    });


    const card=
    document.getElementById(
        "subject-"+subjectKey
    );


    if(!card)
        return;


    card.classList.add(
        "open"
    );


    renderTests(
        subjectKey
    );


    sectionTitle.innerHTML=`

        <i class="fa-solid ${subject.icon}"></i>

        &nbsp; ${subject.name} MOCK TESTS

    `;


    countBadge.textContent=

        getSubjectTests(
            subjectKey
        ).length+

        (
            getSubjectTests(
                subjectKey
            ).length===1
            ? " TEST"
            : " TESTS"
        );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* =========================================================
   GET SUBJECT TESTS
========================================================= */

function getSubjectTests(subjectKey){

    return allTests.filter(
        test=>
        test._subject===subjectKey
    );

}


/* =========================================================
   RENDER TESTS
========================================================= */

function renderTests(subjectKey){

    const box=
    document.getElementById(
        "tests-"+subjectKey
    );


    const tests=
    getSubjectTests(
        subjectKey
    );


    if(!tests.length){

        box.innerHTML=`

            <div class="no-test">

                <i class="fa-solid fa-book-open"></i>

                &nbsp;

                इस subject में अभी कोई Mock Test उपलब्ध नहीं है।

            </div>

        `;

        return;

    }


    box.innerHTML=

    tests.map((test,index)=>{

        const total=
        Number(
            test.questions?.length ??
            test.totalQuestions ??
            0
        );


        const time=
        Number(
            test.timeLimit || 0
        );


        return `

            <div class="test-item">


                <div class="test-number">

                    ${String(index+1).padStart(2,"0")}

                </div>


                <div class="test-content">


                    <div
                    class="test-name"
                    title="${esc(test.testName)}">

                        ${esc(
                            test.testName ||
                            "Mock Test"
                        )}

                    </div>


                    <div class="test-meta">

                        <span class="meta">

                            <i class="fa-solid fa-list-ol"></i>

                            ${total} Questions

                        </span>


                        <span class="meta">

                            <i class="fa-solid fa-clock"></i>

                            ${time} Min

                        </span>


                        ${
                            test.className
                            ? `

                                <span class="meta">

                                    <i class="fa-solid fa-graduation-cap"></i>

                                    ${esc(
                                        test.className
                                    )}

                                </span>

                            `
                            : ""
                        }

                    </div>


                </div>


                <button
                class="start-test"
                type="button"
                onclick="startTest('${esc(test.id)}')">

                    <i class="fa-solid fa-play"></i>

                    START

                </button>


            </div>

        `;

    }).join("");

}


/* =========================================================
   CLOSE SUBJECT
========================================================= */

window.closeSubject=function(){

    currentSubject=null;


    document.body.classList.remove(
        "subject-open"
    );


    document.querySelectorAll(
        ".subject-card"
    ).forEach(card=>{

        card.classList.remove(
            "open"
        );

    });


    sectionTitle.innerHTML=`

        <i class="fa-solid fa-layer-group"></i>

        SELECT SUBJECT

    `;


    updateCount();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* =========================================================
   START MOCK TEST
========================================================= */

window.startTest=function(id){

    if(!id)
        return;


    localStorage.setItem(
        "selectedMockTest",
        id
    );


    location.href=
    "mock-test-attempt.html";

};


/* =========================================================
   DASHBOARD
========================================================= */

window.goDashboard=function(){

    location.href=
    "student-dashboard.html";

};


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

document.addEventListener(
    "touchend",
    function(event){

        const now=
        Date.now();


        if(
            window.lastTouchEnd &&
            now-window.lastTouchEnd<=300
        ){

            event.preventDefault();

        }


        window.lastTouchEnd=now;

    },
    {
        passive:false
    }
);


/* =========================================================
   START
========================================================= */

loadTests();

</script>

</body>
  </html>
