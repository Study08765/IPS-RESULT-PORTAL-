<script type="module">


/* ==================================================

}
from

/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAUcTdpMctPg2lcqSapoTgFHXizEE35RCY",

    authDomain:

    messagingSenderId:
    "877536597914",

    appId:
    "1:877536597914:web:d77c26ef46a9da2c928c23",

    measurementId:
    "G-4PD16WMHTT"

};



/* ==================================================
   CLOUDINARY
================================================== */

const CLOUDINARY_CLOUD_NAME =
    "zo2wacv1";


const CLOUDINARY_UPLOAD_PRESET =
    "tsp_pdf_upload";


const CLOUDINARY_UPLOAD_URL =
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`;



/* ==================================================
   FIREBASE START
================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =

/* ==================================================
   VARIABLES
================================================== */

let notes = [];

let paymentRequests = [];

let editingId = null;

let uploadedPdfUrl = "";

let uploadedPdfPublicId = "";



/* ==================================================
   ELEMENTS
================================================== */

const className =
    document.getElementById(
        "className"
    );


const subject =
    document.getElementById(
        "subject"
    );


const title =
    document.getElementById(
        "title"
    );


const price =
    document.getElementById(
        "price"
    );


const pdfFile =
    document.getElementById(
        "pdfFile"
    );


const fileName =
    document.getElementById(
        "fileName"
    );


const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const uploadProgress =
    document.getElementById(
        "uploadProgress"
    );


const uploadProgressBar =
    document.getElementById(
        "uploadProgressBar"
    );


const pdfUrlBox =
    document.getElementById(
        "pdfUrlBox"
    );


const pdfUrl =
    document.getElementById(
        "pdfUrl"

const qrUrl =
    document.getElementById(
        "qrUrl"
    );


const accessType =
    document.getElementById(
        "accessType"
    );


const list =

    );


const requestList =
    document.getElementById(
        "requestList"

    document.getElementById(
        "status"
    );

    document.getElementById(

    );

    document.getElementById(
        "notesCount"
    );


const requestCount =

        "requestCount"
    );



/* ==================================================
   ESCAPE
================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(match){

            const chars = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return chars[match];

        }
    );

}



/* ==================================================
   STATUS
================================================== */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;

}



/* ==================================================
   FILE SELECT
================================================== */

pdfFile.addEventListener(
    "change",
    function(){

        const file =
            pdfFile.files[0];


        uploadedPdfUrl =
            "";

        uploadedPdfPublicId =
            "";

        pdfUrl.value =
            "";

        pdfUrlBox.style.display =
            "none";


        if(!file){

            fileName.textContent =
                "📄 कोई PDF select नहीं की गई।";

            return;

        }


        fileName.textContent =
            "📄 " +
            file.name +
            " • " +
            formatFileSize(
                file.size
            );


        if(
            file.type !== "application/pdf" &&
            !file.name
                .toLowerCase()
                .endsWith(".pdf")
        ){

            showStatus(
                "❌ केवल PDF file upload करें।",
                "error"
            );

            pdfFile.value =
                "";

            fileName.textContent =
                "📄 कोई PDF select नहीं की गई।";

            return;

        }


        if(
            file.size >
            25 * 1024 * 1024
        ){

            showStatus(
                "❌ PDF maximum 25 MB की हो सकती है।",
                "error"
            );

            pdfFile.value =
                "";

            fileName.textContent =
                "📄 कोई PDF select नहीं की गई।";

            return;

        }


        showStatus(
            "📄 PDF select हो गई है। अब UPLOAD PDF दबाएँ।",
            "info"
        );

    }
);



/* ==================================================
   FILE SIZE
================================================== */

function formatFileSize(bytes){

    if(
        bytes <
        1024 * 1024
    ){

        return (
            bytes /
            1024
        ).toFixed(1)
        +
        " KB";

    }


    return (
        bytes /
        (
            1024 *
            1024
        )
    ).toFixed(2)
    +
    " MB";

}



/* ==================================================
   UPLOAD PDF
================================================== */

function uploadPDF(){

    const file =
        pdfFile.files[0];


    if(!file){

        showStatus(
            "❌ पहले PDF select करें।",
            "error"
        );

        return;

    }


    if(
        file.type !==
        "application/pdf" &&
        !file.name
            .toLowerCase()
            .endsWith(".pdf")
    ){

        showStatus(
            "❌ केवल PDF file upload करें।",
            "error"
        );

        return;

    }


    if(
        file.size >
        25 * 1024 * 1024
    ){

        showStatus(
            "❌ PDF maximum 25 MB की हो सकती है।",
            "error"
        );

        return;

    }


    uploadButton.disabled =
        true;

    saveButton.disabled =
        true;

    uploadProgress.style.display =
        "block";

    uploadProgressBar.style.width =
        "0%";


    showStatus(
        "⏳ PDF Cloudinary पर upload हो रही है...",
        "info"
    );


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    formData.append(
        "resource_type",
        "raw"
    );


    formData.append(
        "folder",
        "tsp-pdfs"
    );


    const xhr =
        new XMLHttpRequest();


    xhr.open(
        "POST",
        CLOUDINARY_UPLOAD_URL
    );


    xhr.upload.addEventListener(
        "progress",
        function(event){

            if(
                event.lengthComputable
            ){

                const percent =
                    Math.round(
                        (
                            event.loaded /
                            event.total
                        ) * 100
                    );


                uploadProgressBar.style.width =
                    percent +
                    "%";

            }

        }
    );


    xhr.onload =
        function(){

            uploadButton.disabled =
                false;

            saveButton.disabled =
                false;


            let result =
                null;


            try{

                result =
                    JSON.parse(
                        xhr.responseText
                    );

            }
            catch(error){

                console.error(
                    error
                );

            }


            if(
                xhr.status >= 200 &&
                xhr.status < 300 &&
                result &&
                result.secure_url
            ){

                uploadedPdfUrl =
                    result.secure_url;


                uploadedPdfPublicId =
                    result.public_id ||
                    "";


                pdfUrl.value =
                    uploadedPdfUrl;


                pdfUrlBox.style.display =
                    "block";


                uploadProgressBar.style.width =
                    "100%";


                showStatus(
                    "✅ PDF uploaded successfully! अब SAVE NOTE दबाएँ।",
                    "success"
                );


            }
            else{

                console.error(
                    "CLOUDINARY ERROR:",
                    result
                );


                showStatus(
                    "❌ PDF upload failed. " +
                    (
                        result &&
                        result.error &&
                        result.error.message
                        ?
                        result.error.message
                        :
                        "Cloudinary error."
                    ),
                    "error"
                );

            }

        };


    xhr.onerror =
        function(){

            uploadButton.disabled =
                false;

            saveButton.disabled =
                false;


            showStatus(
                "❌ Network error. PDF upload नहीं हो पाई।",
                "error"
            );

        };


    xhr.send(
        formData
    );

}


uploadButton.addEventListener(
    "click",
    uploadPDF
);



/* ==================================================
   LOAD NOTES
================================================== */

async function loadNotes(){

    list.innerHTML =
        '<div class="loading">Loading notes...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "paidNotes"
                )
            );


        notes =
            snapshot.docs.map(
                function(item){

                    return {

                        id:
                            item.id,

                        ...item.data()

                    };

                }
            );


        notesCount.textContent =
            notes.length;


        renderNotes();


    }
    catch(error){

        console.error(
            "LOAD NOTES:",
            error
        );


        list.innerHTML = `

            <div
                class="error"
                style="display:block">

                ❌ Notes load नहीं हुए।

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}



/* ==================================================
   RENDER NOTES
================================================== */

function renderNotes(){

    if(
        notes.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                अभी कोई Paid Note नहीं है।

            </div>

        `;

        return;

    }


    list.innerHTML =
        notes.map(
            function(note){

                const isFree =
                    note.accessType ===
                    "free";


                return `

                <div class="row">

                    <b>

                        ${escapeHTML(
                            note.className
                        )}

                        •

                        ${escapeHTML(
                            note.subject
                        )}

                    </b>

                    <br>

                    <small>

                        ${escapeHTML(
                            note.title
                        )}

                    </small>

                    <br>

                    <span class="tag">

                        ${
                            isFree
                            ?
                            "🟢 FREE"
                            :
                            "🟠 PAID ₹" +
                            (
                                note.price ||
                                0

/* ==================================================
   SAVE NOTE
================================================== */

async function saveNote(){

    const finalPdfUrl =
        uploadedPdfUrl ||
        pdfUrl.value.trim();


    const data = {

        className:
            className.value,

        subject:
            subject.value,

        title:
            title.value.trim(),

        price:
            Number(
                price.value || 0
            ),

        pdfUrl:
            finalPdfUrl,

        qrUrl:
            qrUrl.value.trim(),

        accessType:
            accessType.value,

        enabled:
            true

    };


    if(
        uploadedPdfPublicId
    ){

        data.cloudinaryPublicId =
            uploadedPdfPublicId;

    }


    if(!data.title){

        showStatus(
            "❌ Note Title भरें।",
            "error"
        );

        title.focus();

        return;

    }


    if(!data.pdfUrl){

        showStatus(
            "❌ पहले PDF select करके UPLOAD PDF करें।",
            "error"
        );

        return;

    }


    if(
        data.accessType ===
        "paid" &&
        !data.qrUrl
    ){

        showStatus(
            "❌ Paid Note के लिए QR Image URL डालें।",
            "error"
        );

        qrUrl.focus();

        return;

    }


    try{

        const noteId =
            editingId ||
            (
                "note_" +
                Date.now()
            );


        await setDoc(

            doc(
                db,
                "paidNotes",
                noteId
            ),

            {

                ...data,

                updatedAt:
                    new Date()

            },

            {

                merge:true

            }

        );


        showStatus(
            "✅ Note successfully saved!",
            "success"
        );


        editingId =
            null;


        clearForm();

        await loadNotes();


    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showStatus(
            "❌ Note save नहीं हुआ: " +
            error.message,
            "error"
        );

    }

}

/* ==================================================
   LOAD PAYMENT REQUESTS
================================================== */

async function loadPaymentRequests(){

    requestList.innerHTML =
        '<div class="loading">Loading payment requests...</div>';


    try{

        let snapshot;


        try{

            const q =
                query(

                    collection(
                        db,
                        "notePaymentRequests"
                    ),

                    orderBy(
                        "createdAt",
                        "desc"
                    )

                );


            snapshot =
                await getDocs(q);

        }
        catch(orderError){

            console.warn(
                "OrderBy fallback:",
                orderError
            );


            snapshot =
                await getDocs(

                    collection(
                        db,
                        "notePaymentRequests"
                    )

                );

        }


        paymentRequests =
            snapshot.docs.map(
                function(item){

                    return {

                        id:
                            item.id,

                        ...item.data()

                    };

                }
            );


        paymentRequests.sort(
            function(a,b){

                const aTime =
                    a.createdAt?.seconds ||
                    0;

                const bTime =
                    b.createdAt?.seconds ||
                    0;

                return bTime - aTime;

            }
        );


        requestCount.textContent =
            paymentRequests.filter(
                function(request){

                    return String(
                        request.status ||
                        ""
                    )
                    .toLowerCase()
                    ===
                    "pending";

                }
            ).length;


        renderPaymentRequests();


    }
    catch(error){

        console.error(
            "PAYMENT REQUEST ERROR:",
            error
        );


        requestList.innerHTML = `

            <div
                class="error"
                style="display:block">

                ❌ Payment Requests load नहीं हुईं।

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}



/* ==================================================
   REQUEST DATE
================================================== */

function formatRequestDate(
    timestamp
){

    if(
        timestamp &&
        timestamp.seconds
    ){

        return new Date(
            timestamp.seconds * 1000
        ).toLocaleString(
            "en-IN"
        );

    }


    return "—";

}

/* ==================================================
   APPROVE PAYMENT
================================================== */

async function approvePayment(
    requestId
){

    const request =
        paymentRequests.find(
            function(item){

                return item.id ===
                    requestId;

            }
        );


    if(!request){

        return;

    }


    const currentStatus =
        String(
            request.status ||
            "pending"
        )
        .toLowerCase();


    if(
        currentStatus !==
        "pending"
    ){

        alert(
            "यह request पहले ही process हो चुकी है।"
        );

        return;

    }


    const confirmed =
        confirm(

            "क्या आप इस payment को APPROVE करना चाहते हैं?\n\n" +

            "Student: " +
            (
                request.studentName ||
                ""
            )
            +
            "\nRoll: " +
            (
                request.studentRoll ||
                ""
            )
            +
            "\nAmount: ₹" +
            (
                request.amount ||
                0
            )

        );


    if(!confirmed){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "notePaymentRequests",
                requestId
            ),

            {

                status:
                    "approved",

                verifiedAt:
                    new Date(),

                verifiedBy:
                    "ADMIN",

                rejectionReason:
                    ""

            }

        );


        alert(
            "✅ Payment Approved!\n\nStudent के Premium Notes unlock हो गए हैं।"
        );


        await loadPaymentRequests();


    }
    catch(error){

        console.error(
            "APPROVE ERROR:",
            error
        );


        alert(
            "❌ Approval failed:\n\n" +
            error.message
        );

    }

}



/* ==================================================
   REJECT PAYMENT
================================================== */

async function rejectPayment(
    requestId
){

    const request =
        paymentRequests.find(
            function(item){

                return item.id ===
                    requestId;

            }
        );


    if(!request){

        return;

    }


    const currentStatus =
        String(
            request.status ||
            "pending"
        )
        .toLowerCase();


    if(
        currentStatus !==
        "pending"
    ){

        alert(
            "यह request पहले ही process हो चुकी है।"
        );

        return;

    }


    const reason =
        prompt(

            "Payment reject करने का कारण लिखें:"

        );


    if(
        reason === null
    ){

        return;

    }


    const finalReason =
        reason.trim() ||
        "Payment verification failed.";


    const confirmed =
        confirm(

            "क्या आप इस payment request को REJECT करना चाहते हैं?"

        );


    if(!confirmed){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "notePaymentRequests",
                requestId
            ),

            {

                status:
                    "rejected",

                verifiedAt:
                    new Date(),

                verifiedBy:
                    "ADMIN",

                rejectionReason:
                    finalReason

            }

        );


        alert(
            "❌ Payment Request Rejected."
        );


        await loadPaymentRequests();


    }
    catch(error){

        console.error(
            "REJECT ERROR:",
            error
        );


        alert(
            "❌ Rejection failed:\n\n" +
            error.message
        );

    }

}

/* ==================================================
   NOTE BUTTONS
================================================== */

list.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button"
            );


        if(!button){

            return;

        }


        const action =
            button.dataset.action;


        const id =
            button.dataset.id;


        if(
            action ===
            "edit"
        ){

            editNote(id);

        }


        if(
            action ===
            "delete"
        ){

            deleteNote(id);

        }


        if(
            action ===
            "toggle"
        ){

            const note =
                notes.find(
                    function(item){

                        return item.id ===
                            id;

                    }
                );


            if(!note){

                return;

            }


            const newType =
                note.accessType ===
                "free"
                ?
                "paid"
                :
                "free";


            toggleAccess(
                id,
                newType
            );

        }

    }
);



/* ==================================================
   PAYMENT BUTTONS
================================================== */

requestList.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button"
            );


        if(!button){

            return;

        }


        const action =
            button.dataset.requestAction;


        const requestId =
            button.dataset.requestId;


        if(
            action ===
            "approve"
        ){

            approvePayment(
                requestId
            );

        }


        if(
            action ===
            "reject"
        ){

            rejectPayment(
                requestId
            );

        }


        if(
            action ===
            "refresh"
        ){

            loadPaymentRequests();

        }

    }
);
