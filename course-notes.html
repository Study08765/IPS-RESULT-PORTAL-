<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#43256d">

<title>THE STUDY POINT | Course Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    linear-gradient(135deg,#f5f0ff,#f8fbff);
    color:#173b62;
}

.header{
    background:
    linear-gradient(135deg,#43256d,#7045a5);
    color:#fff;
    padding:20px;
    text-align:center;
    box-shadow:0 8px 25px rgba(67,37,109,.20);
}

.header h1{
    font-size:25px;
    font-weight:900;
}

.header p{
    margin-top:4px;
    font-size:10px;
    color:#eadfff;
    letter-spacing:1px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.back-btn{
    border:0;
    background:#fff;
    color:#43256d;
    padding:10px 16px;
    border-radius:12px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.07);
    margin-bottom:15px;
}

.hero{
    background:#fff;
    border-radius:22px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.07);
}

.hero h2{
    color:#43256d;
    font-size:22px;
    font-weight:900;
}

.hero p{
    color:#71849a;
    font-size:11px;
    margin-top:5px;
}

.search{
    margin-top:15px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#f8f5ff;
    border:1px solid #ded3ef;
    border-radius:13px;
    padding:12px 14px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    font-size:12px;
}

.filters{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:14px;
}

.filter{
    border:1px solid #d8cde8;
    background:#fff;
    color:#5e4b78;
    padding:8px 13px;
    border-radius:30px;
    font-size:9px;
    font-weight:900;
    cursor:pointer;
}

.filter.active{
    background:#43256d;
    color:#fff;
    border-color:#43256d;
}

.notes-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));
    gap:14px;
}

.note{
    background:#fff;
    border-radius:20px;
    padding:18px;
    border:1px solid #e1d9ed;
    box-shadow:0 8px 22px rgba(0,0,0,.06);
    position:relative;
    overflow:hidden;
}

.note::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:4px;
    background:
    linear-gradient(90deg,#43256d,#d6ad24);
}

.subject{
    display:inline-block;
    background:#f1eaff;
    color:#7045a5;
    padding:4px 9px;
    border-radius:20px;
    font-size:8px;
    font-weight:900;
    margin-bottom:9px;
}

.note h3{
    color:#173b62;
    font-size:15px;
    font-weight:900;
    line-height:21px;
}

.class-name{
    color:#71849a;
    font-size:9px;
    margin-top:6px;
}

.price{
    margin-top:10px;
    color:#a07812;
    font-size:13px;
    font-weight:900;
}

.status{
    display:inline-block;
    margin-top:8px;
    padding:4px 8px;
    border-radius:20px;
    font-size:8px;
    font-weight:900;
}

.paid{
    background:#fff4d2;
    color:#946c00;
}

.free{
    background:#def8e8;
    color:#087a3b;
}

.note-btn{
    width:100%;
    border:0;
    border-radius:10px;
    padding:11px;
    margin-top:13px;
    background:
    linear-gradient(135deg,#43256d,#7045a5);
    color:#fff;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.loading,
.empty{
    text-align:center;
    padding:35px;
    color:#71849a;
    font-size:11px;
    background:#fff;
    border-radius:18px;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .header h1{
        font-size:21px;
    }

    .notes-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header class="header">

    <h1>
        THE STUDY POINT
    </h1>

    <p>
        TSPCBT STUDENT PORTAL • COURSE NOTES
    </p>

</header>


<main class="container">

    <button
        class="back-btn"
        onclick="history.back()">

        ← BACK TO DASHBOARD

    </button>


    <section class="hero">

        <h2>
            📚 COURSE NOTES
        </h2>

        <p>
            Class-wise और Subject-wise Study Material
        </p>


        <div class="search">

            🔍

            <input
                id="search"
                type="text"
                placeholder="Search notes, class, subject...">

        </div>


        <div class="filters">

            <button
                class="filter active"
                data-subject="all">

                ALL

            </button>

            <button
                class="filter"
                data-subject="Hindi">

                HINDI

            </button>

            <button
                class="filter"
                data-subject="English">

                ENGLISH

            </button>

            <button
                class="filter"
                data-subject="Mathematics">

                MATHEMATICS

            </button>

            <button
                class="filter"
                data-subject="Science">

                SCIENCE

            </button>

            <button
                class="filter"
                data-subject="Social Science">

                SOCIAL SCIENCE

            </button>

            <button
                class="filter"
                data-subject="Drawing">

                DRAWING

            </button>

        </div>

    </section>


    <section
        id="notesList"
        class="notes-grid">

        <div class="loading">
            Loading Course Notes...
        </div>

    </section>

</main>


<script type="module">

import { db }
from "./firebase.js";

import {
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let notes = [];

let currentSubject = "all";


const notesList =
document.getElementById("notesList");


const search =
document.getElementById("search");


function esc(value){

    return String(value ?? "")
    .replace(
        /[&<>"']/g,
        function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}


async function loadNotes(){

    notesList.innerHTML = `

        <div class="loading">

            Loading Course Notes...

        </div>

    `;


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "paidNotes"
            )
        );


        notes =
        snapshot.docs.map(
            function(doc){

                return {

                    id:doc.id,
                    ...doc.data()

                };

            }
        );


        renderNotes();

    }
    catch(error){

        console.error(error);

        notesList.innerHTML = `

            <div class="empty">

                ❌ Course Notes load नहीं हुए।

                <br><br>

                ${esc(error.message)}

            </div>

        `;

    }

}


function renderNotes(){

    const query =
    search.value
    .toLowerCase()
    .trim();


    const filtered =
    notes.filter(
        function(note){

            const subject =
            String(
                note.subject || ""
            );


            if(
                currentSubject !== "all" &&
                subject !== currentSubject
            ){

                return false;

            }


            const text =
            (
                note.title || ""
            ) +
            " " +
            (
                note.className || ""
            ) +
            " " +
            subject;


            return text
            .toLowerCase()
            .includes(query);

        }
    );


    if(!filtered.length){

        notesList.innerHTML = `

            <div class="empty">

                📚 कोई Course Note नहीं मिला।

            </div>

        `;

        return;

    }


    notesList.innerHTML =
    filtered.map(
        function(note){

            const isFree =
            note.accessType === "free";


            return `

            <div class="note">

                <span class="subject">

                    ${esc(
                        note.subject ||
                        "Subject"
                    )}

                </span>


                <h3>

                    ${esc(
                        note.title ||
                        "Course Note"
                    )}

                </h3>


                <div class="class-name">

                    🎓

                    ${esc(
                        note.className ||
                        "-"
                    )}

                </div>


                <div class="price">

                    ${
                        isFree
                        ?
                        "FREE"
                        :
                        "₹" +
                        (
                            note.price || 0
                        )
                    }

                </div>


                <span
                    class="status ${
                        isFree
                        ?
                        "free"
                        :
                        "paid"
                    }">

                    ${
                        isFree
                        ?
                        "● FREE"
                        :
                        "● PAID"
                    }

                </span>


                <button
                    class="note-btn"
                    onclick="
                    openNote(
                        '${esc(note.id)}'
                    )">

                    ${
                        isFree
                        ?
                        "📖 OPEN NOTE"
                        :
                        "🔒 BUY / ACCESS NOTE"
                    }

                </button>

            </div>

            `;

        }
    ).join("");

}


window.openNote =
function(id){

    const note =
    notes.find(
        n => n.id === id
    );


    if(!note)
        return;


    if(
        note.accessType === "free"
    ){

        window.open(
            note.pdfUrl,
            "_blank"
        );

        return;

    }


    if(note.qrUrl){

        alert(
            "यह Paid Note है।\n\n" +
            "Price: ₹" +
            (
                note.price || 0
            ) +
            "\n\n" +
            "Payment करने के बाद access दिया जाएगा।"
        );

        window.open(
            note.qrUrl,
            "_blank"
        );

    }
    else{

        alert(
            "यह Paid Note है।"
        );

    }

};


document
.querySelectorAll(".filter")
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(".filter")
                .forEach(
                    b =>
                    b.classList.remove(
                        "active"
                    )
                );


                this.classList.add(
                    "active"
                );


                currentSubject =
                this.dataset.subject;


                renderNotes();

            }
        );

    }
);


search.addEventListener(
    "input",
    renderNotes
);


loadNotes();

</script>

</body>

  </html>
