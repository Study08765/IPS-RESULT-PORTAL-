<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Exam Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(-45deg,#06152d,#0b2c5f,#1e40af,#2563eb);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
width:100%;
max-width:760px;
}

h1{
text-align:center;
font-size:38px;
font-weight:800;
color:#fff;
letter-spacing:1px;
text-shadow:0 4px 15px rgba(0,0,0,.4);
}

.subtitle{
text-align:center;
color:#dbeafe;
margin:8px 0 25px;
font-size:17px;
letter-spacing:1px;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.25);
border-radius:22px;
padding:28px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
animation:fade .6s ease;
}

.card h2{
text-align:center;
color:#FFD54F;
margin-bottom:22px;
font-size:26px;
}

.info{
display:block;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
}

.info div{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 18px;
font-size:16px;
color:#fff;
border-bottom:1px solid rgba(255,255,255,.12);
transition:.3s;
}

.info div:nth-child(even){
background:rgba(255,255,255,.05);
}

.info div:hover{
background:rgba(255,255,255,.15);
}

.info strong{
color:#FFD54F;
font-weight:700;
}

.info span{
font-weight:600;
}
  .instruction{
margin-top:25px;
padding:18px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
border-radius:16px;
color:#fff;
display:flex;
align-items:flex-start;
gap:12px;
line-height:1.7;
}

#agree{
width:22px;
height:22px;
accent-color:#22c55e;
cursor:pointer;
margin-top:3px;
}

#startBtn{
margin-top:25px;
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#22c55e,#16a34a);
color:#fff;
font-size:18px;
font-weight:700;
letter-spacing:.5px;
cursor:pointer;
box-shadow:0 10px 25px rgba(34,197,94,.45);
transition:.3s;
}

#startBtn:hover{
transform:translateY(-3px) scale(1.02);
box-shadow:0 15px 35px rgba(34,197,94,.55);
}

#startBtn:active{
transform:scale(.98);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:600px){

.container{
max-width:100%;
}

h1{
font-size:30px;
}

.subtitle{
font-size:15px;
}

.card{
padding:20px;
}

.card h2{
font-size:22px;
}

.info div{
padding:13px 14px;
font-size:15px;
}

#startBtn{
font-size:17px;
}

  }

</style>

</head>

<body>

<div class="container">

<h1>THE STUDY POINT</h1>

<p class="subtitle">
Computer Based Test
</p>

<div class="card">

<h2>Exam Dashboard</h2>

<div class="info">

<div><strong>👤 Candidate Name</strong><span id="name"></span></div>

<div><strong>🆔 Roll Number</strong><span id="roll"></span></div>

<div><strong>🎓 Class</strong><span id="class"></span></div>

<div><strong>📘 Exam Code</strong><span id="examCode"></span></div>

<div><strong>📚 Subject</strong><span id="subject"></span></div>

<div><strong>⏱ Duration</strong><span id="duration"></span></div>

<div><strong>❓ Total Questions</strong><span id="questions"></span></div>

<div><strong>🏆 Total Marks</strong><span id="marks"></span></div>

</div>

<div class="instruction">

<input type="checkbox" id="agree">

<label for="agree">

<b>Exam Instructions</b><br><br>

✔ Read every question carefully.<br>
✔ Each question carries equal marks.<br>
✔ No negative marking.<br>
✔ Do not refresh or close the browser.<br>
✔ Submit the exam before the timer ends.<br>
✔ Once the exam starts, it cannot be restarted.

</label>

</div>

<div class="instruction">

<input type="checkbox" id="agree">

<label for="agree">

I have read all instructions carefully.

</label>

</div>

<button id="startBtn">

Start Exam

</button>

</div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const name = document.getElementById("name");
const roll = document.getElementById("roll");
const cls = document.getElementById("class");
const examCode = document.getElementById("examCode");
const subject = document.getElementById("subject");
const duration = document.getElementById("duration");
const questions = document.getElementById("questions");
const marks = document.getElementById("marks");

const agree = document.getElementById("agree");
const startBtn = document.getElementById("startBtn");

// Student Data
name.textContent = sessionStorage.getItem("studentName") || "";
roll.textContent = sessionStorage.getItem("studentRoll") || "";
cls.textContent = sessionStorage.getItem("studentClass") || "";
examCode.textContent = sessionStorage.getItem("examCode") || "";

// Exam Data
const examId = sessionStorage.getItem("examId");

async function loadExam() {

    if (!examId) {
        alert("Exam not selected");
        location.href = "student-cbt.html";
        return;
    }

    const snap = await getDoc(doc(db, "cbtTests", examId));

    if (!snap.exists()) {
        alert("Exam not found");
        return;
    }

    const exam = snap.data();

    subject.textContent = exam.subject;
    duration.textContent = exam.duration + " Minutes";
    questions.textContent = exam.questions;
    marks.textContent = exam.marks;

}

loadExam();

startBtn.onclick = () => {

    if (!agree.checked) {
        alert("Please accept instructions.");
        return;
    }

    location.href = "exam.html";

};

</script>

</body>
                       </html>
