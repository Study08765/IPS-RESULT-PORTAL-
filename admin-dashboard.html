<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE STUDY POINT | CBT Admin Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#041d52,#0b3d91,#1565c0);
min-height:100vh;
padding:20px;
}

.header{
width:100%;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:22px;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid rgba(255,255,255,.15);
box-shadow:0 15px 35px rgba(0,0,0,.25);
margin-bottom:25px;
}

.logo-box{
display:flex;
align-items:center;
gap:15px;
}

.logo-box img{
width:70px;
height:70px;
background:#fff;
padding:5px;
border-radius:50%;
border:3px solid gold;
}

.logo-box h1{
color:#fff;
font-size:28px;
font-weight:800;
}

.logo-box p{
color:#FFD700;
font-size:15px;
font-weight:600;
}

.admin-box{
background:#FFD700;
padding:10px 18px;
border-radius:50px;
font-weight:700;
color:#0b3d91;
display:flex;
align-items:center;
gap:8px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:22px;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
border-radius:22px;
padding:30px 20px;
text-align:center;
border:1px solid rgba(255,255,255,.18);
box-shadow:0 15px 30px rgba(0,0,0,.25);
transition:.35s;
cursor:pointer;
}

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 20px 45px rgba(0,0,0,.35);
}

.card i{
font-size:48px;
color:#FFD700;
margin-bottom:18px;
}

.card h2{
color:#fff;
font-size:22px;
margin-bottom:8px;
}

.card p{
color:#dfe8ff;
font-size:15px;
}

.logout{
background:linear-gradient(135deg,#d32f2f,#b71c1c);
}

.logout i,
.logout h2,
.logout p{
color:#fff;
}

@media(max-width:768px){

.header{
flex-direction:column;
gap:15px;
text-align:center;
}

.logo-box{
flex-direction:column;
}

.logo-box h1{
font-size:23px;
}

.admin-box{
width:100%;
justify-content:center;
}

  }

</style>

</head>

<body>

<script>
if(localStorage.getItem("adminLogin")!=="true"){
location.href="admin-login.html";
}
</script>

<div class="header">

<div class="logo-box">

<img src="logo.png">

<div>

<h1>THE STUDY POINT</h1>

<p>CBT EXAM ADMIN PANEL</p>

</div>

</div>

<div class="admin-box">

<i class="fa-solid fa-user-shield"></i>

<span>Welcome Admin</span>

</div>

</div>

<div class="dashboard">

<div class="card">

<i class="fa-solid fa-plus"></i>

<h2>Create Test</h2>

<p>Create New Online CBT Test</p>

</div>

<div class="card">

<i class="fa-solid fa-book"></i>

<h2>Question Bank</h2>

<p>Add / Edit Questions</p>

</div>

<div class="card">

<i class="fa-solid fa-users"></i>

<h2>Student Responses</h2>

<p>View Submitted Answers</p>

</div>

<div class="card">

<i class="fa-solid fa-square-poll-vertical"></i>

<h2>Publish Result</h2>

<p>Publish / Hide Results</p>

</div>

<div class="card">

<i class="fa-solid fa-gear"></i>

<h2>Test Settings</h2>

<p>Manage Test Information</p>

</div>

<div class="card logout">

<i class="fa-solid fa-right-from-bracket"></i>

<h2>Logout</h2>

<p>Exit Admin Panel</p>

</div>

</div>

<!-- PART 3 JavaScript -->

</body>
  </html>
