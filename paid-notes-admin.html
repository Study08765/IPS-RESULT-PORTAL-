<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE STUDY POINT | Paid Notes Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eef4ff;
    color:#183b60;
    padding-bottom:30px;
}

/* HEADER */

.header{
    background:#fff;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:58px;
    height:58px;
    border-radius:50%;
    border:3px solid gold;
    padding:4px;
    background:#fff;
}

.brand h1{
    color:#0047AB;
    font-size:23px;
    font-weight:800;
}

.brand p{
    color:#666;
    font-size:11px;
}

.back-btn{
    border:none;
    background:#0047AB;
    color:#fff;
    padding:11px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.title-box{
    background:linear-gradient(
        135deg,
        #003c8f,
        #1565c0,
        #42a5f5
    );

    color:#fff;
    padding:28px;
    border-radius:24px;

    box-shadow:
    0 15px 35px rgba(0,71,171,.22);
}

.title-box h2{
    font-size:30px;
    font-weight:800;
}

.title-box p{
    margin-top:5px;
    font-size:13px;
}

/* FORM */

.form-box{
    background:#fff;
    margin-top:22px;
    padding:24px;
    border-radius:22px;

    box-shadow:
    0 10px 25px rgba(0,0,0,.08);
}

.form-title{
    color:#0047AB;
    font-size:21px;
    font-weight:800;
    margin-bottom:18px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:12px;
    font-weight:700;
    color:#315579;
}

input,
select,
textarea{
    width:100%;
    padding:13px;

    border:1px solid #ccdbea;
    border-radius:11px;

    outline:none;

    background:#f8fbff;

    font-size:13px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.price-box{
    position:relative;
}

.price-box span{
    position:absolute;
    left:13px;
    top:12px;
    font-weight:800;
    color:#0878d8;
}

.price-box input{
    padding-left:30px;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.btn{
    border:none;
    padding:13px 20px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
}

.save{
    background:linear-gradient(135deg,#0878d8,#0047AB);
    color:#fff;
}

.clear{
    background:#edf2f7;
    color:#333;
}

/* STATUS */

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
}

.success{
    display:block;
    background:#e5f8ed;
    color:#087a3b;
}

.error{
    display:block;
    background:#ffe8e8;
    color:#b00020;
}

/* NOTES */

.notes-box{
    margin-top:22px;
}

.notes-title{
    color:#0047AB;
    font-size:21px;
    font-weight:800;
    margin-bottom:15px;
}

.notes-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(270px,1fr));

    gap:18px;
}

.note-card{
    background:#fff;
    border-radius:20px;
    padding:18px;

    box-shadow:
    0 10px 25px rgba(0,0,0,.08);

    border:2px solid #fff;
}

.note-cover{
    width:100%;
    height:150px;
    border-radius:14px;
    object-fit:cover;
    background:#eaf3ff;
    display:block;
    margin-bottom:13px;
}

.note-title{
    font-size:18px;
    font-weight:800;
    color:#064b99;
}

.note-meta{
    margin-top:6px;
    font-size:11px;
    color:#667b91;
    line-height:20px;
}

.status-badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 11px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.free{
    background:#dff8e9;
    color:#087a3b;
}

.paid{
    background:#fff0d5;
    color:#b76400;
}

.hidden{
    background:#ffe2e2;
    color:#b00020;
}

.card-buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.edit-btn,
.delete-btn{
    border:none;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:700;
    font-size:11px;
}

.edit-btn{
    background:#e6f1ff;
    color:#0757a7;
}

.delete-btn{
    background:#ffe5e5;
    color:#c62828;
}

.empty{
    background:#fff;
    padding:30px;
    border-radius:18px;
    text-align:center;
    color:#71849a;
}

/* MOBILE */

@media(max-width:650px){

    .header{
        padding:12px 15px;
    }

    .brand h1{
        font-size:18px;
    }

    .brand p{
        font-size:8px;
    }

    .brand img{
        width:48px;
        height:48px;
    }

    .back-btn{
        padding:9px 12px;
        font-size:11px;
    }

    .title-box{
        padding:22px 18px;
    }

    .title-box h2{
        font-size:24px;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

    .form-box{
        padding:16px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="brand">

        <img
            src="icon-512.png"
            alt="THE STUDY POINT">

        <div>

            <h1>
                THE STUDY POINT
            </h1>

            <p>
                PAID NOTES MANAGEMENT
            </p>

        </div>

    </div>


    <button
        class="back-btn"
        onclick="location.href='admin-dashboard.html'">

        <i class="fa-solid fa-arrow-left"></i>
        Dashboard

    </button>

</header>


<main class="container">


<!-- TITLE -->

<section class="title-box">

    <h2>
        📚 Paid Notes Management
    </h2>

    <p>
        Class 6–10 के Notes को FREE, PAID या HIDDEN करें।
    </p>

</section>


<!-- FORM -->

<section class="form-box">

    <div class="form-title">

        <i class="fa-solid fa-plus-circle"></i>
        Add / Edit Note

    </div>


    <div class="row">


        <!-- CLASS -->

        <div class="form-group">

            <label>
                Class
            </label>

            <select id="className">

                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>

            </select>

        </div>


        <!-- SUBJECT -->

        <div class="form-group">

            <label>
                Subject
            </label>

            <select id="subject">

                <option value="Hindi">
                    Hindi
                </option>

                <option value="English">
                    English
                </option>

                <option value="Mathematics">
                    Mathematics
                </option>

                <option value="Science">
                    Science
                </option>

                <option value="Social Science">
                    Social Science
                </option>

                <option value="General Knowledge">
                    General Knowledge
                </option>

            </select>

        </div>

    </div>


    <!-- TITLE -->

    <div class="form-group">

        <label>
            Note Title
        </label>

        <input
            type="text"
            id="noteTitle"
            placeholder="Example: Class 6 Science Chapter 1 Notes">

    </div>


    <!-- DESCRIPTION -->

    <div class="form-group">

        <label>
            Description
        </label>

        <textarea
            id="description"
            placeholder="Notes के बारे में छोटा विवरण"></textarea>

    </div>


    <div class="row">


        <!-- PRICE -->

        <div class="form-group">

            <label>
                Price
            </label>

            <div class="price-box">

                <span>₹</span>

                <input
                    type="number"
                    id="price"
                    min="0"
                    placeholder="49">

            </div>

        </div>


        <!-- ACCESS -->

        <div class="form-group">

            <label>
                Access Type
            </label>

            <select id="accessType">

                <option value="PAID">
                    💰 PAID
                </option>

                <option value="FREE">
                    🆓 FREE
                </option>

                <option value="HIDDEN">
                    🔒 HIDDEN
                </option>

            </select>

        </div>

    </div>


    <!-- NOTE LINK -->

    <div class="form-group">

        <label>
            Note / PDF URL
        </label>

        <input
            type="url"
            id="noteUrl"
            placeholder="https://...">

    </div>


    <!-- IMAGE -->

    <div class="form-group">

        <label>
            Cover Image URL
        </label>

        <input
            type="url"
            id="imageUrl"
            placeholder="https://...">

    </div>


    <div class="buttons">

        <button
            class="btn save"
            id="saveBtn">

            <i class="fa-solid fa-cloud-arrow-up"></i>
            SAVE NOTE

        </button>


        <button
            class="btn clear"
            id="clearBtn">

            <i class="fa-solid fa-rotate-left"></i>
            CLEAR

        </button>

    </div>


    <div
        id="status"
        class="status">

    </div>

</section>


<!-- NOTES LIST -->

<section class="notes-box">

    <div class="notes-title">

        <i class="fa-solid fa-folder-open"></i>
        Saved Notes

    </div>


    <div
        id="notesGrid"
        class="notes-grid">

        <div class="empty">
            Loading notes...
        </div>

    </div>

</section>


</main>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyAUcTdpMctPg2lcqSapoTgFHXizEE35RCY",

    authDomain:
    "ips-result-portal.firebaseapp.com",

    projectId:
    "ips-result-portal",

    storageBucket:
    "ips-result-portal.firebasestorage.app",

    messagingSenderId:
    "877536597914",

    appId:
    "1:877536597914:web:d77c26ef46a9da2c928c23",

    measurementId:
    "G-4PD16WMHTT"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* ELEMENTS */

const className =
    document.getElementById("className");

const subject =
    document.getElementById("subject");

const noteTitle =
    document.getElementById("noteTitle");

const description =
    document.getElementById("description");

const price =
    document.getElementById("price");

const accessType =
    document.getElementById("accessType");

const noteUrl =
    document.getElementById("noteUrl");

const imageUrl =
    document.getElementById("imageUrl");

const notesGrid =
    document.getElementById("notesGrid");

const status =
    document.getElementById("status");

let editingId = null;


/* STATUS */

function showStatus(text,type){

    status.textContent =
        text;

    status.className =
        "status " + type;

}


/* CLEAR */

function clearForm(){

    className.value = "6";

    subject.value = "Hindi";

    noteTitle.value = "";

    description.value = "";

    price.value = "";

    accessType.value = "PAID";

    noteUrl.value = "";

    imageUrl.value = "";

    editingId = null;

    status.className =
        "status";

    status.textContent = "";

}


/* SAVE */

document
.getElementById("saveBtn")
.addEventListener("click",async function(){

    const title =
        noteTitle.value.trim();

    const url =
        noteUrl.value.trim();

    if(!title){

        showStatus(
            "Please enter Note Title.",
            "error"
        );

        return;

    }

    if(!url){

        showStatus(
            "Please enter Note/PDF URL.",
            "error"
        );

        return;

    }


    try{

        const data = {

            className:
                className.value,

            subject:
                subject.value,

            title:
                title,

            description:
                description.value.trim(),

            price:
                Number(price.value) || 0,

            accessType:
                accessType.value,

            noteUrl:
                url,

            imageUrl:
                imageUrl.value.trim(),

            updatedAt:
                serverTimestamp()

        };


        if(editingId){

            await updateDoc(
                doc(
                    db,
                    "paidNotes",
                    editingId
                ),
                data
            );

            showStatus(
                "✓ Note updated successfully.",
                "success"
            );

        }else{

            data.createdAt =
                serverTimestamp();

            await addDoc(
                collection(
                    db,
                    "paidNotes"
                ),
                data
            );

            showStatus(
                "✓ Note saved successfully.",
                "success"
            );

        }


        clearForm();

        loadNotes();


    }catch(error){

        console.error(error);

        showStatus(
            "Note save नहीं हुआ। Firebase Rules check करें.",
            "error"
        );

    }

});


/* LOAD NOTES */

async function loadNotes(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "paidNotes"
                )
            );


        notesGrid.innerHTML = "";


        if(snapshot.empty){

            notesGrid.innerHTML = `
                <div class="empty">
                    अभी कोई note saved नहीं है।
                </div>
            `;

            return;

        }


        snapshot.forEach(function(item){

            const d =
                item.data();

            const id =
                item.id;


            let badgeClass =
                "paid";

            if(
                d.accessType === "FREE"
            ){

                badgeClass =
                    "free";

            }

            if(
                d.accessType === "HIDDEN"
            ){

                badgeClass =
                    "hidden";

            }


            const card =
                document.createElement("div");

            card.className =
                "note-card";


            card.innerHTML = `

                ${
                    d.imageUrl
                    ?
                    `<img
                        class="note-cover"
                        src="${escapeHTML(d.imageUrl)}"
                        onerror="this.style.display='none'"
                    >`
                    :
                    ""
                }

                <div class="note-title">
                    ${escapeHTML(d.title || "Untitled Note")}
                </div>

                <div class="note-meta">

                    <b>Class:</b>
                    ${escapeHTML(d.className || "")}

                    <br>

                    <b>Subject:</b>
                    ${escapeHTML(d.subject || "")}

                    <br>

                    <b>Price:</b>
                    ₹${Number(d.price || 0)}

                </div>

                <span class="status-badge ${badgeClass}">
                    ${escapeHTML(d.accessType || "PAID")}
                </span>

                <div class="card-buttons">

                    <button
                        class="edit-btn"
                        data-edit="${id}">

                        <i class="fa-solid fa-pen"></i>
                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        data-delete="${id}">

                        <i class="fa-solid fa-trash"></i>
                        Delete

                    </button>

                </div>

            `;


            notesGrid.appendChild(card);

        });


        document
        .querySelectorAll("[data-edit]")
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    editNote(
                        this.dataset.edit,
                        snapshot
                    );

                }
            );

        });


        document
        .querySelectorAll("[data-delete]")
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    deleteNote(
                        this.dataset.delete
                    );

                }
            );

        });


    }catch(error){

        console.error(error);

        notesGrid.innerHTML = `
            <div class="empty">
                Firebase से notes load नहीं हो सके।
            </div>
        `;

    }

}


/* EDIT */

function editNote(id,snapshot){

    let selected = null;

    snapshot.forEach(function(item){

        if(item.id === id){

            selected = item.data();

        }

    });


    if(!selected){

        return;

    }


    className.value =
        selected.className || "6";

    subject.value =
        selected.subject || "Hindi";

    noteTitle.value =
        selected.title || "";

    description.value =
        selected.description || "";

    price.value =
        selected.price || "";

    accessType.value =
        selected.accessType || "PAID";

    noteUrl.value =
        selected.noteUrl || "";

    imageUrl.value =
        selected.imageUrl || "";

    editingId = id;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* DELETE */

async function deleteNote(id){

    if(
        !confirm(
            "क्या आप यह note delete करना चाहते हैं?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "paidNotes",
                id
            )
        );


        showStatus(
            "✓ Note deleted.",
            "success"
        );


        loadNotes();


    }catch(error){

        console.error(error);

        showStatus(
            "Note delete नहीं हुआ.",
            "error"
        );

    }

}


/* CLEAR BUTTON */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    clearForm
);


/* SECURITY */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* START */

loadNotes();

</script>

</body>
  </html>
