<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>THE STUDY POINT | Paid Notes Control</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    margin:0;
    background:#eef6ff;
    color:#173b62;
}

.header{
    background:
    linear-gradient(
        135deg,
        #064b99,
        #0878d8
    );

    color:#fff;
    padding:20px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header div{
    margin-top:4px;
    font-size:12px;
}

.container{
    max-width:1050px;
    margin:auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;

    box-shadow:
    0 7px 20px rgba(22,75,122,.10);
}

h2{
    color:#064b99;
    font-size:20px;
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    display:block;
    font-size:11px;
    font-weight:700;
    margin:8px 0 5px;
}

input,
select{
    width:100%;
    padding:12px;

    border:1px solid #ccd9e7;
    border-radius:10px;

    outline:none;

    background:#f9fbff;

    font-size:13px;
}

input:focus,
select:focus{
    border-color:#0878d8;
}

.btn{
    border:0;
    border-radius:10px;

    padding:11px 15px;

    background:#075fb6;
    color:#fff;

    font-weight:800;

    margin:
    8px
    5px
    0
    0;

    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

.free{
    background:#087a3b;
}

.danger{
    background:#c62828;
}

.edit{
    background:#f39c12;
}

.row{
    border:1px solid #e1eaf4;
    border-radius:13px;

    padding:14px;

    margin-top:10px;

    background:#fbfdff;
}

.tag{
    display:inline-block;

    margin-top:6px;

    font-size:10px;
    font-weight:800;
}

.status{
    display:none;

    margin-top:14px;

    padding:12px;

    border-radius:10px;

    font-size:12px;

    font-weight:700;
}

.success{
    display:block;
    background:#e5f8ed;
    color:#087a3b;
}

.error{
    display:block;
    background:#ffe8e8;
    color:#b00020;
}

.loading{
    color:#657b92;
    font-size:12px;
}

.empty{
    padding:15px;

    text-align:center;

    color:#71849a;

    font-size:12px;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:20px;
    }

    .container{
        padding:10px;
    }

    .card{
        padding:14px;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>
        📚 PAID NOTES CONTROL
    </h1>

    <div>
        THE STUDY POINT • ADMIN PANEL
    </div>

</header>


<main class="container">


<!-- ==================================================
     ADD / EDIT NOTE
================================================== -->

<div class="card">

    <h2>
        ➕ Add / Edit Note
    </h2>


    <div class="grid">


        <!-- CLASS -->

        <div>

            <label>
                Class
            </label>

            <select id="className">

                <option value="Class 6">
                    Class 6
                </option>

                <option value="Class 7">
                    Class 7
                </option>

                <option value="Class 8">
                    Class 8
                </option>

                <option value="Class 9">
                    Class 9
                </option>

                <option value="Class 10">
                    Class 10
                </option>

            </select>

        </div>


        <!-- SUBJECT -->

        <div>

            <label>
                Subject
            </label>

            <select id="subject">

                <option value="Hindi">
                    Hindi
                </option>

                <option value="English">
                    English
                </option>

                <option value="Mathematics">
                    Mathematics
                </option>

                <option value="Science">
                    Science
                </option>

                <option value="Social Science">
                    Social Science
                </option>

                <option value="General Knowledge">
                    General Knowledge
                </option>

            </select>

        </div>


        <!-- TITLE -->

        <div>

            <label>
                Note Title
            </label>

            <input
                id="title"
                type="text"
                placeholder="General Knowledge Notes">

        </div>


        <!-- PRICE -->

        <div>

            <label>
                Price ₹
            </label>

            <input
                id="price"
                type="number"
                min="0"
                placeholder="99">

        </div>


        <!-- PDF URL -->

        <div>

            <label>
                PDF URL
            </label>

            <input
                id="pdfUrl"
                type="text"
                placeholder="https://.../file.pdf">

        </div>


        <!-- QR URL -->

        <div>

            <label>
                QR Image URL
            </label>

            <input
                id="qrUrl"
                type="text"
                placeholder="https://.../qr.png">

        </div>


    </div>


    <!-- ACCESS -->

    <label>
        Access Type
    </label>

    <select id="accessType">

        <option value="paid">
            🟠 PAID
        </option>

        <option value="free">
            🟢 FREE
        </option>

    </select>


    <!-- BUTTONS -->

    <div>

        <button
            class="btn"
            id="saveButton"
            type="button">

            💾 SAVE NOTE

        </button>


        <button
            class="btn edit"
            id="clearButton"
            type="button">

            ↩ CLEAR

        </button>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status">

    </div>


</div>



<!-- ==================================================
     CURRENT NOTES
================================================== -->

<div class="card">

    <h2>
        📚 Current Notes
    </h2>


    <div
        id="list"
        class="loading">

        Loading notes...

    </div>

</div>


</main>



<!-- ==================================================
     FIREBASE
================================================== -->

<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
    deleteDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAUcTdpMctPg2lcqSapoTgFHXizEE35RCY",

    authDomain:
    "ips-result-portal.firebaseapp.com",

    projectId:
    "ips-result-portal",

    storageBucket:
    "ips-result-portal.firebasestorage.app",

    messagingSenderId:
    "877536597914",

    appId:
    "1:877536597914:web:d77c26ef46a9da2c928c23",

    measurementId:
    "G-4PD16WMHTT"

};



/* ==================================================
   FIREBASE START
================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);



/* ==================================================
   VARIABLES
================================================== */

let notes = [];

let editingId = null;



/* ==================================================
   ELEMENTS
================================================== */

const className =
    document.getElementById(
        "className"
    );


const subject =
    document.getElementById(
        "subject"
    );


const title =
    document.getElementById(
        "title"
    );


const price =
    document.getElementById(
        "price"
    );


const pdfUrl =
    document.getElementById(
        "pdfUrl"
    );


const qrUrl =
    document.getElementById(
        "qrUrl"
    );


const accessType =
    document.getElementById(
        "accessType"
    );


const list =
    document.getElementById(
        "list"
    );


const statusBox =
    document.getElementById(
        "status"
    );



/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(match){

            const chars = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return chars[match];

        }
    );

}



/* ==================================================
   STATUS
================================================== */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;

}



/* ==================================================
   LOAD NOTES
================================================== */

async function loadNotes(){

    list.innerHTML =
        '<div class="loading">Loading notes...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "paidNotes"
                )
            );


        notes =
            snapshot.docs.map(
                function(item){

                    return {

                        id:item.id,

                        ...item.data()

                    };

                }
            );


        renderNotes();


    }catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        list.innerHTML = `

            <div class="error"
                 style="display:block">

                ❌ Notes load नहीं हुए।<br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}



/* ==================================================
   RENDER NOTES
================================================== */

function renderNotes(){

    if(
        notes.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                अभी कोई Paid Note नहीं है।

            </div>

        `;

        return;

    }


    list.innerHTML =
        notes.map(
            function(note){

                const isFree =
                    note.accessType ===
                    "free";


                return `

                <div class="row">

                    <b>

                        ${escapeHTML(
                            note.className
                        )}

                        • 

                        ${escapeHTML(
                            note.subject
                        )}

                    </b>

                    <br>


                    <small>

                        ${escapeHTML(
                            note.title
                        )}

                    </small>


                    <br>


                    <span class="tag">

                        ${
                            isFree

                            ?

                            "🟢 FREE"

                            :

                            "🟠 PAID ₹" +
                            (
                                note.price || 0
                            )

                        }

                    </span>


                    <br>


                    <button
                        class="btn ${
                            isFree
                            ? ""
                            : "free"
                        }"
                        data-action="toggle"
                        data-id="${escapeHTML(note.id)}">

                        ${
                            isFree
                            ?
                            "MAKE PAID"
                            :
                            "MAKE FREE"
                        }

                    </button>


                    <button
                        class="btn edit"
                        data-action="edit"
                        data-id="${escapeHTML(note.id)}">

                        EDIT

                    </button>


                    <button
                        class="btn danger"
                        data-action="delete"
                        data-id="${escapeHTML(note.id)}">

                        DELETE

                    </button>

                </div>

                `;

            }
        )
        .join("");

}



/* ==================================================
   SAVE NOTE
================================================== */

async function saveNote(){

    const data = {

        className:
            className.value,

        subject:
            subject.value,

        title:
            title.value.trim(),

        price:
            Number(
                price.value || 0
            ),

        pdfUrl:
            pdfUrl.value.trim(),

        qrUrl:
            qrUrl.value.trim(),

        accessType:
            accessType.value,

        enabled:
            true

    };


    /* VALIDATION */

    if(
        !data.title
    ){

        showStatus(
            "❌ Note Title भरें।",
            "error"
        );

        title.focus();

        return;

    }


    if(
        !data.pdfUrl
    ){

        showStatus(
            "❌ PDF URL भरें।",
            "error"
        );

        pdfUrl.focus();

        return;

    }


    if(
        data.accessType === "paid" &&
        !data.qrUrl
    ){

        showStatus(
            "❌ Paid Note के लिए QR Image URL डालें।",
            "error"
        );

        qrUrl.focus();

        return;

    }


    try{

        const noteId =
            editingId ||
            (
                "note_" +
                Date.now()
            );


        await setDoc(

            doc(
                db,
                "paidNotes",
                noteId
            ),

            {

                ...data,

                updatedAt:
                    new Date()

            },

            {

                merge:true

            }

        );


        showStatus(
            "✅ Note successfully saved!",
            "success"
        );


        editingId = null;


        clearForm();


        await loadNotes();


    }catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showStatus(

            "❌ Note save नहीं हुआ: " +
            error.message,

            "error"

        );

    }

}



/* ==================================================
   CLEAR FORM
================================================== */

function clearForm(){

    className.value =
        "Class 6";

    subject.value =
        "Hindi";

    title.value =
        "";

    price.value =
        "";

    pdfUrl.value =
        "";

    qrUrl.value =
        "";

    accessType.value =
        "paid";

    editingId =
        null;

}



/* ==================================================
   EDIT NOTE
================================================== */

function editNote(id){

    const note =
        notes.find(
            function(item){

                return item.id === id;

            }
        );


    if(!note){

        return;

    }


    className.value =
        note.className || "Class 6";


    subject.value =
        note.subject || "Hindi";


    title.value =
        note.title || "";


    price.value =
        note.price || "";


    pdfUrl.value =
        note.pdfUrl || "";


    qrUrl.value =
        note.qrUrl || "";


    accessType.value =
        note.accessType || "paid";


    editingId =
        id;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });


    showStatus(
        "✏️ Note editing mode.",
        "success"
    );

}



/* ==================================================
   MAKE FREE / PAID
================================================== */

async function toggleAccess(
    id,
    newType
){

    try{

        await setDoc(

            doc(
                db,
                "paidNotes",
                id
            ),

            {

                accessType:
                    newType,

                updatedAt:
                    new Date()

            },

            {

                merge:true

            }

        );


        showStatus(
            "✅ Access type updated.",
            "success"
        );


        await loadNotes();


    }catch(error){

        showStatus(
            "❌ Update failed: " +
            error.message,
            "error"
        );

    }

}



/* ==================================================
   DELETE NOTE
================================================== */

async function deleteNote(id){

    const confirmDelete =
        confirm(
            "क्या आप इस Note को delete करना चाहते हैं?"
        );


    if(
        !confirmDelete
    ){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "paidNotes",
                id
            )

        );


        showStatus(
            "✅ Note deleted.",
            "success"
        );


        await loadNotes();


    }catch(error){

        showStatus(
            "❌ Delete failed: " +
            error.message,
            "error"
        );

    }

}



/* ==================================================
   BUTTON EVENTS
================================================== */

document
.getElementById(
    "saveButton"
)
.addEventListener(
    "click",
    saveNote
);


document
.getElementById(
    "clearButton"
)
.addEventListener(
    "click",
    function(){

        clearForm();

        statusBox.className =
            "status";

        statusBox.textContent =
            "";

    }
);



/* ==================================================
   CURRENT NOTES BUTTONS
================================================== */

list.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button"
            );


        if(!button){

            return;

        }


        const action =
            button.dataset.action;


        const id =
            button.dataset.id;


        if(
            action === "edit"
        ){

            editNote(id);

        }


        if(
            action === "delete"
        ){

            deleteNote(id);

        }


        if(
            action === "toggle"
        ){

            const note =
                notes.find(
                    function(item){

                        return item.id === id;

                    }
                );


            if(!note){

                return;

            }


            const newType =
                note.accessType ===
                "free"

                ?

                "paid"

                :

                "free";


            toggleAccess(
                id,
                newType
            );

        }

    }
);



/* ==================================================
   START
================================================== */

loadNotes();


</script>


</body>
</html>
