<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>THE STUDY POINT | CBT APP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        rgba(5,25,60,.35),
        rgba(5,25,60,.65)
    ),
    url("hero-bg.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

}


/* ================= CONTAINER ================= */

.container{

    width:100%;
    max-width:900px;

}


/* ================= LOGO ================= */

.logo{

    text-align:center;

    color:#fff;

    margin-bottom:30px;

}

.logo-img{

    width:125px;
    height:125px;

    border-radius:50%;

    background:#fff;

    padding:7px;

    border:4px solid #FFD700;

    box-shadow:
    0 0 30px
    rgba(255,215,0,.7);

    object-fit:contain;

}

.logo h1{

    margin-top:15px;

    font-size:42px;

    font-weight:900;

    color:#FFD700;

    letter-spacing:2px;

    text-shadow:
    0 4px 12px #000,
    0 0 20px
    rgba(255,215,0,.6);

}

.logo p{

    margin-top:5px;

    font-size:17px;

    font-weight:600;

}

.logo h3{

    margin-top:10px;

    color:#FFD700;

    font-size:18px;

    letter-spacing:2px;

}


/* ================= CARD ================= */

.card{

    background:
    rgba(255,255,255,.13);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:
    2px solid
    rgba(255,215,0,.30);

    border-radius:28px;

    padding:32px;

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.35),

    0 0 30px
    rgba(255,215,0,.12);

}


/* ================= TITLE ================= */

.card h2{

    text-align:center;

    color:#fff;

    font-size:28px;

    margin-bottom:25px;

    font-weight:800;

}


/* ================= STUDENT LOGIN ================= */

.login-title{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    color:#FFD700;

    font-size:20px;

    font-weight:800;

    margin-bottom:18px;

}


/* ================= INPUT ================= */

.input-group{

    position:relative;

    margin-bottom:15px;

}

.input-group i{

    position:absolute;

    left:18px;

    top:50%;

    transform:
    translateY(-50%);

    color:#2563eb;

    font-size:19px;

    z-index:2;

}

.input-group input{

    width:100%;

    height:60px;

    padding:
    0 18px 0 52px;

    border:none;

    outline:none;

    border-radius:15px;

    background:#fff;

    color:#111;

    font-size:17px;

    font-weight:600;

    box-shadow:
    0 8px 20px
    rgba(0,0,0,.15);

}

.input-group input:focus{

    box-shadow:
    0 0 0 3px
    rgba(255,215,0,.35),

    0 8px 20px
    rgba(0,0,0,.15);

}


/* ================= CONTINUE ================= */

.continue-btn{

    width:100%;

    height:60px;

    border:none;

    border-radius:15px;

    background:
    linear-gradient(
        135deg,
        #FFD700,
        #ffae00
    );

    color:#111;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
    0 10px 25px
    rgba(255,174,0,.35);

    transition:.25s;

}

.continue-btn:hover{

    transform:
    translateY(-3px);

}


/* ================= ADMIN ================= */

.admin-section{

    margin-top:25px;

    padding-top:22px;

    border-top:
    1px solid
    rgba(255,255,255,.20);

    text-align:center;

}

.admin-btn{

    width:100%;

    height:52px;

    border:
    1px solid
    rgba(255,255,255,.35);

    border-radius:14px;

    background:
    rgba(255,255,255,.12);

    color:#fff;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

}

.admin-btn:hover{

    background:
    rgba(255,255,255,.22);

}


/* ================= MESSAGE ================= */

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    font-size:11px;

    font-weight:600;

    text-align:center;

}

.error{

    display:block;

    background:#ffe5e5;

    color:#a40000;

}

.loading{

    display:block;

    background:#e8f3ff;

    color:#0752a5;

}


/* ================= FOOTER ================= */

.footer{

    text-align:center;

    color:#fff;

    font-size:10px;

    margin-top:18px;

    opacity:.85;

}


/* ================= MOBILE ================= */

@media(max-width:600px){

    body{

        padding:14px;

    }

    .logo-img{

        width:100px;
        height:100px;

    }

    .logo h1{

        font-size:29px;

    }

    .logo p{

        font-size:13px;

    }

    .logo h3{

        font-size:14px;

    }

    .card{

        padding:22px 17px;

        border-radius:23px;

    }

    .card h2{

        font-size:23px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ================= LOGO ================= -->

    <div class="logo">

        <img
            src="icon-512.png"
            class="logo-img"
            alt="THE STUDY POINT">

        <h1>
            THE STUDY POINT
        </h1>

        <p>
            Computer Based Test
        </p>

        <h3>
            STUDENT APP
        </h3>

    </div>


    <!-- ================= LOGIN CARD ================= -->

    <div class="card">


        <h2>
            🔐 LOGIN
        </h2>


        <div class="login-title">

            <i class="fa-solid fa-user-graduate"></i>

            STUDENT LOGIN

        </div>


        <!-- ROLL NUMBER -->

        <div class="input-group">

            <i class="fa-solid fa-id-card"></i>

            <input
                type="text"
                id="roll"
                placeholder="Enter Roll Number"
                autocomplete="off">

        </div>


        <!-- CONTINUE -->

        <button
            class="continue-btn"
            id="continueBtn">

            CONTINUE

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- ADMIN -->

        <div class="admin-section">

            <button
                class="admin-btn"
                id="adminBtn">

                <i class="fa-solid fa-user-shield"></i>

                &nbsp; ADMIN LOGIN

            </button>

        </div>


    </div>


    <div class="footer">

        THE STUDY POINT • CBT PORTAL • SESSION 2026-27

    </div>


</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    query,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= ELEMENTS ================= */

const rollInput =
document.getElementById("roll");

const continueBtn =
document.getElementById("continueBtn");

const message =
document.getElementById("message");

const adminBtn =
document.getElementById("adminBtn");


/* ================= MESSAGE ================= */

function showMessage(text,type){

    message.className =
    "message " + type;

    message.textContent =
    text;

}


/* ================= STUDENT LOGIN ================= */

async function studentLogin(){

    const roll =
    rollInput.value.trim();


    if(!roll){

        showMessage(
            "कृपया Roll Number डालें।",
            "error"
        );

        return;

    }


    showMessage(
        "Checking Roll Number...",
        "loading"
    );


    continueBtn.disabled = true;


    try{


        /*
        ==================================================
        FIRST: OLD PREMIUM PORTAL STUDENT
        ==================================================
        */

        const oldQuery =
        query(
            collection(db,"students_v2"),
            where("Roll","==",roll)
        );


        const oldSnap =
        await getDocs(oldQuery);


        if(!oldSnap.empty){

            const student =
            oldSnap.docs[0].data();


            /*
            OLD STUDENT
            LIMITED ACCESS
            */

            sessionStorage.clear();


            sessionStorage.setItem(
                "cbtAppLogin",
                "true"
            );


            sessionStorage.setItem(
                "studentType",
                "old"
            );


            sessionStorage.setItem(
                "studentRoll",
                String(student.Roll || roll)
            );


            sessionStorage.setItem(
                "studentName",
                String(student.Name || "")
            );


            sessionStorage.setItem(
                "studentClass",
                String(student.Class || "")
            );


            location.href =
            "cbt-student-dashboard.html";


            return;

        }


        /*
        ==================================================
        SECOND: NEW FULL ACCESS STUDENT
        ==================================================
        */

        const newQuery =
        query(
            collection(db,"paidNotesStudents"),
            where("roll","==",roll)
        );


        const newSnap =
        await getDocs(newQuery);


        if(!newSnap.empty){

            const student =
            newSnap.docs[0].data();


            /*
            DISABLED ACCOUNT
            */

            if(
                student.enabled === false
            ){

                showMessage(
                    "यह Student account disabled है।",
                    "error"
                );

                continueBtn.disabled = false;

                return;

            }


            /*
            FULL ACCESS
            */

            sessionStorage.clear();


            sessionStorage.setItem(
                "cbtAppLogin",
                "true"
            );


            sessionStorage.setItem(
                "studentType",
                "full"
            );


            sessionStorage.setItem(
                "studentRoll",
                String(student.roll || roll)
            );


            sessionStorage.setItem(
                "studentName",
                String(student.name || "")
            );


            sessionStorage.setItem(
                "studentClass",
                String(student.className || "")
            );


            location.href =
            "cbt-student-dashboard.html";


            return;

        }


        /*
        ==================================================
        NOT FOUND
        ==================================================
        */

        showMessage(
            "Invalid Roll Number. कृपया सही Roll Number डालें।",
            "error"
        );


        continueBtn.disabled = false;


    }
    catch(error){

        console.error(error);


        showMessage(
            "Login error: " + error.message,
            "error"
        );


        continueBtn.disabled = false;

    }

}


/* ================= BUTTON ================= */

continueBtn.addEventListener(
    "click",
    studentLogin
);


/* ================= ENTER KEY ================= */

rollInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            studentLogin();

        }

    }
);


/* ================= ADMIN ================= */

adminBtn.addEventListener(
    "click",
    function(){

        location.href =
        "admin-login.html";

    }
);

</script>

</body>
  </html>
