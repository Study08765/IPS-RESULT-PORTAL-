<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CBT Exam</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef4ff;
padding:15px;
}

.container{
max-width:950px;
margin:auto;
}

.header{
background:
linear-gradient(
135deg,
#0052D4,
#3B82F6
);

color:#fff;

padding:20px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 8px 25px
rgba(0,82,212,.25);
}

.header h2{
font-size:28px;
font-weight:700;
}

.header p{
font-size:14px;
opacity:.9;
}

.timer{

background:#fff;

color:#0052D4;

padding:12px 18px;

border-radius:15px;

text-align:center;

min-width:120px;
}

.timer h2{
font-size:28px;
margin-top:5px;
}

.student-card,
.progress-card,
.question-card,
.palette{

background:#fff;

margin-top:18px;

padding:20px;

border-radius:20px;

box-shadow:
0 6px 20px
rgba(0,0,0,.08);
}

.student-card{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:15px;
}

.student-card div{

background:#f7faff;

padding:15px;

border-radius:15px;

text-align:center;
}

.student-card small{
color:#666;
}

.student-card h3{

margin-top:6px;

color:#0052D4;
}

.progress-text{

font-weight:600;

margin-bottom:12px;
}

.progress-bar{

height:10px;

background:#e4ebff;

border-radius:20px;

overflow:hidden;
}

#progressFill{

width:0%;

height:100%;

background:#0052D4;

transition:.3s;
}

.question-card h3{

margin-bottom:20px;

font-size:22px;
}

.options label{

display:block;

padding:16px;

margin-bottom:12px;

border:2px solid #dce6ff;

border-radius:15px;

cursor:pointer;

transition:.2s;

background:#fff;
}

.options label:hover{

border-color:#0052D4;

background:#f5f9ff;
}

.options input{
margin-right:10px;
}

.buttons{

display:flex;

gap:15px;

margin-top:18px;
}

.buttons button{

flex:1;

padding:16px;

border:none;

border-radius:15px;

background:#0052D4;

color:#fff;

font-size:18px;

font-weight:600;

cursor:pointer;
}

.palette h3{
margin-bottom:15px;
}

#paletteContainer{

display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(45px,1fr)
);

gap:10px;
}

#paletteContainer button{

height:45px;

border:none;

border-radius:12px;

background:#edf3ff;

font-weight:700;

cursor:pointer;
}

#submitBtn{

width:100%;

margin-top:20px;

padding:18px;

border:none;

border-radius:18px;

background:#16a34a;

color:#fff;

font-size:22px;

font-weight:700;

cursor:pointer;
}

@media(max-width:768px){

.header{

flex-direction:column;

gap:15px;

text-align:center;
}

.student-card{

grid-template-columns:1fr;
}

.buttons{

flex-direction:column;
}

}

</style>

</head>

<body>


<div class="container">


<div class="header">

<div>

<h2>
THE STUDY POINT
</h2>

<p>
Computer Based Test (CBT)
</p>

</div>


<div class="timer">

<span>
Time Left
</span>

<h2 id="timer">
00:00
</h2>

</div>

</div>


<div class="student-card">

<div>

<small>
Name
</small>

<h3 id="studentName">
-
</h3>

</div>


<div>

<small>
Roll No
</small>

<h3 id="studentRoll">
-
</h3>

</div>


<div>

<small>
Class
</small>

<h3 id="studentClass">
-
</h3>

</div>

</div>


<div class="progress-card">

<div class="progress-text">

Question

<span id="currentQuestion">
1
</span>

/

<span id="totalQuestions">
0
</span>

</div>


<div class="progress-bar">

<div id="progressFill">
</div>

</div>

</div>


<div class="question-card">

<h3 id="questionText">
Loading Question...
</h3>


<div class="options">

<label>

<input
type="radio"
name="answer"
value="A">

<span id="optionA">
</span>

</label>


<label>

<input
type="radio"
name="answer"
value="B">

<span id="optionB">
</span>

</label>


<label>

<input
type="radio"
name="answer"
value="C">

<span id="optionC">
</span>

</label>


<label>

<input
type="radio"
name="answer"
value="D">

<span id="optionD">
</span>

</label>

</div>

</div>


<div class="buttons">

<button id="prevBtn">
◀ Previous
</button>

<button id="nextBtn">
Next ▶
</button>

</div>


<div class="palette">

<h3>
Question Palette
</h3>

<div id="paletteContainer">
</div>

</div>


<button id="submitBtn">
Submit Exam
</button>


</div>


<script type="module">

import { db }
from "./firebase.js";

import {

collection,
query,
where,
getDocs,
doc,
getDoc,
setDoc,
serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   SECURITY
========================================= */

const verified =
sessionStorage.getItem(
"examPinVerified"
);

const verifiedExamId =
sessionStorage.getItem(
"verifiedExamId"
);

const examId =
sessionStorage.getItem(
"examId"
);


if(
verified!=="true" ||
!examId ||
verifiedExamId!==examId
){

alert(
"Exam access denied. Please login first."
);

location.href=
"student-cbt.html";

}


/* =========================================
   ELEMENTS
========================================= */

const studentName =
document.getElementById(
"studentName"
);

const studentRoll =
document.getElementById(
"studentRoll"
);

const studentClass =
document.getElementById(
"studentClass"
);

const questionText =
document.getElementById(
"questionText"
);

const optionA =
document.getElementById(
"optionA"
);

const optionB =
document.getElementById(
"optionB"
);

const optionC =
document.getElementById(
"optionC"
);

const optionD =
document.getElementById(
"optionD"
);

const totalQuestions =
document.getElementById(
"totalQuestions"
);

const currentQuestion =
document.getElementById(
"currentQuestion"
);

const progressFill =
document.getElementById(
"progressFill"
);

const timer =
document.getElementById(
"timer"
);

const submitBtn =
document.getElementById(
"submitBtn"
);

const prevBtn =
document.getElementById(
"prevBtn"
);

const nextBtn =
document.getElementById(
"nextBtn"
);

const paletteContainer =
document.getElementById(
"paletteContainer"
);


/* =========================================
   STUDENT DATA
========================================= */

studentName.textContent =
sessionStorage.getItem(
"studentName"
) || "";

studentRoll.textContent =
sessionStorage.getItem(
"studentRoll"
) || "";

studentClass.textContent =
sessionStorage.getItem(
"studentClass"
) || "";


/* =========================================
   VARIABLES
========================================= */

let timeLeft=0;

let timerInterval;

let questions=[];

let currentIndex=0;

let answers={};

let examSubmitted=false;


/* =========================================
   LOAD QUESTIONS
========================================= */

async function loadQuestions(){

try{

const q=query(

collection(
db,
"cbtQuestions"
),

where(
"testId",
"==",
examId
)

);


const examSnap=
await getDoc(
doc(
db,
"cbtTests",
examId
)
);


if(!examSnap.exists()){

alert(
"Exam not found."
);

location.href=
"student-cbt.html";

return;

}


const exam=
examSnap.data();


/* =====================================
   VERIFY EXAM PIN EXISTS
===================================== */

if(!exam.examPin){

alert(
"Exam PIN not configured."
);

location.href=
"student-cbt.html";

return;

}


/* =====================================
   VERIFY EXAM TIME
===================================== */

const now=new Date();

const start=
new Date(exam.start);

const end=
new Date(exam.end);


if(exam.status!=="OPEN"){

alert(
"Exam is not open."
);

location.href=
"student-cbt.html";

return;

}


if(now<start){

alert(
"Exam has not started yet."
);

location.href=
"student-cbt.html";

return;

}


if(now>end){

alert(
"Exam time has expired."
);

location.href=
"student-cbt.html";

return;

}


/* =====================================
   TIMER
===================================== */

timeLeft=
Number(exam.duration)*60;

startTimer();


/* =====================================
   QUESTIONS
===================================== */

const snap=
await getDocs(q);

questions=[];


snap.forEach(docSnap=>{

questions.push({

id:docSnap.id,

...docSnap.data()

});

});


if(questions.length===0){

alert(
"No questions found for this exam."
);

return;

}


totalQuestions.textContent=
questions.length;

createPalette();

showQuestion();


}catch(error){

console.error(
"Load Questions Error:",
error
);

alert(
"Questions load नहीं हुए."
);

}

}


/* =========================================
   TIMER
========================================= */

function startTimer(){

clearInterval(timerInterval);


timerInterval=
setInterval(()=>{

let minutes=
Math.floor(
timeLeft/60
);

let seconds=
timeLeft%60;


timer.textContent=
String(minutes)
.padStart(2,"0")
+
":"+
String(seconds)
.padStart(2,"0");


if(timeLeft<=0){

clearInterval(
timerInterval
);

submitExam(true);

return;

}

timeLeft--;

},1000);

}


/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion(){

const q=
questions[currentIndex];


if(!q){
return;
}


questionText.textContent=
q.question || "";


optionA.textContent=
q.optionA || "";

optionB.textContent=
q.optionB || "";

optionC.textContent=
q.optionC || "";

optionD.textContent=
q.optionD || "";


document
.querySelectorAll(
"input[name='answer']"
)
.forEach(r=>{

r.checked=
answers[q.id]===r.value;

});


currentQuestion.textContent=
currentIndex+1;


progressFill.style.width=
(
(currentIndex+1)/
questions.length
)*100+"%";


highlightPalette();

}


/* =========================================
   SAVE ANSWER
========================================= */

function saveCurrentAnswer(){

const selected=
document.querySelector(
"input[name='answer']:checked"
);


if(selected){

const q=
questions[currentIndex];

answers[q.id]=
selected.value;

}

}


/* =========================================
   PALETTE
========================================= */

function createPalette(){

paletteContainer.innerHTML="";


for(
let i=0;
i<questions.length;
i++
){

const btn=
document.createElement(
"button"
);

btn.textContent=
i+1;


btn.onclick=()=>{

saveCurrentAnswer();

currentIndex=i;

showQuestion();

};


paletteContainer.appendChild(
btn
);

}


highlightPalette();

}


function highlightPalette(){

const btns=
paletteContainer
.querySelectorAll(
"button"
);


btns.forEach(
(btn,index)=>{

btn.style.background=
"#edf3ff";

btn.style.color=
"#000";


if(
answers[
questions[index]?.id
]
){

btn.style.background=
"#16a34a";

btn.style.color=
"#fff";

}


if(index===currentIndex){

btn.style.background=
"#0052D4";

btn.style.color=
"#fff";

}

});

}


/* =========================================
   NEXT
========================================= */

nextBtn.onclick=()=>{

saveCurrentAnswer();


if(
currentIndex<
questions.length-1
){

currentIndex++;

showQuestion();

}

};


/* =========================================
   PREVIOUS
========================================= */

prevBtn.onclick=()=>{

saveCurrentAnswer();


if(currentIndex>0){

currentIndex--;

showQuestion();

}

};


/* =========================================
   SUBMIT EXAM
========================================= */

async function submitExam(autoSubmit=false){

if(examSubmitted){
return;
}


if(!autoSubmit){

const ok=
confirm(
"क्या आप वाकई परीक्षा सबमिट करना चाहते हैं?\n\nसबमिट करने के बाद दोबारा परीक्षा नहीं दे पाएंगे।"
);


if(!ok){
return;
}

}


examSubmitted=true;

clearInterval(
timerInterval
);

saveCurrentAnswer();


submitBtn.disabled=true;

submitBtn.textContent=
"Submitting...";


let correct=0;


questions.forEach((q)=>{

if(
answers[q.id]===q.answer
){

correct++;

}

});


const total=
questions.length;

const wrong=
total-correct;


const percentage=
total>0
?
((correct/total)*100).toFixed(2)
:
"0.00";


const result=
percentage>=33
?
"PASS"
:
"FAIL";


const studentRoll=
sessionStorage.getItem(
"studentRoll"
);


const studentName=
sessionStorage.getItem(
"studentName"
);


const studentClass=
sessionStorage.getItem(
"studentClass"
);


/* =====================================
   RESPONSE
===================================== */

await setDoc(

doc(
db,
"cbtResponses",
examId+"_"+studentRoll
),

{

studentRoll:
studentRoll,

studentName:
studentName,

studentClass:
studentClass,

examId:
examId,

submitted:true,

allowRetest:false,

answers:
answers,

submittedAt:
serverTimestamp()

}

);


/* =====================================
   RESULT
===================================== */

await setDoc(

doc(
db,
"cbtResults",
examId+"_"+studentRoll
),

{

studentRoll:
studentRoll,

studentName:
studentName,

studentClass:
studentClass,

examId:
examId,

correct:
correct,

wrong:
wrong,

totalQuestions:
total,

percentage:
Number(percentage),

result:
result,

answers:
answers,

submittedAt:
serverTimestamp()

}

);


/* =====================================
   DESTROY EXAM ACCESS
===================================== */

sessionStorage.removeItem(
"examPinVerified"
);

sessionStorage.removeItem(
"verifiedExamId"
);

sessionStorage.removeItem(
"examId"
);

sessionStorage.removeItem(
"examCode"
);

examSubmitted=true;


/* =====================================
   SUCCESS
===================================== */

window.location.href=
"submit-success.html";

}


/* =========================================
   SUBMIT BUTTON
========================================= */

submitBtn.onclick=()=>{

submitExam(false);

};


/* =========================================
   SECURITY
========================================= */


/* Back Button */

history.pushState(
null,
null,
location.href
);


window.addEventListener(
"popstate",
function(){

history.pushState(
null,
null,
location.href
);

alert(
"Exam के दौरान Back जाना अनुमति नहीं है."
);

});


/* Refresh Warning */

window.addEventListener(
"beforeunload",
function(e){

if(examSubmitted){
return;
}

e.preventDefault();

e.returnValue="";

});


/* Copy */

document.addEventListener(
"copy",
e=>e.preventDefault()
);


/* Cut */

document.addEventListener(
"cut",
e=>e.preventDefault()
);


/* Paste */

document.addEventListener(
"paste",
e=>e.preventDefault()
);


/* Right Click */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);


/* Keyboard */

document.addEventListener(
"keydown",
function(e){

if(

e.key==="F12" ||

(
e.ctrlKey &&
e.shiftKey &&
["I","J","C"]
.includes(
e.key.toUpperCase()
)
) ||

(
e.ctrlKey &&
e.key.toUpperCase()==="U"
) ||

(
e.ctrlKey &&
e.key.toUpperCase()==="R"
) ||

e.key==="F5"

){

e.preventDefault();

}

});


/* Tab Change */

document.addEventListener(
"visibilitychange",
function(){

if(document.hidden){

/* Tab change detected */

}

});


/* =========================================
   START
========================================= */

loadQuestions();

</script>

</body>
  </html>
