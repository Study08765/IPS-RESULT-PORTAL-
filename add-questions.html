<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Questions | THE STUDY POINT CBT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
padding:20px;
border-radius:20px;
margin-bottom:25px;
border:1px solid rgba(255,255,255,.2);
}

.header h1{
color:#fff;
font-size:28px;
font-weight:700;
}

.header a{
text-decoration:none;
background:#facc15;
color:#111827;
padding:10px 18px;
border-radius:10px;
font-weight:600;
}

.card,.tableCard{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
margin-bottom:25px;
}

#testTitle{
color:#1e3a8a;
margin-bottom:8px;
}

#testId{
color:#64748b;
margin-bottom:20px;
font-size:14px;
}

textarea,
input,
select{
width:100%;
padding:14px;
margin-bottom:15px;
border:2px solid #dbeafe;
border-radius:12px;
font-size:15px;
outline:none;
}

textarea{
height:120px;
resize:vertical;
}

textarea:focus,
input:focus,
select:focus{
border-color:#2563eb;
}

#saveBtn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#2563eb,#1d4ed8);
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1d4ed8;
color:#fff;
padding:14px;
}

td{
padding:14px;
border-bottom:1px solid #e5e7eb;
text-align:center;
}

@media(max-width:768px){

.header{
flex-direction:column;
gap:15px;
}

.header h1{
font-size:22px;
}

.card,
.tableCard{
padding:18px;
}

  }

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
<i class="fa-solid fa-file-circle-plus"></i>
Add Questions
</h1>

<a href="create-test.html">
<i class="fa-solid fa-arrow-left"></i>
Back
</a>

</div>

<div class="card">

<h2 id="testTitle">
Loading Test...
</h2>

<p id="testId"></p>

<div class="form">

<textarea
id="question"
placeholder="Enter Question">
</textarea>

<input
type="text"
id="optionA"
placeholder="Option A">

<input
type="text"
id="optionB"
placeholder="Option B">

<input
type="text"
id="optionC"
placeholder="Option C">

<input
type="text"
id="optionD"
placeholder="Option D">

<select id="answer">

<option value="">Correct Answer</option>

<option value="A">
Option A
</option>

<option value="B">
Option B
</option>

<option value="C">
Option C
</option>

<option value="D">
Option D
</option>

</select>

<button id="saveBtn">

<i class="fa-solid fa-floppy-disk"></i>

Save Question

</button>

</div>

</div>

<div class="tableCard">

<h2>

Questions List

</h2>

<table>

<thead>

<tr>

<th>#</th>

<th>Question</th>

<th>Answer</th>

<th>Action</th>

</tr>

</thead>

<tbody id="questionList">

</tbody>

</table>

</div>

</div>

</body>

</html>
