<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>THE STUDY POINT | Student Registration</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* ==================================================
   RESET
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
}


/* ==================================================
   BODY
================================================== */

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:18px;

    background:
    linear-gradient(
        rgba(0,35,85,.55),
        rgba(0,15,45,.80)
    ),
    url("hero-bg.jpg") center/cover fixed;

}


/* ==================================================
   MAIN BOX
================================================== */

.box{

    width:100%;

    max-width:500px;

    background:
    rgba(255,255,255,.14);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    border:
    2px solid
    rgba(255,215,0,.30);

    border-radius:28px;

    padding:28px 22px;

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.40);

}


/* ==================================================
   LOGO
================================================== */

.logo{

    text-align:center;

    color:#fff;

    margin-bottom:22px;

}

.logo img{

    width:90px;

    height:90px;

    border-radius:50%;

    background:#fff;

    padding:5px;

    border:
    3px solid
    #FFD700;

    box-shadow:
    0 0 25px
    rgba(255,215,0,.50);

}

.logo h1{

    color:#FFD700;

    font-size:26px;

    margin-top:10px;

    font-weight:800;

}

.logo p{

    font-size:11px;

    margin-top:3px;

}


/* ==================================================
   TITLE
================================================== */

.title{

    color:#fff;

    text-align:center;

    font-size:21px;

    margin-bottom:20px;

    font-weight:800;

}


/* ==================================================
   FIELD
================================================== */

.field{

    margin-bottom:13px;

}

label{

    display:block;

    color:#fff;

    font-size:11px;

    font-weight:700;

    margin-bottom:5px;

}

input,
select{

    width:100%;

    height:50px;

    border:0;

    outline:none;

    border-radius:12px;

    padding:0 14px;

    background:#fff;

    color:#222;

    font-size:14px;

    font-weight:600;

}

input:focus,
select:focus{

    box-shadow:
    0 0 0 3px
    rgba(255,215,0,.35);

}


/* ==================================================
   REGISTER BUTTON
================================================== */

.register-btn{

    width:100%;

    height:55px;

    margin-top:7px;

    border:0;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #FFD700,
        #ffad00
    );

    color:#111;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:.25s;

}

.register-btn:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0 10px 25px
    rgba(255,174,0,.35);

}

.register-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* ==================================================
   MESSAGE
================================================== */

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    text-align:center;

    font-size:11px;

    font-weight:700;

    line-height:1.6;

}

.message.error{

    display:block;

    background:#ffe5e5;

    color:#a00000;

}

.message.success{

    display:block;

    background:#e6fff1;

    color:#08743c;

}


/* ==================================================
   ROLL RESULT
================================================== */

.result{

    display:none;

    margin-top:16px;

    background:#fff;

    border-radius:17px;

    padding:19px;

    text-align:center;

    box-shadow:
    0 10px 25px
    rgba(0,0,0,.15);

}

.result small{

    color:#777;

    font-size:10px;

    font-weight:600;

}

.roll{

    color:#0752a5;

    font-size:31px;

    font-weight:900;

    margin:5px 0;

    letter-spacing:2px;

}

.result p{

    color:#555;

    font-size:10px;

    line-height:1.8;

}


/* ==================================================
   LOGIN LINK
================================================== */

.login{

    text-align:center;

    margin-top:18px;

}

.login a{

    color:#FFD700;

    text-decoration:none;

    font-size:12px;

    font-weight:700;

}

.login a:hover{

    text-decoration:underline;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:500px){

    .box{

        padding:23px 16px;

    }

    .logo h1{

        font-size:23px;

    }

}

</style>

</head>


<body>


<div class="box">


    <!-- ==================================================
         LOGO
    ================================================== -->

    <div class="logo">

        <img
            src="icon-512.png"
            alt="THE STUDY POINT">

        <h1>
            THE STUDY POINT
        </h1>

        <p>
            CBT PORTAL &amp; STUDENT SERVICES
        </p>

    </div>


    <!-- ==================================================
         TITLE
    ================================================== -->

    <div class="title">

        📝 STUDENT REGISTRATION

    </div>


    <!-- ==================================================
         STUDENT NAME
    ================================================== -->

    <div class="field">

        <label>
            Student Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="Enter Student Name"
            autocomplete="name"
            maxlength="60">

    </div>


    <!-- ==================================================
         CLASS
    ================================================== -->

    <div class="field">

        <label>
            Class
        </label>

        <select id="studentClass">

            <option value="">
                Select Class
            </option>

            <option value="Class 1">
                Class 1
            </option>

            <option value="Class 2">
                Class 2
            </option>

            <option value="Class 3">
                Class 3
            </option>

            <option value="Class 4">
                Class 4
            </option>

            <option value="Class 5">
                Class 5
            </option>

            <option value="Class 6">
                Class 6
            </option>

            <option value="Class 7">
                Class 7
            </option>

            <option value="Class 8">
                Class 8
            </option>

            <option value="Class 9">
                Class 9
            </option>

            <option value="Class 10">
                Class 10
            </option>

        </select>

    </div>


    <!-- ==================================================
         MOBILE
    ================================================== -->

    <div class="field">

        <label>
            Mobile Number
        </label>

        <input
            id="mobile"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            placeholder="Enter 10 Digit Mobile Number"
            autocomplete="tel">

    </div>


    <!-- ==================================================
         FATHER NAME
    ================================================== -->

    <div class="field">

        <label>
            Father / Guardian Name
        </label>

        <input
            id="father"
            type="text"
            placeholder="Enter Father / Guardian Name"
            autocomplete="off"
            maxlength="60">

    </div>


    <!-- ==================================================
         REGISTER
    ================================================== -->

    <button
        id="registerBtn"
        class="register-btn">

        REGISTER NOW

    </button>


    <!-- ==================================================
         MESSAGE
    ================================================== -->

    <div
        id="message"
        class="message">

    </div>


    <!-- ==================================================
         GENERATED ROLL
    ================================================== -->

    <div
        id="result"
        class="result">

        <small>
            YOUR UNIQUE ROLL NUMBER
        </small>

        <div
            id="roll"
            class="roll">

        </div>

        <p>

            🎉 Registration successful!

            <br>

            आपका Registration Admin Approval के लिए भेज दिया गया है।

            <br>

            इस Roll Number को सुरक्षित रखें।

            <br>

            Approval के बाद इसी Roll Number से Login करें।

        </p>

    </div>


    <!-- ==================================================
         LOGIN
    ================================================== -->

    <div class="login">

        <a href="student-entry.html">

            Already Registered?
            Student Login →

        </a>

    </div>


</div>


<!-- ==================================================
     FIREBASE
================================================== -->

<script type="module">

import { db } from "./firebase.js";

import {

    collection,
    getDocs,
    addDoc,
    query,
    where,
    doc,
    runTransaction,
    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   ELEMENTS
================================================== */

const nameBox =
document.getElementById("name");

const classBox =
document.getElementById("studentClass");

const mobileBox =
document.getElementById("mobile");

const fatherBox =
document.getElementById("father");

const registerBtn =
document.getElementById("registerBtn");

const message =
document.getElementById("message");

const result =
document.getElementById("result");

const rollBox =
document.getElementById("roll");


/* ==================================================
   SHOW MESSAGE
================================================== */

function showMessage(
    text,
    type
){

    message.className =
    "message " + type;

    message.textContent =
    text;

}


/* ==================================================
   GET NEXT ROLL NUMBER
==================================================

   Uses a Firestore transaction.

   Counter document:

   collection:
   systemCounters

   document:
   subscriptionStudentRoll

================================================== */

async function getNextRoll(){

    const counterRef =
    doc(
        db,
        "systemCounters",
        "subscriptionStudentRoll"
    );


    const nextNumber =
    await runTransaction(
    db,
    async function(transaction){

        const counterSnap =
        await transaction.get(
            counterRef
        );


        let currentNumber = 0;


        if(
            counterSnap.exists()
        ){

            const data =
            counterSnap.data();


            currentNumber =
            Number(
                data.lastNumber || 0
            );

        }


        const newNumber =
        currentNumber + 1;


        transaction.set(

            counterRef,

            {

                lastNumber:
                newNumber,

                updatedAt:
                serverTimestamp()

            },

            {

                merge:true

            }

        );


        return newNumber;

    });


    return "TSP" +
    String(nextNumber)
    .padStart(3,"0");

}


/* ==================================================
   CHECK MOBILE
================================================== */

async function mobileAlreadyRegistered(
    mobile
){

    const mobileQuery =
    query(

        collection(
            db,
            "subscriptionStudents"
        ),

        where(
            "mobile",
            "==",
            mobile
        )

    );


    const snap =
    await getDocs(
        mobileQuery
    );


    return !snap.empty;

}


/* ==================================================
   REGISTRATION
================================================== */

registerBtn.addEventListener(
"click",
async function(){

    const name =
    nameBox.value
    .trim();


    const studentClass =
    classBox.value;


    const mobile =
    mobileBox.value
    .trim();


    const father =
    fatherBox.value
    .trim();


    /* =========================================
       VALIDATION
    ========================================= */

    if(!name){

        showMessage(
            "Student Name भरें।",
            "error"
        );

        nameBox.focus();

        return;

    }


    if(name.length < 2){

        showMessage(
            "Student Name सही भरें।",
            "error"
        );

        nameBox.focus();

        return;

    }


    if(!studentClass){

        showMessage(
            "Class select करें।",
            "error"
        );

        classBox.focus();

        return;

    }


    if(
        !/^[0-9]{10}$/.test(
            mobile
        )
    ){

        showMessage(
            "सही 10 digit Mobile Number डालें।",
            "error"
        );

        mobileBox.focus();

        return;

    }


    if(!father){

        showMessage(
            "Father / Guardian Name भरें।",
            "error"
        );

        fatherBox.focus();

        return;

    }


    if(father.length < 2){

        showMessage(
            "Father / Guardian Name सही भरें।",
            "error"
        );

        fatherBox.focus();

        return;

    }


    /* =========================================
       BUTTON LOCK
    ========================================= */

    registerBtn.disabled =
    true;

    registerBtn.textContent =
    "CHECKING...";


    try{


        /* ======================================
           DUPLICATE MOBILE
        ====================================== */

        const alreadyRegistered =
        await mobileAlreadyRegistered(
            mobile
        );


        if(
            alreadyRegistered
        ){

            showMessage(
                "इस Mobile Number से पहले ही Registration हो चुका है।",
                "error"
            );

            registerBtn.disabled =
            false;

            registerBtn.textContent =
            "REGISTER NOW";

            return;

        }


        /* ======================================
           GENERATE UNIQUE ROLL
        ====================================== */

        registerBtn.textContent =
        "CREATING ROLL NUMBER...";


        const roll =
        await getNextRoll();


        /* ======================================
           SAVE STUDENT
        ====================================== */

        registerBtn.textContent =
        "SUBMITTING REGISTRATION...";


        await addDoc(

            collection(
                db,
                "subscriptionStudents"
            ),

            {

                roll:
                roll,

                name:
                name,

                className:
                studentClass,

                mobile:
                mobile,

                fatherName:
                father,

                status:
                "pending",

                enabled:
                false,

                accessType:
                "none",

                subscriptionPlan:
                "",

                subscriptionExpiry:
                null,

                createdAt:
                serverTimestamp()

            }

        );


        /* ======================================
           SHOW SUCCESS
        ====================================== */

        rollBox.textContent =
        roll;


        result.style.display =
        "block";


        showMessage(
            "Registration successful! Admin approval pending.",
            "success"
        );


        /* LOCK FORM */

        registerBtn.style.display =
        "none";


        nameBox.disabled =
        true;

        classBox.disabled =
        true;

        mobileBox.disabled =
        true;

        fatherBox.disabled =
        true;


        /* SCROLL TO ROLL */

        setTimeout(
        function(){

            result.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        },
        100
        );


    }
    catch(error){

        console.error(
            "Registration Error:",
            error
        );


        showMessage(

            "Registration failed: " +
            error.message,

            "error"

        );


        registerBtn.disabled =
        false;

        registerBtn.textContent =
        "REGISTER NOW";

    }

});


/* ==================================================
   MOBILE INPUT
================================================== */

mobileBox.addEventListener(
"input",
function(){

    this.value =
    this.value
    .replace(
        /[^0-9]/g,
        ""
    )
    .slice(
        0,
        10
    );

});


/* ==================================================
   ENTER KEY
================================================== */

document.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Enter" &&
        !registerBtn.disabled
    ){

        registerBtn.click();

    }

});

</script>


</body>

  </html>
