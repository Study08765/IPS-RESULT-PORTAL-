<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>THE STUDY POINT | Student Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px;

    background:
    linear-gradient(
        rgba(0,35,85,.55),
        rgba(0,15,45,.78)
    ),
    url("hero-bg.jpg") center/cover fixed;
}

.box{
    width:100%;
    max-width:500px;

    background:rgba(255,255,255,.14);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:2px solid rgba(255,215,0,.30);

    border-radius:28px;

    padding:28px 22px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.4);
}


/* LOGO */

.logo{
    text-align:center;
    color:#fff;
    margin-bottom:22px;
}

.logo img{
    width:90px;
    height:90px;

    border-radius:50%;

    background:#fff;

    padding:5px;

    border:3px solid #FFD700;
}

.logo h1{
    color:#FFD700;

    font-size:26px;

    margin-top:10px;

    font-weight:800;
}

.logo p{
    font-size:11px;
    margin-top:3px;
}


/* TITLE */

h2{
    color:#fff;

    text-align:center;

    font-size:21px;

    margin-bottom:20px;
}


/* FIELD */

.field{
    margin-bottom:13px;
}

label{
    display:block;

    color:#fff;

    font-size:11px;

    font-weight:700;

    margin-bottom:5px;
}

input,
select{

    width:100%;

    height:50px;

    border:0;

    outline:none;

    border-radius:12px;

    padding:0 14px;

    background:#fff;

    color:#222;

    font-size:14px;

    font-weight:600;
}

input:focus,
select:focus{

    box-shadow:
    0 0 0 3px
    rgba(255,215,0,.35);
}


/* REGISTER BUTTON */

button{

    width:100%;

    height:55px;

    margin-top:7px;

    border:0;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #FFD700,
        #ffad00
    );

    color:#111;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

}

button:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* MESSAGE */

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    text-align:center;

    font-size:11px;

    font-weight:700;
}

.error{

    display:block;

    background:#ffe5e5;

    color:#a00000;
}

.success{

    display:block;

    background:#e6fff1;

    color:#08743c;
}


/* ROLL RESULT */

.result{

    display:none;

    margin-top:15px;

    background:#fff;

    border-radius:16px;

    padding:18px;

    text-align:center;
}

.result small{

    color:#777;

    font-size:10px;
}

.roll{

    color:#0752a5;

    font-size:29px;

    font-weight:900;

    margin:5px 0;
}

.result p{

    color:#555;

    font-size:10px;

    line-height:1.7;
}


/* LOGIN LINK */

.login{

    text-align:center;

    margin-top:18px;
}

.login a{

    color:#FFD700;

    text-decoration:none;

    font-size:12px;

    font-weight:700;
}


/* MOBILE */

@media(max-width:500px){

    .box{
        padding:23px 16px;
    }

    .logo h1{
        font-size:23px;
    }

}

</style>

</head>


<body>


<div class="box">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="icon-512.png"
            alt="THE STUDY POINT">

        <h1>
            THE STUDY POINT
        </h1>

        <p>
            CBT PORTAL &amp; STUDENT SERVICES
        </p>

    </div>


    <!-- TITLE -->

    <h2>
        📝 STUDENT REGISTRATION
    </h2>


    <!-- NAME -->

    <div class="field">

        <label>
            Student Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="Enter Student Name"
            autocomplete="off">

    </div>


    <!-- CLASS -->

    <div class="field">

        <label>
            Class
        </label>

        <select id="studentClass">

            <option value="">
                Select Class
            </option>

            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
            <option>Class 4</option>
            <option>Class 5</option>
            <option>Class 6</option>
            <option>Class 7</option>
            <option>Class 8</option>
            <option>Class 9</option>
            <option>Class 10</option>

        </select>

    </div>


    <!-- MOBILE -->

    <div class="field">

        <label>
            Mobile Number
        </label>

        <input
            id="mobile"
            type="tel"
            maxlength="10"
            placeholder="Enter Mobile Number"
            autocomplete="off">

    </div>


    <!-- FATHER -->

    <div class="field">

        <label>
            Father / Guardian Name
        </label>

        <input
            id="father"
            type="text"
            placeholder="Enter Father / Guardian Name"
            autocomplete="off">

    </div>


    <!-- REGISTER -->

    <button id="registerBtn">

        REGISTER NOW

    </button>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- GENERATED ROLL -->

    <div
        id="result"
        class="result">

        <small>
            YOUR UNIQUE ROLL NUMBER
        </small>

        <div
            id="roll"
            class="roll">
        </div>

        <p>

            Registration successful.<br>

            आपका Roll Number सुरक्षित रखें।<br>

            Admin approval के बाद इसी Roll Number से Login होगा।

        </p>

    </div>


    <!-- LOGIN -->

    <div class="login">

        <a href="student-login.html">

            Already Registered?
            Student Login →

        </a>

    </div>


</div>


<script type="module">


/* =========================================
   FIREBASE
========================================= */

import { db } from "./firebase.js";

import {

    collection,
    getDocs,
    addDoc,
    query,
    where,
    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   ELEMENTS
========================================= */

const nameBox =
document.getElementById("name");

const classBox =
document.getElementById("studentClass");

const mobileBox =
document.getElementById("mobile");

const fatherBox =
document.getElementById("father");

const registerBtn =
document.getElementById("registerBtn");

const message =
document.getElementById("message");

const result =
document.getElementById("result");

const rollBox =
document.getElementById("roll");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.className =
    "message " + type;

    message.textContent =
    text;

}


/* =========================================
   GENERATE TSP001
========================================= */

async function getNextRoll(){

    const snap =
    await getDocs(
        collection(
            db,
            "subscriptionStudents"
        )
    );


    let highest = 0;


    snap.forEach(function(docSnap){

        const data =
        docSnap.data();

        const currentRoll =
        String(data.roll || "");


        const match =
        currentRoll.match(
            /^TSP(\d+)$/
        );


        if(match){

            const number =
            parseInt(
                match[1],
                10
            );


            if(number > highest){

                highest =
                number;

            }

        }

    });


    const nextNumber =
    highest + 1;


    return "TSP" +
    String(nextNumber)
    .padStart(3,"0");

}


/* =========================================
   REGISTRATION
========================================= */

registerBtn.addEventListener(
"click",
async function(){

    const name =
    nameBox.value.trim();

    const studentClass =
    classBox.value;

    const mobile =
    mobileBox.value.trim();

    const father =
    fatherBox.value.trim();


    /* VALIDATION */

    if(!name){

        showMessage(
            "Student Name भरें।",
            "error"
        );

        return;
    }


    if(!studentClass){

        showMessage(
            "Class select करें।",
            "error"
        );

        return;
    }


    if(!/^[0-9]{10}$/.test(mobile)){

        showMessage(
            "सही 10 digit Mobile Number डालें।",
            "error"
        );

        return;
    }


    if(!father){

        showMessage(
            "Father / Guardian Name भरें।",
            "error"
        );

        return;
    }


    registerBtn.disabled =
    true;

    registerBtn.textContent =
    "REGISTERING...";


    try{


        /* CHECK MOBILE */

        const mobileQuery =
        query(
            collection(
                db,
                "subscriptionStudents"
            ),

            where(
                "mobile",
                "==",
                mobile
            )
        );


        const mobileSnap =
        await getDocs(
            mobileQuery
        );


        if(!mobileSnap.empty){

            showMessage(
                "इस Mobile Number से पहले ही Registration हो चुका है।",
                "error"
            );

            registerBtn.disabled =
            false;

            registerBtn.textContent =
            "REGISTER NOW";

            return;

        }


        /* GENERATE ROLL */

        const roll =
        await getNextRoll();


        /* SAVE STUDENT */

        await addDoc(

            collection(
                db,
                "subscriptionStudents"
            ),

            {

                roll:roll,

                name:name,

                className:
                studentClass,

                mobile:mobile,

                fatherName:
                father,

                status:
                "pending",

                enabled:
                false,

                accessType:
                "none",

                subscriptionPlan:
                "",

                subscriptionExpiry:
                null,

                createdAt:
                serverTimestamp()

            }

        );


        /* SUCCESS */

        rollBox.textContent =
        roll;


        result.style.display =
        "block";


        showMessage(

            "Registration successful! Admin approval pending.",

            "success"

        );


        registerBtn.style.display =
        "none";


        nameBox.disabled =
        true;

        classBox.disabled =
        true;

        mobileBox.disabled =
        true;

        fatherBox.disabled =
        true;


    }
    catch(error){

        console.error(error);


        showMessage(

            "Registration failed: " +
            error.message,

            "error"

        );


        registerBtn.disabled =
        false;


        registerBtn.textContent =
        "REGISTER NOW";

    }

});

</script>

</body>
  </html>
