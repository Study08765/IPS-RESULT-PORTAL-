<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#000000">

<title>
THE STUDY POINT | CBT RESULT
</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    min-height:100%;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 10% 5%,
        rgba(37,99,235,.12),
        transparent 25%
    ),
    radial-gradient(
        circle at 90% 30%,
        rgba(124,58,237,.07),
        transparent 25%
    ),
    linear-gradient(
        180deg,
        #edf6ff 0%,
        #f8fbff 55%,
        #edf5ff 100%
    );

    color:#172554;

    overflow-x:hidden;
}


/* =====================================================
   MAIN PAGE
===================================================== */

.page{

    width:100%;

    max-width:1050px;

    margin:auto;

    padding:10px;
}


/* =====================================================
   HERO IMAGE
===================================================== */

.hero{

    position:relative;

    width:100%;

    height:46vh;

    min-height:285px;

    max-height:540px;

    overflow:hidden;

    border-radius:25px;

    background:#eaf3ff;

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        0 22px 50px
        rgba(0,61,145,.22);
}

.hero img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    object-position:center center;
}


/* =====================================================
   TRICOLOR BRAND CARD
===================================================== */

.brand-card{

    position:relative;

    width:100%;

    min-height:92px;

    margin-top:12px;

    padding:17px 12px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.95);

    background:
        linear-gradient(
            to bottom,
            #ff9933 0%,
            #ff9933 31%,
            #ffffff 31%,
            #ffffff 69%,
            #138808 69%,
            #138808 100%
        );

    box-shadow:
        0 13px 30px
        rgba(15,23,42,.12);
}


/*
   Soft white overlay in centre
   ताकि text बहुत साफ दिखाई दे
*/

.brand-card::before{

    content:"";

    position:absolute;

    left:0;

    right:0;

    top:31%;

    height:38%;

    background:
        rgba(255,255,255,.94);

    pointer-events:none;
}


/*
   Golden top highlight
*/

.brand-card::after{

    content:"";

    position:absolute;

    top:0;

    left:50%;

    transform:translateX(-50%);

    width:130px;

    height:3px;

    border-radius:0 0 10px 10px;

    background:#fbbf24;
}


.brand-title{

    position:relative;

    z-index:2;

    color:#063b86;

    font-size:
        clamp(21px,5vw,30px);

    line-height:1.1;

    font-weight:800;

    letter-spacing:1.5px;

    text-shadow:
        0 1px 2px
        rgba(255,255,255,.8);
}

.brand-tagline{

    position:relative;

    z-index:2;

    margin-top:5px;

    color:#475569;

    font-size:10px;

    font-weight:700;

    letter-spacing:1.2px;
}


/* =====================================================
   SEARCH SECTION
===================================================== */

.search-section{

    width:100%;

    display:flex;

    justify-content:center;

    margin-top:14px;
}


.search-card{

    position:relative;

    width:100%;

    max-width:850px;

    padding:
        24px
        26px
        27px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f5f9ff
        );

    border-radius:23px;

    border:1px solid #dce8f5;

    box-shadow:
        0 18px 40px
        rgba(15,23,42,.10);

    text-align:center;

    overflow:hidden;
}


.search-card::before{

    content:"";

    position:absolute;

    width:160px;

    height:160px;

    right:-90px;

    top:-90px;

    border-radius:50%;

    background:
        rgba(37,99,235,.05);
}


.search-card::after{

    content:"";

    position:absolute;

    width:100px;

    height:100px;

    left:-60px;

    bottom:-60px;

    border-radius:50%;

    background:
        rgba(124,58,237,.04);
}


/* =====================================================
   SEARCH TITLE
===================================================== */

.search-badge{

    position:relative;

    z-index:2;

    display:inline-block;

    padding:6px 15px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );

    color:#1450a3;

    border:1px solid #cfe0f7;

    font-size:9px;

    font-weight:800;

    letter-spacing:1px;
}


.search-card h2{

    position:relative;

    z-index:2;

    margin-top:9px;

    color:#123b83;

    font-size:
        clamp(22px,4vw,29px);

    font-weight:800;
}


.search-subtitle{

    position:relative;

    z-index:2;

    margin-top:5px;

    margin-bottom:19px;

    color:#64748b;

    font-size:10px;

    font-weight:500;
}


/* =====================================================
   INPUT
===================================================== */

.input-wrap{

    position:relative;

    z-index:2;

    width:100%;
}


.input-icon{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    pointer-events:none;
}


#rollInput{

    width:100%;

    height:57px;

    padding:
        0
        18px
        0
        50px;

    border:
        1.5px solid
        #d7e2ef;

    border-radius:15px;

    outline:none;

    background:#fff;

    color:#172554;

    font-size:15px;

    font-weight:600;

    box-shadow:

        inset
        0 2px 8px
        rgba(15,23,42,.035),

        0 5px 15px
        rgba(15,23,42,.035);

    transition:.25s;
}


#rollInput::placeholder{

    color:#94a3b8;

    font-weight:500;
}


#rollInput:focus{

    border-color:#1677e8;

    box-shadow:

        0 0 0 4px
        rgba(37,99,235,.08),

        0 10px 25px
        rgba(37,99,235,.10);
}


/* =====================================================
   3D SEARCH BUTTON
===================================================== */

.search-btn{

    position:relative;

    z-index:2;

    width:100%;

    height:57px;

    margin-top:15px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    color:#fff;

    font-size:14px;

    font-weight:800;

    letter-spacing:.8px;

    background:
        linear-gradient(
            145deg,
            #31a2ff 0%,
            #087cf0 38%,
            #0646b5 72%,
            #04357f 100%
        );

    box-shadow:

        0 6px 0 #032f75,

        0 15px 30px
        rgba(0,70,180,.30),

        inset
        0 1px 2px
        rgba(255,255,255,.5);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


.search-btn:hover{

    transform:translateY(-3px);

    box-shadow:

        0 9px 0 #032f75,

        0 20px 35px
        rgba(0,70,180,.36),

        inset
        0 1px 2px
        rgba(255,255,255,.5);
}


.search-btn:active{

    transform:translateY(5px);

    box-shadow:

        0 2px 0 #032f75,

        0 7px 14px
        rgba(0,70,180,.22);
}


.search-btn:disabled{

    opacity:.7;

    cursor:not-allowed;

    transform:none;
}


/* =====================================================
   BLACK DEVELOPER FOOTER
===================================================== */

.footer{

    position:relative;

    width:100%;

    margin-top:18px;

    padding:
        23px
        15px
        21px;

    text-align:center;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #050505,
            #111111 55%,
            #000000
        );

    border-top:
        3px solid #fbbf24;

    border-radius:
        20px
        20px
        0
        0;

    box-shadow:
        0 -8px 25px
        rgba(0,0,0,.12);

    overflow:hidden;
}


.footer::before{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    left:-70px;

    bottom:-70px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);
}


.footer::after{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    right:-70px;

    top:-70px;

    border-radius:50%;

    background:
        rgba(255,215,0,.025);
}


.footer-brand{

    position:relative;

    z-index:2;

    color:#fff;

    font-size:18px;

    font-weight:800;

    letter-spacing:1.3px;
}


.footer-developer{

    position:relative;

    z-index:2;

    margin-top:7px;

    color:#d1d5db;

    font-size:10px;

    font-weight:500;

    letter-spacing:.5px;
}


.footer-name{

    position:relative;

    z-index:2;

    margin-top:4px;

    color:#fbbf24;

    font-size:16px;

    font-weight:800;

    letter-spacing:1px;

    text-shadow:
        0 2px 7px
        rgba(251,191,36,.15);
}


.footer-copy{

    position:relative;

    z-index:2;

    margin-top:8px;

    color:#9ca3af;

    font-size:8px;

    font-weight:500;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page{
        padding:8px;
    }


    .hero{

        height:45vh;

        min-height:270px;

        max-height:none;

        border-radius:21px;
    }


    .brand-card{

        min-height:90px;

        margin-top:10px;

        padding:16px 9px;

        border-radius:18px;
    }


    .brand-title{
        font-size:20px;
    }


    .brand-tagline{

        margin-top:4px;

        font-size:9px;

        letter-spacing:1px;
    }


    .search-section{

        margin-top:12px;
    }


    .search-card{

        padding:
            21px
            14px
            24px;

        border-radius:20px;
    }


    .search-card h2{
        font-size:21px;
    }


    .search-subtitle{

        font-size:9px;

        margin-bottom:17px;
    }


    #rollInput,
    .search-btn{

        height:55px;
    }


    .search-btn{

        font-size:13px;
    }


    .footer{

        margin-top:16px;

        padding:
            21px
            12px
            19px;

        border-radius:
            18px
            18px
            0
            0;
    }


    .footer-brand{
        font-size:17px;
    }


    .footer-developer{
        font-size:9px;
    }


    .footer-name{
        font-size:15px;
    }


    .footer-copy{
        font-size:7px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:350px){

    .hero{
        min-height:245px;
    }


    .brand-title{
        font-size:18px;
    }


    .search-card h2{
        font-size:19px;
    }


    .footer-name{
        font-size:14px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     PREMIUM VILLAGE IMAGE
===================================================== -->

<section class="hero">

    <img
        src="result-hero.jpg"
        alt="THE STUDY POINT">

</section>


<!-- =====================================================
     TRICOLOR BRAND TABLE
===================================================== -->

<section class="brand-card">

    <div class="brand-title">
        THE STUDY POINT
    </div>

    <div class="brand-tagline">
        Dream • Learn • Achieve
    </div>

</section>


<!-- =====================================================
     RESULT SEARCH
===================================================== -->

<section class="search-section">

    <div class="search-card">


        <div class="search-badge">
            RESULT SEARCH
        </div>


        <h2>
            🔍 Check Your Result
        </h2>


        <div class="search-subtitle">
            Enter your CBT Roll Number to view your result
        </div>


        <div class="input-wrap">

            <span class="input-icon">
                🎫
            </span>


            <input
                type="text"
                id="rollInput"
                placeholder="Enter Roll Number"
                autocomplete="off">

        </div>


        <button
            class="search-btn"
            id="searchBtn"
            onclick="searchResult()">

            🔎 &nbsp; SEARCH RESULT

        </button>


    </div>

</section>


<!-- =====================================================
     DEVELOPER FOOTER
===================================================== -->

<footer class="footer">


    <div class="footer-brand">
        THE STUDY POINT
    </div>


    <div class="footer-developer">
        Developed &amp; Designed by
    </div>


    <div class="footer-name">
        A.K. SINGH CHANDEL
    </div>


    <div class="footer-copy">
        © 2026 • All Rights Reserved
    </div>


</footer>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SEARCH RESULT
===================================================== */

window.searchResult = async function(){


    const input =
        document.getElementById("rollInput");


    const button =
        document.getElementById("searchBtn");


    const enteredRoll =
        input.value.trim();


    /* ================================================
       EMPTY CHECK
    ================================================ */

    if(!enteredRoll){

        alert(
            "Please enter Roll Number"
        );

        input.focus();

        return;
    }


    /* ================================================
       LOADING
    ================================================ */

    button.disabled = true;

    button.innerHTML =
        "⏳ &nbsp; SEARCHING RESULT...";


    try{


        /* ============================================
           LOAD CBT RESULTS
        ============================================ */

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "cbtResults"
                )
            );


        let found = false;

        let foundRoll = "";


        /* ============================================
           NORMALIZE ENTERED ROLL
        ============================================ */

        const normalizedEntered =
            String(enteredRoll)
                .trim()
                .replace(/^0+/,"")
                || "0";


        /* ============================================
           SEARCH
        ============================================ */

        for(
            const d of snapshot.docs
        ){

            const result =
                d.data();


            const savedRoll =
                String(
                    result.studentRoll ?? ""
                )
                .trim()
                .replace(/^0+/,"")
                || "0";


            if(
                savedRoll ===
                normalizedEntered
            ){

                found = true;

                foundRoll =
                    result.studentRoll;

                break;
            }

        }


        /* ============================================
           RESULT FOUND
        ============================================ */

        if(found){

            window.location.href =
                "result-view.html?roll="
                +
                encodeURIComponent(
                    foundRoll
                );

            return;
        }


        /* ============================================
           RESULT NOT FOUND
        ============================================ */

        alert(
            "❌ Result Not Found"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Unable to load result. Please check your internet connection."
        );

    }
    finally{

        button.disabled = false;

        button.innerHTML =
            "🔎 &nbsp; SEARCH RESULT";

    }

};


/* =====================================================
   ENTER KEY SEARCH
===================================================== */

document
    .getElementById("rollInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                window.searchResult();

            }

        }
    );

</script>


</body>

  </html>
