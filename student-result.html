document.getElementById("searchBtn");

const enteredRoll =
input.value.trim();


if(!enteredRoll){

alert(
"Please enter Roll Number"
);

input.focus();

return;

}


button.disabled=true;

button.innerHTML=
"⏳ &nbsp; SEARCHING RESULT...";


try{

const snapshot =
await getDocs(
collection(
db,
"cbtResults"
)
);


let found=false;

let foundRoll="";


const normalizedEntered =
String(enteredRoll)
.trim()
.replace(/^0+/,"")
|| "0";


for(
const d of snapshot.docs
){

const result =
d.data();


const savedRoll =
String(
result.studentRoll ?? ""
)
.trim()
.replace(/^0+/,"")
|| "0";


if(
savedRoll ===
normalizedEntered
){

found=true;

foundRoll =
result.studentRoll;

break;

}

}


if(found){

window.location.href=
"result-view.html?roll="
+
encodeURIComponent(
foundRoll
);

return;

}


alert(
"❌ Result Not Found"
);


}
catch(error){

console.error(error);

alert(
"Unable to load result. Please check your internet connection."
);

}
finally{

button.disabled=false;

button.innerHTML=
"🔎 &nbsp; SEARCH RESULT";

}

};


/* =====================================================
CHECK ANSWER KEY STATUS
===================================================== */

async function checkAnswerKeyStatus(){

const button =
document.getElementById(
"answerKeyBtn"
);

try{

const snapshot =
await getDocs(
collection(
db,
"cbtTests"
)
);


const released =
snapshot.docs.some(
doc => {

const data =
doc.data();

return data.answerKeyPublished === true;

}
);


if(released){

button.classList.add(
"released"
);

}
else{

button.classList.remove(
"released"
);

}

}
catch(error){

console.error(
"Answer Key status error:",
error
);

}

}

/* =====================================================
SHOW COMMON ANSWER KEY
===================================================== */

async function showCommonAnswerKey(test){

const content =
document.getElementById(
"answerModalContent"
);

const title =
document.getElementById(
"answerModalTitle"
);

const subtitle =
document.getElementById(
"answerModalSubtitle"
);


title.textContent=
"📘 "+
(test.testName ||
"Answer Key");


subtitle.textContent=
"Official Answer Key • Correct answers marked in green";


content.innerHTML=`

<button
class="key-back"
onclick="openAnswerKeys()">

← Back to Answer Keys

</button>


<div style="
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
padding:12px 14px;
border-radius:12px;
margin-bottom:15px;
font-size:11px;
font-weight:600;
">

🟢 Correct answer is marked with a Green Tick.

</div>


<div style="
text-align:center;
padding:25px;
color:#64748b;
">

⏳ Loading questions...

</div>

`;


try{

const questionsQuery =
query(
collection(
db,
"cbtQuestions"
),
where(
"testId",
"==",
test.id
)
);


const snapshot =
await getDocs(
questionsQuery
);


let questions=[];


snapshot.forEach(d=>{

questions.push({

id:d.id,
...d.data()

});

});


questions.sort(
(a,b)=>{

const x =
a.createdAt?.seconds || 0;

const y =
b.createdAt?.seconds || 0;

return x-y;

}
);


if(
questions.length===0
){

content.innerHTML=`

<button
class="key-back"
onclick="openAnswerKeys()">

← Back to Answer Keys

</button>


<div style="
text-align:center;
padding:35px;
color:#64748b;
">

No questions found for this test.

</div>

`;

return;

}


content.innerHTML=`

<button
class="key-back"
onclick="openAnswerKeys()">

← Back to Answer Keys

</button>


<div style="
background:#ecfdf3;
border:1px solid #bbf7d0;
color:#166534;
padding:12px 14px;
border-radius:12px;
margin-bottom:15px;
font-size:11px;
font-weight:600;
">

🟢 Correct answers are marked with a Green Tick.

</div>

`;


questions.forEach(
(q,index)=>{

const correctAnswer =
String(
q.answer ?? ""
)
.trim()
.toUpperCase();


const options=[

{
letter:"A",
text:q.optionA ?? ""
},

{
letter:"B",
text:q.optionB ?? ""
},

{
letter:"C",
text:q.optionC ?? ""
},

{
letter:"D",
text:q.optionD ?? ""
}

];


const questionDiv =
document.createElement(
"div"
);

questionDiv.className=
"key-question";


let optionsHTML="";


options.forEach(
option=>{

const isCorrect =
option.letter ===
correctAnswer;


optionsHTML += `

<div class="
key-option
${isCorrect ? "correct" : ""}
">


<div class="key-option-letter">

${option.letter}

</div>


<div style="
flex:1;
">

${escapeHTML(
String(option.text)
)}

</div>


${
isCorrect
?
`

<div class="big-green-tick">

✓

</div>

`
:
""
}

</div>

`;

});


questionDiv.innerHTML=`

<div class="key-question-title">

<div class="key-number">

Q${index+1}

</div>


<div>

${escapeHTML(
String(
q.question ?? ""
)
)}

</div>

</div>


${optionsHTML}

`;


content.appendChild(
questionDiv
);

});

}
catch(error){

console.error(error);


content.innerHTML=`

<button
class="key-back"
onclick="openAnswerKeys()">

← Back to Answer Keys

</button>


<div style="
text-align:center;
padding:35px;
color:#dc2626;
">

❌ Unable to load questions.

</div>

`;

}

}


/* =====================================================
CLOSE MODAL
===================================================== */

window.closeAnswerModal =
function(){

document
.getElementById(
"answerModal"
)
.classList.remove(
"show"
);

};


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
CLICK OUTSIDE MODAL
===================================================== */

document
.getElementById(
"answerModal"
)
.addEventListener(
"click",
function(event){

if(
event.target ===
this
){

closeAnswerModal();

}

}
);


/* =====================================================
ENTER KEY
===================================================== */

document
.getElementById(
"rollInput"
)
.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter"
){

window.searchResult();

}

}
);


/* =====================================================
INITIAL ANSWER KEY STATUS
===================================================== */

checkAnswerKeyStatus();


</script>
