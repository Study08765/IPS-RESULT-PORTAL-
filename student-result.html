<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>THE STUDY POINT | CBT RESULT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    min-height:100%;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 10% 5%,
        rgba(37,99,235,.13),
        transparent 25%
    ),
    radial-gradient(
        circle at 90% 30%,
        rgba(124,58,237,.07),
        transparent 25%
    ),
    linear-gradient(
        180deg,
        #edf6ff 0%,
        #f8fbff 50%,
        #edf5ff 100%
    );

    color:#172554;

    overflow-x:hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page{

    width:100%;

    max-width:1050px;

    margin:auto;

    padding:10px;

    min-height:100vh;

    display:flex;

    flex-direction:column;
}


/* =====================================================
   HERO IMAGE
===================================================== */

.hero{

    position:relative;

    width:100%;

    height:44vh;

    min-height:280px;

    max-height:540px;

    overflow:hidden;

    border-radius:27px;

    background:#eaf3ff;

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        0 24px 52px
        rgba(0,61,145,.23);

    flex-shrink:0;
}

.hero img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    object-position:center center;
}


/* =====================================================
   LARGE TRICOLOR BRAND TABLE
===================================================== */

.brand-card{

    position:relative;

    width:100%;

    height:150px;

    margin-top:14px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

    border-radius:23px;

    border:2px solid rgba(255,255,255,.95);

    background:

        linear-gradient(
            to bottom,

            #ff9933 0%,
            #ff9933 30%,

            #ffffff 30%,
            #ffffff 70%,

            #138808 70%,
            #138808 100%
        );

    box-shadow:

        0 17px 38px
        rgba(15,23,42,.15),

        inset
        0 1px 0
        rgba(255,255,255,.8);

    flex-shrink:0;
}


/* =====================================================
   WHITE CENTER FOR TEXT
===================================================== */

.brand-card::before{

    content:"";

    position:absolute;

    left:0;

    right:0;

    top:30%;

    height:40%;

    background:
        rgba(255,255,255,.97);

    pointer-events:none;
}


/* =====================================================
   GOLDEN TOP LINE
===================================================== */

.brand-card::after{

    content:"";

    position:absolute;

    top:0;

    left:50%;

    transform:translateX(-50%);

    width:180px;

    height:5px;

    border-radius:
        0 0 15px 15px;

    background:#fbbf24;

    box-shadow:
        0 2px 7px
        rgba(251,191,36,.4);
}


/* =====================================================
   THE STUDY POINT
===================================================== */

.brand-title{

    position:relative;

    z-index:2;

    color:#063b86;

    font-size:
        clamp(32px,7vw,48px);

    line-height:1;

    font-weight:900;

    letter-spacing:2.5px;

    text-transform:uppercase;

    text-shadow:
        0 2px 3px
        rgba(0,0,0,.12),

        0 0 10px
        rgba(255,255,255,.9);
}


/* =====================================================
   TAGLINE
===================================================== */

.brand-tagline{

    position:relative;

    z-index:2;

    margin-top:9px;

    color:#475569;

    font-size:12px;

    font-weight:700;

    letter-spacing:1.7px;
}


/* =====================================================
   SEARCH SECTION
===================================================== */

.search-section{

    width:100%;

    display:flex;

    justify-content:center;

    margin-top:18px;
}


/* =====================================================
   SEARCH CARD
===================================================== */

.search-card{

    position:relative;

    width:100%;

    max-width:850px;

    padding:
        30px
        28px
        33px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f5f9ff
        );

    border-radius:26px;

    border:1px solid #dce8f5;

    box-shadow:
        0 21px 47px
        rgba(15,23,42,.11);

    text-align:center;

    overflow:hidden;
}


.search-card::before{

    content:"";

    position:absolute;

    width:190px;

    height:190px;

    right:-105px;

    top:-105px;

    border-radius:50%;

    background:
        rgba(37,99,235,.055);
}


.search-card::after{

    content:"";

    position:absolute;

    width:125px;

    height:125px;

    left:-72px;

    bottom:-72px;

    border-radius:50%;

    background:
        rgba(124,58,237,.045);
}


/* =====================================================
   SEARCH HEADER
===================================================== */

.search-badge{

    position:relative;

    z-index:2;

    display:inline-block;

    padding:7px 18px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );

    color:#1450a3;

    border:1px solid #cfe0f7;

    font-size:9px;

    font-weight:800;

    letter-spacing:1.2px;
}


.search-card h2{

    position:relative;

    z-index:2;

    margin-top:11px;

    color:#123b83;

    font-size:
        clamp(23px,4vw,31px);

    font-weight:800;
}


.search-subtitle{

    position:relative;

    z-index:2;

    margin-top:6px;

    margin-bottom:23px;

    color:#64748b;

    font-size:10px;

    font-weight:500;
}


/* =====================================================
   INPUT
===================================================== */

.input-wrap{

    position:relative;

    z-index:2;

    width:100%;
}


.input-icon{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    pointer-events:none;
}


#rollInput{

    width:100%;

    height:61px;

    padding:
        0
        18px
        0
        50px;

    border:
        1.5px solid
        #d7e2ef;

    border-radius:16px;

    outline:none;

    background:#fff;

    color:#172554;

    font-size:15px;

    font-weight:600;

    box-shadow:

        inset
        0 2px 8px
        rgba(15,23,42,.035),

        0 5px 15px
        rgba(15,23,42,.035);

    transition:.25s;
}


#rollInput::placeholder{

    color:#94a3b8;

    font-weight:500;
}


#rollInput:focus{

    border-color:#1677e8;

    box-shadow:

        0 0 0 4px
        rgba(37,99,235,.08),

        0 10px 25px
        rgba(37,99,235,.10);
}


/* =====================================================
   3D SEARCH BUTTON
===================================================== */

.search-btn{

    position:relative;

    z-index:2;

    width:100%;

    height:61px;

    margin-top:18px;

    border:none;

    border-radius:16px;

    cursor:pointer;

    color:#fff;

    font-size:14px;

    font-weight:800;

    letter-spacing:1px;

    background:
        linear-gradient(
            145deg,
            #31a2ff 0%,
            #087cf0 38%,
            #0646b5 72%,
            #04357f 100%
        );

    box-shadow:

        0 7px 0 #032f75,

        0 17px 34px
        rgba(0,70,180,.30),

        inset
        0 1px 2px
        rgba(255,255,255,.5);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


.search-btn:hover{

    transform:translateY(-3px);

    box-shadow:

        0 10px 0 #032f75,

        0 22px 40px
        rgba(0,70,180,.36),

        inset
        0 1px 2px
        rgba(255,255,255,.5);
}


.search-btn:active{

    transform:translateY(5px);

    box-shadow:

        0 2px 0 #032f75,

        0 7px 14px
        rgba(0,70,180,.22);
}


.search-btn:disabled{

    opacity:.7;

    cursor:not-allowed;

    transform:none;
}


/* =====================================================
   BOTTOM SPACE
===================================================== */

.bottom-space{

    flex:1;

    min-height:85px;
}


/* =====================================================
   BLACK FOOTER
===================================================== */

.footer{

    position:relative;

    width:100%;

    margin-top:25px;

    padding:
        25px
        15px
        22px;

    text-align:center;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #050505,
            #111111 55%,
            #000000
        );

    border-top:
        3px solid #fbbf24;

    border-radius:
        22px
        22px
        0
        0;

    box-shadow:
        0 -8px 28px
        rgba(0,0,0,.13);

    overflow:hidden;

    flex-shrink:0;
}


.footer::before{

    content:"";

    position:absolute;

    width:130px;

    height:130px;

    left:-75px;

    bottom:-75px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);
}


.footer::after{

    content:"";

    position:absolute;

    width:130px;

    height:130px;

    right:-75px;

    top:-75px;

    border-radius:50%;

    background:
        rgba(255,215,0,.025);
}


.footer-brand{

    position:relative;

    z-index:2;

    color:#fff;

    font-size:18px;

    font-weight:800;

    letter-spacing:1.4px;
}


.footer-developer{

    position:relative;

    z-index:2;

    margin-top:8px;

    color:#d1d5db;

    font-size:10px;

    font-weight:500;

    letter-spacing:.5px;
}


.footer-name{

    position:relative;

    z-index:2;

    margin-top:5px;

    color:#fbbf24;

    font-size:16px;

    font-weight:800;

    letter-spacing:1px;

    text-shadow:
        0 2px 8px
        rgba(251,191,36,.15);
}


.footer-copy{

    position:relative;

    z-index:2;

    margin-top:9px;

    color:#9ca3af;

    font-size:8px;

    font-weight:500;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page{
        padding:8px;
    }


    .hero{

        height:43vh;

        min-height:270px;

        max-height:none;

        border-radius:21px;
    }


    .brand-card{

        height:150px;

        margin-top:11px;

        border-radius:20px;
    }


    .brand-title{

        font-size:30px;

        font-weight:900;

        letter-spacing:1.8px;
    }


    .brand-tagline{

        font-size:10px;

        margin-top:8px;

        letter-spacing:1.1px;
    }


    .search-section{

        margin-top:15px;
    }


    .search-card{

        padding:
            25px
            15px
            29px;

        border-radius:21px;
    }


    .search-card h2{

        font-size:22px;
    }


    .search-subtitle{

        font-size:9px;

        margin-bottom:19px;
    }


    #rollInput,
    .search-btn{

        height:57px;
    }


    .search-btn{

        font-size:13px;
    }


    .bottom-space{

        min-height:95px;
    }


    .footer{

        margin-top:0;

        padding:
            23px
            12px
            21px;

        border-radius:
            19px
            19px
            0
            0;
    }


    .footer-brand{

        font-size:17px;
    }


    .footer-developer{

        font-size:9px;
    }


    .footer-name{

        font-size:15px;
    }


    .footer-copy{

        font-size:7px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:350px){

    .hero{

        min-height:250px;
    }


    .brand-card{

        height:140px;
    }


    .brand-title{

        font-size:26px;

        letter-spacing:1.2px;
    }


    .brand-tagline{

        font-size:9px;
    }


    .search-card h2{

        font-size:20px;
    }


    .bottom-space{

        min-height:70px;
    }

}


/* =====================================================
   TALL MOBILE
===================================================== */

@media(min-height:750px) and (max-width:600px){

    .bottom-space{

        min-height:120px;
    }

}


@media(min-height:850px) and (max-width:600px){

    .bottom-space{

        min-height:150px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     VILLAGE IMAGE
===================================================== -->

<section class="hero">

    <img
        src="result-hero.jpg"
        alt="THE STUDY POINT">

</section>


<!-- =====================================================
     LARGE TRICOLOR BRAND TABLE
===================================================== -->

<section class="brand-card">

    <div class="brand-title">
        THE STUDY POINT
    </div>

    <div class="brand-tagline">
        Dream • Learn • Achieve
    </div>

</section>


<!-- =====================================================
     RESULT SEARCH
===================================================== -->

<section class="search-section">

    <div class="search-card">


        <div class="search-badge">
            RESULT SEARCH
        </div>


        <h2>
            🔍 Check Your Result
        </h2>


        <div class="search-subtitle">
            Enter your CBT Roll Number to view your result
        </div>


        <div class="input-wrap">

            <span class="input-icon">
                🎫
            </span>


            <input
                type="text"
                id="rollInput"
                placeholder="Enter Roll Number"
                autocomplete="off">

        </div>


        <button
            class="search-btn"
            id="searchBtn"
            onclick="searchResult()">

            🔎 &nbsp; SEARCH RESULT

        </button>


    </div>

</section>


<!-- =====================================================
     SPACE BEFORE FOOTER
===================================================== -->

<div class="bottom-space"></div>


<!-- =====================================================
     DEVELOPER FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-brand">
        THE STUDY POINT
    </div>

    <div class="footer-developer">
        Developed &amp; Designed by
    </div>

    <div class="footer-name">
        A.K. SINGH CHANDEL
    </div>

    <div class="footer-copy">
        © 2026 • All Rights Reserved
    </div>

</footer>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SEARCH RESULT
===================================================== */

window.searchResult = async function(){

    const input =
        document.getElementById("rollInput");

    const button =
        document.getElementById("searchBtn");

    const enteredRoll =
        input.value.trim();


    if(!enteredRoll){

        alert(
            "Please enter Roll Number"
        );

        input.focus();

        return;
    }


    button.disabled = true;

    button.innerHTML =
        "⏳ &nbsp; SEARCHING RESULT...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "cbtResults"
                )
            );


        let found = false;

        let foundRoll = "";


        const normalizedEntered =
            String(enteredRoll)
                .trim()
                .replace(/^0+/,"")
                || "0";


        for(
            const d of snapshot.docs
        ){

            const result =
                d.data();


            const savedRoll =
                String(
                    result.studentRoll ?? ""
                )
                .trim()
                .replace(/^0+/,"")
                || "0";


            if(
                savedRoll ===
                normalizedEntered
            ){

                found = true;

                foundRoll =
                    result.studentRoll;

                break;

            }

        }


        if(found){

            window.location.href =
                "result-view.html?roll="
                +
                encodeURIComponent(
                    foundRoll
                );

            return;
        }


        alert(
            "❌ Result Not Found"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Unable to load result. Please check your internet connection."
        );

    }
    finally{

        button.disabled = false;

        button.innerHTML =
            "🔎 &nbsp; SEARCH RESULT";

    }

};


/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById("rollInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                window.searchResult();

            }

        }
    );

</script>


</body>
  </html>
