<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03154d">

<title>THE STUDY POINT | CBT RESULT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    margin:0;
    padding:0;

    background:
    radial-gradient(
        circle at 10% 5%,
        rgba(37,99,235,.12),
        transparent 25%
    ),
    linear-gradient(
        180deg,
        #edf6ff 0%,
        #f8fbff 55%,
        #edf5ff 100%
    );

    color:#172554;
    overflow-x:hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100%;
    max-width:1050px;
    margin:0 auto;
    padding:8px;
}


/* =====================================================
   HERO IMAGE
===================================================== */

.hero{
    width:100%;

    height:43vh;
    min-height:265px;
    max-height:520px;

    overflow:hidden;

    border-radius:24px;

    background:#eaf3ff;

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        0 20px 45px
        rgba(0,61,145,.22);
}

.hero img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
    object-position:center center;
}


/* =====================================================
   THE STUDY POINT PREMIUM BLUE CARD
===================================================== */

.brand-card{

    position:relative;

    width:100%;

    height:145px;

    margin-top:12px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    overflow:hidden;

    border-radius:21px;

    background:
        linear-gradient(
            135deg,
            #03154d 0%,
            #0646b5 55%,
            #087cf0 100%
        );

    border:1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 15px 34px
        rgba(0,61,145,.24);
}


/* Decorative glow */

.brand-card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-90px;
    top:-105px;

    border-radius:50%;

    background:
        rgba(255,255,255,.07);
}


/* Golden line */

.brand-card::after{

    content:"";

    position:absolute;

    top:0;
    left:50%;

    transform:translateX(-50%);

    width:170px;
    height:4px;

    border-radius:
        0 0 12px 12px;

    background:#fbbf24;

    box-shadow:
        0 2px 8px
        rgba(251,191,36,.4);
}


/* =====================================================
   BRAND TITLE
===================================================== */

.brand-title{

    position:relative;
    z-index:2;

    color:#ffffff;

    font-size:
        clamp(30px,7vw,48px);

    line-height:1;

    font-weight:900;

    letter-spacing:2.5px;

    text-transform:uppercase;

    text-shadow:
        0 3px 10px
        rgba(0,0,0,.35);
}


.brand-tagline{

    position:relative;
    z-index:2;

    margin-top:9px;

    color:#fbbf24;

    font-size:12px;

    font-weight:700;

    letter-spacing:1.7px;
}


/* =====================================================
   SEARCH SECTION
===================================================== */

.search-section{

    width:100%;

    margin-top:14px;

    display:flex;
    justify-content:center;
}


.search-card{

    position:relative;

    width:100%;

    max-width:850px;

    padding:
        25px
        25px
        28px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f5f9ff
        );

    border-radius:23px;

    border:1px solid #dce8f5;

    box-shadow:
        0 17px 38px
        rgba(15,23,42,.10);

    text-align:center;

    overflow:hidden;
}


/* Decorative circles */

.search-card::before{

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:-95px;
    top:-95px;

    border-radius:50%;

    background:
        rgba(37,99,235,.05);
}


.search-card::after{

    content:"";

    position:absolute;

    width:110px;
    height:110px;

    left:-65px;
    bottom:-65px;

    border-radius:50%;

    background:
        rgba(124,58,237,.04);
}


/* =====================================================
   SEARCH TITLE
===================================================== */

.search-badge{

    position:relative;
    z-index:2;

    display:inline-block;

    padding:6px 16px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );

    color:#1450a3;

    border:1px solid #cfe0f7;

    font-size:9px;

    font-weight:800;

    letter-spacing:1.1px;
}


.search-card h2{

    position:relative;
    z-index:2;

    margin-top:9px;

    color:#123b83;

    font-size:
        clamp(22px,4vw,30px);

    font-weight:800;
}


.search-subtitle{

    position:relative;
    z-index:2;

    margin-top:5px;
    margin-bottom:19px;

    color:#64748b;

    font-size:10px;

    font-weight:500;
}


/* =====================================================
   INPUT
===================================================== */

.input-wrap{

    position:relative;
    z-index:2;

    width:100%;
}


.input-icon{

    position:absolute;

    left:17px;
    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    pointer-events:none;
}


#rollInput{

    width:100%;

    height:56px;

    padding:
        0
        17px
        0
        49px;

    border:
        1.5px solid
        #d7e2ef;

    border-radius:15px;

    outline:none;

    background:#fff;

    color:#172554;

    font-size:14px;

    font-weight:600;

    box-shadow:
        inset
        0 2px 8px
        rgba(15,23,42,.035),

        0 5px 15px
        rgba(15,23,42,.035);

    transition:.25s;
}


#rollInput::placeholder{
    color:#94a3b8;
    font-weight:500;
}


#rollInput:focus{

    border-color:#1677e8;

    box-shadow:
        0 0 0 4px
        rgba(37,99,235,.08),

        0 10px 25px
        rgba(37,99,235,.10);
}


/* =====================================================
   3D SEARCH BUTTON
===================================================== */

.search-btn{

    position:relative;
    z-index:2;

    width:100%;

    height:56px;

    margin-top:15px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    color:#fff;

    font-size:13px;

    font-weight:800;

    letter-spacing:1px;

    background:
        linear-gradient(
            145deg,
            #31a2ff 0%,
            #087cf0 38%,
            #0646b5 72%,
            #04357f 100%
        );

    box-shadow:

        0 6px 0 #032f75,

        0 14px 28px
        rgba(0,70,180,.30),

        inset
        0 1px 2px
        rgba(255,255,255,.5);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


.search-btn:hover{

    transform:translateY(-2px);

    box-shadow:

        0 8px 0 #032f75,

        0 19px 34px
        rgba(0,70,180,.35),

        inset
        0 1px 2px
        rgba(255,255,255,.5);
}


.search-btn:active{

    transform:translateY(4px);

    box-shadow:

        0 2px 0 #032f75,

        0 7px 14px
        rgba(0,70,180,.22);
}


.search-btn:disabled{

    opacity:.7;
    cursor:not-allowed;
    transform:none;
}


/* =====================================================
   FOOTER
   No flex / no bottom-space / no forced height
===================================================== */

.footer{

    width:100%;

    margin-top:18px;

    padding:
        14px
        8px;

    text-align:center;

    background:
        linear-gradient(
            135deg,
            #03154d,
            #0646b5
        );

    border-top:
        2px solid #fbbf24;

    border-radius:
        15px
        15px
        0
        0;

    color:#ffffff;

    font-size:10px;

    font-weight:500;

    white-space:nowrap;

    overflow:hidden;

    box-shadow:
        0 -6px 20px
        rgba(0,61,145,.12);
}


.footer-name{

    color:#fbbf24;

    font-weight:800;

    letter-spacing:.5px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page{
        padding:7px;
    }


    .hero{

        height:41vh;

        min-height:250px;

        max-height:none;

        border-radius:20px;
    }


    .brand-card{

        height:145px;

        margin-top:10px;

        border-radius:19px;
    }


    .brand-title{

        font-size:29px;

        font-weight:900;

        letter-spacing:1.5px;
    }


    .brand-tagline{

        margin-top:8px;

        font-size:9px;

        letter-spacing:1px;
    }


    .search-section{

        margin-top:12px;
    }


    .search-card{

        padding:
            22px
            14px
            25px;

        border-radius:20px;
    }


    .search-card h2{
        font-size:21px;
    }


    .search-subtitle{

        font-size:9px;

        margin-bottom:17px;
    }


    #rollInput,
    .search-btn{
        height:55px;
    }


    .search-btn{
        font-size:12px;
    }


    .footer{

        margin-top:16px;

        padding:
            13px
            4px;

        font-size:8px;

        border-radius:
            14px
            14px
            0
            0;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:350px){

    .hero{
        min-height:235px;
    }


    .brand-card{
        height:135px;
    }


    .brand-title{
        font-size:25px;
    }


    .brand-tagline{
        font-size:8px;
    }


    .search-card h2{
        font-size:19px;
    }


    .footer{
        font-size:7px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     IMAGE
===================================================== -->

<section class="hero">

    <img
        src="result-hero.jpg"
        alt="THE STUDY POINT">

</section>


<!-- =====================================================
     THE STUDY POINT
===================================================== -->

<section class="brand-card">

    <div class="brand-title">
        THE STUDY POINT
    </div>

    <div class="brand-tagline">
        Dream • Learn • Achieve
    </div>

</section>


<!-- =====================================================
     SEARCH RESULT
===================================================== -->

<section class="search-section">

    <div class="search-card">


        <div class="search-badge">
            RESULT SEARCH
        </div>


        <h2>
            🔍 Check Your Result
        </h2>


        <div class="search-subtitle">
            Enter your CBT Roll Number to view your result
        </div>


        <div class="input-wrap">

            <span class="input-icon">
                🎫
            </span>


            <input
                type="text"
                id="rollInput"
                placeholder="Enter Roll Number"
                autocomplete="off">

        </div>


        <button
            class="search-btn"
            id="searchBtn"
            onclick="searchResult()">

            🔎 &nbsp; SEARCH RESULT

        </button>


    </div>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    Developed &amp; Designed by

    <span class="footer-name">
        A.K. SINGH CHANDEL
    </span>

</footer>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   SEARCH RESULT
===================================================== */

window.searchResult = async function(){

    const input =
        document.getElementById("rollInput");

    const button =
        document.getElementById("searchBtn");

    const enteredRoll =
        input.value.trim();


    if(!enteredRoll){

        alert(
            "Please enter Roll Number"
        );

        input.focus();

        return;
    }


    button.disabled = true;

    button.innerHTML =
        "⏳ &nbsp; SEARCHING RESULT...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "cbtResults"
                )
            );


        let found = false;

        let foundRoll = "";


        const normalizedEntered =
            String(enteredRoll)
                .trim()
                .replace(/^0+/,"")
                || "0";


        for(
            const d of snapshot.docs
        ){

            const result =
                d.data();


            const savedRoll =
                String(
                    result.studentRoll ?? ""
                )
                .trim()
                .replace(/^0+/,"")
                || "0";


            if(
                savedRoll ===
                normalizedEntered
            ){

                found = true;

                foundRoll =
                    result.studentRoll;

                break;
            }

        }


        if(found){

            window.location.href =
                "result-view.html?roll="
                +
                encodeURIComponent(
                    foundRoll
                );

            return;
        }


        alert(
            "❌ Result Not Found"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Unable to load result. Please check your internet connection."
        );

    }
    finally{

        button.disabled = false;

        button.innerHTML =
            "🔎 &nbsp; SEARCH RESULT";

    }

};


/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById("rollInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                window.searchResult();

            }

        }
    );

</script>


</body>
  </html>
