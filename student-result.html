<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0646b5">

<title>THE STUDY POINT | CBT RESULT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;

    background:
    radial-gradient(
        circle at 10% 5%,
        rgba(37,99,235,.14),
        transparent 25%
    ),
    radial-gradient(
        circle at 90% 30%,
        rgba(124,58,237,.08),
        transparent 25%
    ),
    linear-gradient(
        180deg,
        #edf6ff 0%,
        #f8fbff 55%,
        #edf5ff 100%
    );

    color:#172554;

    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:1050px;

    margin:auto;

    padding:12px;
}


/* =====================================================
   HERO IMAGE
===================================================== */

.hero{
    position:relative;

    width:100%;

    height:48vh;

    min-height:310px;
    max-height:560px;

    overflow:hidden;

    border-radius:28px;

    background:#eaf3ff;

    box-shadow:
        0 25px 55px rgba(0,61,145,.25);

    border:1px solid rgba(255,255,255,.9);
}

.hero img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
    object-position:center center;
}


/* =====================================================
   IMAGE OVERLAY
===================================================== */

.hero-overlay{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:28px 18px 22px;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(3,25,75,.68)
        );

    color:#fff;
}

.hero-badge{

    display:inline-block;

    padding:6px 14px;

    border-radius:50px;

    background:rgba(255,255,255,.15);

    border:1px solid rgba(255,255,255,.45);

    backdrop-filter:blur(10px);

    font-size:9px;

    font-weight:800;

    letter-spacing:1.3px;
}

.hero-overlay h1{

    margin-top:8px;

    font-size:
        clamp(24px,5vw,43px);

    line-height:1.15;

    font-weight:800;

    letter-spacing:.5px;

    text-shadow:
        0 4px 14px rgba(0,0,0,.45);
}

.hero-overlay p{

    margin-top:5px;

    color:#e0ecff;

    font-size:10px;

    font-weight:600;

    letter-spacing:1.5px;
}


/* =====================================================
   SEARCH CARD
===================================================== */

.search-section{

    display:flex;

    justify-content:center;

    margin-top:18px;
}

.search-card{

    width:100%;

    max-width:850px;

    padding:
        28px
        28px
        30px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f5f9ff
        );

    border-radius:27px;

    border:1px solid #dce8f5;

    box-shadow:
        0 20px 45px rgba(15,23,42,.11);

    text-align:center;

    position:relative;

    overflow:hidden;
}

.search-card::before{

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:-95px;
    top:-95px;

    border-radius:50%;

    background:
        rgba(37,99,235,.06);
}

.search-card::after{

    content:"";

    position:absolute;

    width:110px;
    height:110px;

    left:-65px;
    bottom:-65px;

    border-radius:50%;

    background:
        rgba(124,58,237,.045);
}


/* =====================================================
   SEARCH HEADER
===================================================== */

.search-badge{

    position:relative;
    z-index:2;

    display:inline-block;

    padding:6px 15px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );

    color:#1450a3;

    border:1px solid #cfe0f7;

    font-size:9px;

    font-weight:800;

    letter-spacing:1px;
}

.search-card h2{

    position:relative;
    z-index:2;

    margin-top:10px;

    color:#123b83;

    font-size:
        clamp(22px,4vw,30px);

    font-weight:800;
}

.search-subtitle{

    position:relative;
    z-index:2;

    margin-top:5px;
    margin-bottom:22px;

    color:#64748b;

    font-size:10px;

    font-weight:500;
}


/* =====================================================
   INPUT
===================================================== */

.input-wrap{

    position:relative;

    z-index:2;

    width:100%;
}

.input-icon{

    position:absolute;

    left:18px;
    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    pointer-events:none;
}

#rollInput{

    width:100%;

    height:58px;

    padding:
        0
        18px
        0
        50px;

    border:
        1.5px solid
        #d7e2ef;

    border-radius:16px;

    outline:none;

    background:#fff;

    color:#172554;

    font-size:15px;

    font-weight:600;

    box-shadow:
        inset 0 2px 8px rgba(15,23,42,.035),
        0 5px 15px rgba(15,23,42,.035);

    transition:.25s;
}

#rollInput::placeholder{
    color:#94a3b8;
    font-weight:500;
}

#rollInput:focus{

    border-color:#1677e8;

    box-shadow:
        0 0 0 4px rgba(37,99,235,.08),
        0 10px 25px rgba(37,99,235,.10);
}


/* =====================================================
   3D SEARCH BUTTON
===================================================== */

.search-btn{

    position:relative;
    z-index:2;

    width:100%;

    height:58px;

    margin-top:15px;

    border:none;

    border-radius:16px;

    cursor:pointer;

    color:#fff;

    font-size:14px;

    font-weight:800;

    letter-spacing:.8px;

    background:
        linear-gradient(
            145deg,
            #31a2ff 0%,
            #087cf0 38%,
            #0646b5 72%,
            #04357f 100%
        );

    box-shadow:

        0 6px 0 #032f75,

        0 15px 30px
        rgba(0,70,180,.30),

        inset 0 1px 2px
        rgba(255,255,255,.5);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.search-btn:hover{

    transform:translateY(-3px);

    box-shadow:

        0 9px 0 #032f75,

        0 20px 35px
        rgba(0,70,180,.36),

        inset 0 1px 2px
        rgba(255,255,255,.5);
}

.search-btn:active{

    transform:translateY(5px);

    box-shadow:

        0 2px 0 #032f75,

        0 7px 14px
        rgba(0,70,180,.22);
}

.search-btn:disabled{

    opacity:.7;

    cursor:not-allowed;

    transform:none;
}


/* =====================================================
   BOTTOM BRAND
===================================================== */

.brand-line{

    margin:15px auto 0;

    text-align:center;

    color:#123b83;

    font-size:11px;

    font-weight:700;
}

.brand-line span{

    display:block;

    margin-top:3px;

    color:#94a3b8;

    font-size:8px;

    font-weight:500;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    padding:
        20px
        10px
        8px;

    text-align:center;

    color:#94a3b8;

    font-size:8px;
}

.footer strong{

    color:#123b83;

    font-size:10px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page{
        padding:9px;
    }

    .hero{

        height:48vh;

        min-height:300px;

        max-height:none;

        border-radius:23px;
    }

    .hero-overlay{

        padding:
            25px
            12px
            18px;
    }

    .hero-overlay h1{
        font-size:25px;
    }

    .hero-overlay p{
        font-size:8px;
        letter-spacing:1px;
    }

    .hero-badge{
        font-size:8px;
        padding:5px 11px;
    }

    .search-card{

        padding:
            23px
            15px
            25px;

        border-radius:22px;
    }

    .search-card h2{
        font-size:21px;
    }

    .search-subtitle{
        font-size:9px;
        margin-bottom:18px;
    }

    #rollInput,
    .search-btn{
        height:55px;
    }

}

</style>

</head>

<body>


<div class="page">


<!-- =====================================================
     PREMIUM IMAGE
===================================================== -->

<section class="hero">

    <img
        src="result-hero.jpg"
        alt="THE STUDY POINT CBT Result Portal">

    <div class="hero-overlay">

        <div class="hero-badge">
            THE STUDY POINT
        </div>

        <h1>
            CBT RESULT PORTAL
        </h1>

        <p>
            CHECK YOUR OFFICIAL TEST RESULT
        </p>

    </div>

</section>


<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-section">

    <div class="search-card">

        <div class="search-badge">
            RESULT SEARCH
        </div>

        <h2>
            🔍 Check Your Result
        </h2>

        <div class="search-subtitle">
            Enter your CBT Roll Number to view your result
        </div>


        <div class="input-wrap">

            <span class="input-icon">
                🎫
            </span>

            <input
                type="text"
                id="rollInput"
                placeholder="Enter Roll Number"
                autocomplete="off">

        </div>


        <button
            class="search-btn"
            id="searchBtn"
            onclick="searchResult()">

            🔎 &nbsp; SEARCH RESULT

        </button>

    </div>

</section>


<!-- =====================================================
     ONLY ONE BOTTOM LINE
===================================================== -->

<div class="brand-line">

    🏆 THE STUDY POINT

    <span>
        Official CBT Result Portal
    </span>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    © 2026
    <strong>
        The Study Point
    </strong>
    • All Rights Reserved

</footer>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


window.searchResult = async function(){

    const input =
        document.getElementById("rollInput");

    const button =
        document.getElementById("searchBtn");

    const enteredRoll =
        input.value.trim();


    /* =========================
       EMPTY CHECK
    ========================= */

    if(!enteredRoll){

        alert("Please enter Roll Number");

        input.focus();

        return;
    }


    /* =========================
       BUTTON LOADING
    ========================= */

    button.disabled = true;

    button.innerHTML =
        "⏳ &nbsp; SEARCHING RESULT...";


    try{

        const snapshot =
            await getDocs(
                collection(db,"cbtResults")
            );


        let found = false;

        let foundRoll = "";


        /* =========================
           NORMALIZE ROLL NUMBER

           023 = 23
           0023 = 23
        ========================= */

        const normalizedEntered =
            String(enteredRoll)
                .trim()
                .replace(/^0+/,"") || "0";


        for(const d of snapshot.docs){

            const result = d.data();


            const savedRoll =
                String(
                    result.studentRoll ?? ""
                )
                .trim()
                .replace(/^0+/,"") || "0";


            if(
                savedRoll ===
                normalizedEntered
            ){

                found = true;

                foundRoll =
                    result.studentRoll;

                break;
            }

        }


        /* =========================
           OPEN RESULT PAGE
        ========================= */

        if(found){

            window.location.href =
                "result-view.html?roll=" +
                encodeURIComponent(
                    foundRoll
                );

            return;
        }


        /* =========================
           NOT FOUND
        ========================= */

        alert(
            "❌ Result Not Found"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Unable to load result. Please check your internet connection."
        );

    }
    finally{

        button.disabled = false;

        button.innerHTML =
            "🔎 &nbsp; SEARCH RESULT";

    }

};


/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById("rollInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                window.searchResult();

            }

        }
    );

</script>

</body>
  </html>
