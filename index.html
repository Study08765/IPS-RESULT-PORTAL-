<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE STUDY POINT | CBT Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/* ===== PART 2 CSS ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(8,35,95,.75),rgba(8,35,95,.75)),
url("hero-bg.jpg");
background-size:cover;
background-position:center;
overflow:hidden;
}

.login-box{
width:95%;
max-width:420px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.25);
border-radius:25px;
padding:35px 30px;
box-shadow:0 15px 45px rgba(0,0,0,.35);
text-align:center;
}

.logo{
width:90px;
height:90px;
margin:auto;
background:#fff;
border-radius:50%;
padding:6px;
border:4px solid gold;
overflow:hidden;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
}

h1{
color:#fff;
font-size:30px;
font-weight:800;
margin-top:18px;
letter-spacing:1px;
}

h2{
color:#FFD700;
font-size:18px;
margin-top:5px;
}

.tag{
color:#fff;
font-size:14px;
margin-top:6px;
margin-bottom:30px;
}

.input-box{
position:relative;
margin-bottom:18px;
}

.input-box input{
width:100%;
padding:15px 48px;
border:none;
outline:none;
border-radius:12px;
font-size:16px;
background:#fff;
}

.input-box i{
position:absolute;
left:16px;
top:16px;
color:#0b3d91;
font-size:18px;
}

.toggle{
position:absolute;
right:16px;
top:16px;
cursor:pointer;
color:#555;
}

.login-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#FFD700,#ffb300);
font-size:17px;
font-weight:700;
cursor:pointer;
color:#0b3d91;
transition:.3s;
}

.login-btn:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(255,215,0,.45);
}

.footer{
margin-top:20px;
color:#fff;
font-size:13px;
}

</style>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0047AB">
</head>

<body>

<div class="login-box">

<div class="logo">
<img src="icon-512.png">
</div>

<h1>THE STUDY POINT</h1>

<h2>CBT EXAM ADMIN PANEL</h2>

<p class="tag">
Secure Administration Portal
</p>

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input
type="text"
id="username"
placeholder="Enter Username">
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter Password">

<span class="toggle">
<i class="fa-solid fa-eye" id="eye"></i>
</span>

</div>

<button class="login-btn">
LOGIN
</button>

<div class="footer">
Powered by THE STUDY POINT
</div>

  </div>
  <script>

// Show / Hide Password
const eye = document.getElementById("eye");
const password = document.getElementById("password");

eye.addEventListener("click", () => {

if(password.type==="password"){
password.type="text";
eye.classList.remove("fa-eye");
eye.classList.add("fa-eye-slash");
}else{
password.type="password";
eye.classList.remove("fa-eye-slash");
eye.classList.add("fa-eye");
}

});

// Login
document.querySelector(".login-btn").addEventListener("click", login);

function login(){

const username = document.getElementById("username").value.trim();
const pass = document.getElementById("password").value.trim();

if(username==="admin" && pass==="admin123"){

localStorage.setItem("adminLogin","true");

window.location.href="admin-dashboard.html";

}else{

alert("Invalid Username or Password");

}

}

// Enter Key Login
document.addEventListener("keypress",function(e){

if(e.key==="Enter"){
login();
}

});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log(err));
  });
}
</script>
<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  const btn = document.createElement("button");
  btn.innerHTML = "📲 Install TSPCBT";
  btn.id = "installBtn";

  btn.style.position = "fixed";
  btn.style.bottom = "20px";
  btn.style.left = "50%";
  btn.style.transform = "translateX(-50%)";
  btn.style.padding = "14px 24px";
  btn.style.background = "#0047AB";
  btn.style.color = "#fff";
  btn.style.border = "none";
  btn.style.borderRadius = "50px";
  btn.style.fontSize = "16px";
  btn.style.fontWeight = "700";
  btn.style.boxShadow = "0 10px 25px rgba(0,0,0,.3)";
  btn.style.zIndex = "9999";

  document.body.appendChild(btn);

  btn.addEventListener("click", async () => {
    btn.style.display = "none";
    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;

    if (outcome === "accepted") {
      console.log("TSPCBT Installed");
    }

    deferredPrompt = null;
  });
});
</script>
</body>
</html>
