<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import { db }
from "./firebase.js";

import {
    collection,
    getDocs,
    getDoc,
    doc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const studentName =
document.getElementById(
    "studentName"
);

const studentInfo =
document.getElementById(
    "studentInfo"
);

const lcdContent =
document.getElementById(
    "lcdContent"
);


/* =========================================================
   NORMALIZE ROLL
========================================================= */

function normalizeRoll(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    let roll =
    String(value)
    .trim()
    .toUpperCase();

    if(!roll){
        return "";
    }


    if(
        roll.startsWith("TSP")
    ){

        const number =
        roll
        .substring(3)
        .replace(
            /[^0-9]/g,
            ""
        );

        if(number){

            return "TSP" +
            String(
                parseInt(
                    number,
                    10
                )
            )
            .padStart(
                3,
                "0"
            );

        }

    }


    if(
        /^[0-9]+$/.test(roll)
    ){

        return "TSP" +
        String(
            parseInt(
                roll,
                10
            )
        )
        .padStart(
            3,
            "0"
        );

    }


    return roll;

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(c){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[c];

        }
    );

}


/* =========================================================
   GET EXACT LOGIN SESSION
========================================================= */

function getLoginSession(){

    const raw =
    localStorage.getItem(
        "tspStudentSession"
    );


    if(raw){

        try{

            const session =
            JSON.parse(raw);


            if(
                session &&
                session.roll
            ){

                return {

                    roll:
                    normalizeRoll(
                        session.roll
                    ),

                    name:
                    session.name || "",

                    className:
                    session.className || ""

                };

            }

        }
        catch(error){

            console.error(
                "Session error:",
                error
            );

        }

    }


    const keys = [

        "studentRoll",
        "studentLoginRoll",
        "student_roll",
        "studentRollNumber",
        "loginRoll",
        "loggedInRoll"

    ];


    for(
        const key of keys
    ){

        const value =
        localStorage.getItem(
            key
        );


        if(value){

            const roll =
            normalizeRoll(
                value
            );


            if(roll){

                return {

                    roll:roll,
                    name:"",
                    className:""

                };

            }

        }

    }


    return null;

}


/* =========================================================
   FIND EXACT STUDENT
========================================================= */

async function findStudent(
    roll
){

    const finalRoll =
    normalizeRoll(
        roll
    );


    if(!finalRoll){
        return null;
    }


    /* subscriptionStudents */

    const snap =
    await getDocs(
        collection(
            db,
            "subscriptionStudents"
        )
    );


    for(
        const d of snap.docs
    ){

        const x =
        d.data();


        const databaseRoll =
        normalizeRoll(
            x.roll
        );


        if(
            databaseRoll ===
            finalRoll
        ){

            return {

                id:d.id,

                ...x,

                roll:
                databaseRoll

            };

        }

    }


    /* students_v2 */

    try{

        const oldSnap =
        await getDocs(
            collection(
                db,
                "students_v2"
            )
        );


        for(
            const d of oldSnap.docs
        ){

            const x =
            d.data();


            const databaseRoll =
            normalizeRoll(

                x.Roll ||
                x.roll ||
                x.RollNumber ||
                x.rollNumber

            );


            if(
                databaseRoll ===
                finalRoll
            ){

                return {

                    id:d.id,

                    name:
                    x.Name ||
                    x.name ||
                    "Student",

                    roll:
                    databaseRoll,

                    className:
                    x.Class ||
                    x.className ||
                    x.class ||
                    "-",

                    mobile:
                    x.Mobile ||
                    x.mobile ||
                    "",

                    fatherName:
                    x.Father ||
                    x.fatherName ||
                    "",

                    status:
                    "approved",

                    enabled:
                    true,

                    source:
                    "students_v2"

                };

            }

        }

    }
    catch(error){

        console.error(
            "students_v2 error:",
            error
        );

    }


    return null;

}


/* =========================================================
   DISPLAY STUDENT
========================================================= */

function displayStudent(
    student,
    loginRoll
){

    const finalRoll =
    normalizeRoll(
        student.roll ||
        loginRoll
    );


    const name =
    student.name ||
    "STUDENT";


    const className =
    student.className ||
    student.Class ||
    "-";


    studentName.textContent =
    name;


    studentInfo.innerHTML =

    '<i class="fa-solid fa-id-card"></i> ' +

    'ROLL: ' +
    esc(finalRoll) +

    ' &nbsp; • &nbsp; CLASS: ' +

    esc(className);


    localStorage.setItem(
        "studentRoll",
        finalRoll
    );

    localStorage.setItem(
        "studentLoginRoll",
        finalRoll
    );


    const raw =
    localStorage.getItem(
        "tspStudentSession"
    );


    if(raw){

        try{

            const session =
            JSON.parse(raw);

            session.roll =
            finalRoll;

            session.name =
            name;

            session.className =
            className;


            localStorage.setItem(
                "tspStudentSession",
                JSON.stringify(
                    session
                )
            );

        }
        catch(error){

            console.error(
                error
            );

        }

    }

}


/* =========================================================
   LOAD EXAM
========================================================= */

async function loadExam(
    roll
){

    const finalRoll =
    normalizeRoll(
        roll
    );


    try{

        const examSnap =
        await getDocs(
            collection(
                db,
                "cbtTests"
            )
        );


        const now =
        new Date();


        const exams=[];


        examSnap.forEach(
        function(d){

            const x =
            d.data();


            const status =
            String(
                x.status || ""
            )
            .trim()
            .toUpperCase();


            if(
                status === "CLOSED"
            ){
                return;
            }


            const start =
            x.start
            ?
            new Date(x.start)
            :
            null;


            const end =
            x.end
            ?
            new Date(x.end)
            :
            null;


            if(
                !start ||
                !end ||
                isNaN(
                    start.getTime()
                ) ||
                isNaN(
                    end.getTime()
                )
            ){
                return;
            }


            if(
                now <= end
            ){

                exams.push({

                    id:d.id,

                    ...x,

                    startDate:start,

                    endDate:end

                });

            }

        });


        if(
            !exams.length
        ){

            showNoExam();

            return;

        }


        exams.sort(
        function(a,b){

            const aLive =
            now >= a.startDate &&
            now <= a.endDate;

            const bLive =
            now >= b.startDate &&
            now <= b.endDate;


            if(
                aLive &&
                !bLive
            ){
                return -1;
            }


            if(
                !aLive &&
                bLive
            ){
                return 1;
            }


            return (
                a.startDate -
                b.startDate
            );

        });


        const exam =
        exams[0];


        /* =================================================
           EXACT PIN
        ================================================= */

        const pinId =
        exam.id +
        "_" +
        finalRoll;


        let pin = "";


        try{

            const pinSnap =
            await getDoc(

                doc(
                    db,
                    "cbtExamPins",
                    pinId
                )

            );


            if(
                pinSnap.exists()
            ){

                const pinData =
                pinSnap.data();


                const pinRoll =
                normalizeRoll(
                    pinData.studentRoll
                );


                if(
                    pinRoll ===
                    finalRoll
                ){

                    pin =
                    String(
                        pinData.pin ||
                        ""
                    );

                }

            }

        }
        catch(error){

            console.error(
                "PIN error:",
                error
            );

        }


        const live =
        now >= exam.startDate &&
        now <= exam.endDate;


        lcdContent.innerHTML = `

            <div class="lcd-type">

                ${
                    live
                    ?
                    "🟢 CBT EXAM LIVE"
                    :
                    "🔔 UPCOMING CBT EXAM"
                }

            </div>


            <div class="lcd-heading">

                ${esc(
                    exam.testName ||
                    "CBT EXAMINATION"
                )}

            </div>


            <div class="lcd-message">

                📚
                ${esc(
                    exam.subject ||
                    "CBT TEST"
                )}

            </div>


            <div class="lcd-info">

                📅 ${formatDate(
                    exam.startDate
                )}

                &nbsp; | &nbsp;

                ⏰ ${formatTime(
                    exam.startDate
                )}

            </div>


            ${
                pin

                ?

                `
                <div class="pin-display">

                    🎟️ YOUR EXAM PIN:

                    <strong>
                        ${esc(pin)}
                    </strong>

                </div>
                `

                :

                `
                <div class="pin-display">

                    🔐 PIN NOT GENERATED

                </div>
                `

            }


            <div class="lcd-roll">

                ROLL NO: ${esc(finalRoll)}

            </div>

        `;

    }
    catch(error){

        console.error(
            "Exam load error:",
            error
        );


        lcdContent.innerHTML = `

            <div class="error-text">

                Exam information load नहीं हो पाई।

                <br>

                ${esc(
                    error.message
                )}

            </div>

        `;

    }

}

/* =========================================================
   DATE
========================================================= */

function formatDate(date){

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   TIME
========================================================= */

function formatTime(date){

    return date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    );

}


/* =========================================================
   LOGOUT
========================================================= */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
function(){

    const keys=[

        "studentRoll",
        "studentLoginRoll",
        "student_roll",
        "studentRollNumber",
        "loginRoll",
        "loggedInRoll",
        "tspStudentSession",
        "studentLoginData",
        "studentData",
        "loggedInStudent"

    ];


    keys.forEach(
    function(key){

        localStorage.removeItem(
            key
        );

    });


    window.location.href =
    "index.html";

});



/* =========================================================
   START
========================================================= */

async function startDashboard(){

    try{

        const session =
        getLoginSession();


        if(
            !session ||
            !session.roll
        ){

            studentName.textContent =
            "LOGIN REQUIRED";

            studentInfo.textContent =
            "Please login again.";

            lcdContent.innerHTML = `

                <div class="lcd-type">
                    🔐 STUDENT LOGIN
                </div>

                <div class="lcd-heading">
                    LOGIN REQUIRED
                </div>

                <div class="lcd-message">
                    कृपया Student Login से दोबारा login करें।
                </div>

            `;

            return;

        }


        const student =
        await findStudent(
            session.roll
        );


        if(!student){

            studentName.textContent =
            "STUDENT NOT FOUND";

            studentInfo.textContent =
            "ROLL: " +
            session.roll;

            lcdContent.innerHTML = `

                <div class="lcd-type">
                    ⚠️ STUDENT RECORD
                </div>

                <div class="lcd-heading">
                    STUDENT NOT FOUND
                </div>

                <div class="lcd-message">
                    Roll Number: ${esc(
                        session.roll
                    )}
                </div>

            `;

            return;

        }


        const status =
        String(
            student.status || ""
        )
        .trim()
        .toLowerCase();


        const approved =

        status === "approved" ||

        student.enabled === true ||

        student.source === "students_v2";


        if(!approved){

            const pendingRoll =
            normalizeRoll(
                student.roll ||
                session.roll
            );


            studentName.textContent =
            student.name ||
            "STUDENT";


            studentInfo.innerHTML =
            "ROLL: " +
            esc(pendingRoll) +
            " • ACCESS PENDING";


            lcdContent.innerHTML = `

                <div class="lcd-type">
                    🔒 STUDENT ACCESS
                </div>

                <div class="lcd-heading">
                    ACCESS PENDING
                </div>

                <div class="lcd-message">
                    Admin approval के बाद portal access मिलेगा।
                </div>

            `;

            return;

        }


        displayStudent(
            student,
            session.roll
        );


        await loadExam(
            normalizeRoll(
                student.roll ||
                session.roll
            )
        );

    }
    catch(error){

        console.error(
            "Dashboard error:",
            error
        );


        studentName.textContent =
        "ERROR";


        studentInfo.textContent =
        "Dashboard load failed";


        lcdContent.innerHTML = `

            <div class="error-text">

                Dashboard load नहीं हो पाया।

                <br><br>

                ${esc(
                    error.message
                )}

            </div>

        `;

    }

}


startDashboard();
