<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

}

body{

    background:
    linear-gradient(
        180deg,
        #dcecff,
        #edf6ff
    );

    color:#123963;

}


/* =====================================================
   PAGE
===================================================== */

.page{

    width:100%;
    height:100svh;
    min-height:100svh;

    display:flex;
    flex-direction:column;

    overflow:hidden;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    flex:
    0 0 58px;

    height:58px;

    background:
    linear-gradient(
        135deg,
        #032b5a,
        #0759a8,
        #003b78
    );

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
    6px 13px;

    box-shadow:
    0 5px 18px
    rgba(0,0,0,.28);

    position:relative;

    z-index:20;

}

.brand{

    display:flex;

    align-items:center;

    gap:9px;

    min-width:0;

}

.brand img{

    width:46px;
    height:46px;

    border-radius:50%;

    background:#fff;

    padding:3px;

    border:
    2px solid #FFD700;

    box-shadow:
    0 0 14px
    rgba(255,215,0,.35);

}

.brand-text{

    min-width:0;

}

.brand h1{

    font-size:18px;

    line-height:1;

    font-weight:900;

    color:#FFD700;

    white-space:nowrap;

}

.brand p{

    margin-top:3px;

    font-size:6.5px;

    color:#e3f2ff;

    font-weight:700;

    letter-spacing:.6px;

}

.logout{

    width:36px;
    height:36px;

    border-radius:50%;

    border:
    1px solid
    rgba(255,215,0,.45);

    background:
    rgba(255,255,255,.10);

    color:#FFD700;

    font-size:14px;

    box-shadow:
    inset 0 1px 3px
    rgba(255,255,255,.2);

    cursor:pointer;

}


/* =====================================================
   HERO IMAGE
===================================================== */

.hero{

    flex:
    0 0 24svh;

    height:24svh;

    position:relative;

    overflow:hidden;

    background:
    url("student-hero.jpg")
    center center /
    cover
    no-repeat;

    border-bottom:
    3px solid #FFD700;

}

.hero::after{

    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:30%;

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.40)
    );

    pointer-events:none;

}


/* =====================================================
   STUDENT LUXURY CARD
===================================================== */

.student-card{

    flex:
    0 0 12svh;

    height:12svh;

    min-height:78px;

    position:relative;

    z-index:5;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:

    radial-gradient(
        circle at 50% 40%,
        #155c96 0%,
        #0a4178 38%,
        #03264d 72%,
        #01172f 100%
    );

    border-left:
    1px solid
    rgba(255,215,0,.65);

    border-right:
    1px solid
    rgba(255,215,0,.65);

    border-bottom:
    2px solid
    #c79b27;

    border-bottom-left-radius:22px;

    border-bottom-right-radius:22px;

    box-shadow:

    0 9px 22px
    rgba(0,30,70,.38),

    inset 0 1px 0
    rgba(255,255,255,.18),

    inset 0 -8px 18px
    rgba(0,0,0,.20);

}

.student-card::before{

    content:"";

    position:absolute;

    top:0;

    left:5%;
    right:5%;

    height:3px;

    border-radius:
    0 0 20px 20px;

    background:

    linear-gradient(
        90deg,
        transparent,
        #a87918,
        #fff1a0,
        #FFD700,
        #fff1a0,
        #a87918,
        transparent
    );

}

.student-card::after{

    content:"";

    position:absolute;

    width:280px;
    height:100px;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    background:
    rgba(255,215,0,.07);

    filter:blur(32px);

    border-radius:50%;

    pointer-events:none;

}

.welcome{

    position:relative;

    z-index:3;

    font-size:7px;

    color:#f5d875;

    font-weight:900;

    letter-spacing:3px;

}

.student-name{

    position:relative;

    z-index:3;

    margin-top:4px;

    font-size:38px;

    line-height:1;

    font-weight:900;

    color:#FFD700;

    text-transform:uppercase;

    letter-spacing:.8px;

    text-shadow:

    0 3px 5px #000,

    0 0 18px
    rgba(255,215,0,.28);

    max-width:96%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}

.student-info{

    position:relative;

    z-index:3;

    margin-top:7px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    font-size:7px;

    font-weight:800;

}

.info-badge{

    padding:
    4px 11px;

    border-radius:20px;

    background:

    linear-gradient(
        145deg,
        #174f80,
        #082e55
    );

    border:
    1px solid
    rgba(255,215,0,.58);

    color:#fff;

    box-shadow:

    0 3px 7px
    rgba(0,0,0,.28),

    inset 0 1px 2px
    rgba(255,255,255,.20);

}


/* =====================================================
   LCD SECTION
===================================================== */

.lcd-section{

    flex:
    0 0 21svh;

    height:21svh;

    padding:
    7px 8px 6px;

    min-height:0;

}


/* =====================================================
   LCD
===================================================== */

.lcd{

    width:100%;

    height:100%;

    position:relative;

    overflow:hidden;

    border-radius:20px;

    border:
    2px solid #4f6979;

    background:

    radial-gradient(
        circle at 50% 50%,
        #164f68 0%,
        #0b3043 28%,
        #061b28 62%,
        #020a11 100%
    );

    box-shadow:

    0 10px 25px
    rgba(0,0,0,.38),

    inset 0 0 30px
    rgba(0,210,255,.12);

    padding:
    8px 11px;

}

.lcd::before{

    content:"";

    position:absolute;

    inset:0;

    background:

    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 1px,
        transparent 4px
    );

    pointer-events:none;

}

.lcd-header{

    position:relative;

    z-index:3;

    height:18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
    1px solid
    rgba(255,215,0,.28);

    color:#FFD700;

    font-size:6.5px;

    font-weight:900;

}

.live{

    color:#65ff9c;

    text-shadow:
    0 0 7px
    rgba(101,255,156,.50);

}

.lcd-content{

    position:relative;

    z-index:3;

    width:100%;

    height:
    calc(100% - 18px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:
    4px 8px;

}

.lcd-type{

    color:#55eaff;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:3px;

}

.lcd-heading{

    color:#FFD700;

    font-size:23px;

    line-height:1.05;

    font-weight:900;

    text-transform:uppercase;

    max-width:96%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    text-shadow:
    0 2px 3px #000;

}

.lcd-message{

    color:#d9f8ff;

    font-size:8px;

    font-weight:700;

    margin-top:4px;

    max-width:95%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}

.lcd-info{

    margin-top:5px;

    padding:
    4px 9px;

    border-radius:20px;

    background:
    rgba(0,150,210,.16);

    border:
    1px solid
    rgba(80,220,255,.28);

    color:#e9fbff;

    font-size:6.5px;

    font-weight:800;

}

.pin-display{

    margin-top:6px;

    padding:
    5px 12px;

    border-radius:20px;

    background:

    linear-gradient(
        135deg,
        #078fe3,
        #0755a7
    );

    color:#fff;

    font-size:7px;

    font-weight:900;

    box-shadow:

    0 3px 0 #033a78,

    0 5px 10px
    rgba(0,0,0,.28);

}

.pin-display strong{

    color:#FFD700;

    font-size:15px;

    letter-spacing:3px;

    margin-left:3px;

}

.lcd-roll{

    margin-top:4px;

    color:#9ddfff;

    font-size:6px;

    font-weight:800;

}

.loading{

    color:#bfefff;

    font-size:9px;

    font-weight:700;

}

.error-text{

    color:#ffbaba;

    font-size:8px;

    font-weight:800;

}


/* =====================================================
   MENU — 2 COLUMNS
===================================================== */

.menu{

    flex:
    0 0 28svh;

    height:28svh;

    width:100%;

    padding:
    5px 8px 6px;

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    grid-template-rows:
    repeat(2,1fr);

    gap:9px;

}


/* =====================================================
   PREMIUM WHITE GOLD 3D BUTTON
   SIZE UNCHANGED
===================================================== */

.portal{

    position:relative;

    width:100%;

    height:100%;

    min-height:0;

    text-decoration:none;

    border-radius:19px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    gap:6px;

    overflow:hidden;

    background:

    linear-gradient(
        145deg,
        #ffffff 0%,
        #ffffff 45%,
        #f5f9fd 100%
    );

    border:
    2px solid
    #d4aa32;

    box-shadow:

    0 6px 0
    #80631d,

    0 10px 18px
    rgba(20,60,100,.25),

    inset 0 2px 5px
    rgba(255,255,255,.98),

    inset 0 -5px 9px
    rgba(70,110,150,.14);

    transition:
    transform .15s ease;

}

.portal::before{

    content:"";

    position:absolute;

    top:0;

    left:4%;
    right:4%;

    height:3px;

    background:

    linear-gradient(
        90deg,
        transparent,
        #b88a20,
        #fff0a0,
        #d2a72e,
        #fff0a0,
        #b88a20,
        transparent
    );

}

.portal::after{

    content:"";

    position:absolute;

    left:-100%;

    top:0;

    width:55%;

    height:100%;

    background:

    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.75),
        transparent
    );

    transform:
    skewX(-20deg);

    transition:.5s;

    pointer-events:none;

}

.portal:hover::after{

    left:135%;

}

.portal:active{

    transform:
    translateY(5px);

    box-shadow:

    0 2px 0
    #80631d,

    0 5px 10px
    rgba(20,60,100,.20);

}


/* =====================================================
   REMOVE OLD BUTTON COLORS
===================================================== */

.mock,
.course,
.notes,
.performance{

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #ffffff 50%,
        #edf3f8
    );

}


/* =====================================================
   BUTTON ICON
===================================================== */

.icon{

    width:48px;

    height:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:15px;

    background:

    linear-gradient(
        145deg,
        #247ed5,
        #0752a0
    );

    border:
    2px solid
    #d6ad3b;

    color:#fff;

    font-size:21px;

    box-shadow:

    0 4px 0
    #06376f,

    0 7px 12px
    rgba(0,0,0,.20),

    inset 0 3px 5px
    rgba(255,255,255,.45);

}


/* =====================================================
   BUTTON NAME — LARGE
===================================================== */

.name{

    color:#123b6c;

    font-size:16px;

    line-height:1.1;

    font-weight:900;

    letter-spacing:.3px;

    text-shadow:
    0 1px 1px
    rgba(255,255,255,.9);

}


/* =====================================================
   NO SMALL TEXT
===================================================== */

.small{

    display:none;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    flex:
    0 0 7svh;

    height:7svh;

    min-height:44px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:

    linear-gradient(
        135deg,
        #01182f,
        #063f78,
        #01182f
    );

    border-top:
    3px solid
    #d7ad3b;

    box-shadow:

    0 -5px 18px
    rgba(0,30,70,.30),

    inset 0 1px 0
    rgba(255,255,255,.18);

    color:#FFD700;

    position:relative;

    z-index:10;

}

.footer-main{

    color:#FFD700;

    font-size:15px;

    font-weight:900;

    letter-spacing:1.3px;

    text-shadow:
    0 2px 4px #000;

    white-space:nowrap;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:380px){

    }

    .hero{

    }

/* =====================================================

body,

</style>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import { db }
from "./firebase.js";


import {

    collection,
    getDocs,
    getDoc,
    doc

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   ELEMENTS
===================================================== */

const studentName =
document.getElementById(
    "studentName"
);

const studentInfo =
document.getElementById(
    "studentInfo"
);

const lcdContent =
document.getElementById(
    "lcdContent"
);


/* =====================================================
   NORMALIZE ROLL
===================================================== */

function normalizeRoll(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    let roll =
    String(value)
    .trim()
    .toUpperCase();


    if(!roll){

        return "";

    }


    if(
        roll.startsWith("TSP")
    ){

        const number =
        roll.substring(3)
        .replace(
            /[^0-9]/g,
            ""
        );


        if(number){

            return "TSP" +
            String(
                parseInt(
                    number,
                    10
                )
            )
            .padStart(
                3,
                "0"
            );

        }

    }


    if(
        /^[0-9]+$/.test(roll)
    ){

        return "TSP" +
        String(
            parseInt(
                roll,
                10
            )
        )
        .padStart(
            3,
            "0"
        );

    }


    return roll;

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(c){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[c];

        }
    );

}


/* =====================================================
   LOGIN SESSION
===================================================== */

function getLoginSession(){

    const sessionRaw =
    localStorage.getItem(
        "tspStudentSession"
    );


    if(sessionRaw){

        try{

            const session =
            JSON.parse(
                sessionRaw
            );


            if(
                session &&
                session.roll
            ){

                return {

                    roll:
                    normalizeRoll(
                        session.roll
                    ),

                    name:
                    session.name || "",

                    className:
                    session.className || ""

                };

            }

        }
        catch(error){

            console.error(
                "Session error:",
                error
            );

        }

    }


    const keys = [

        "studentRoll",
        "studentLoginRoll",
        "student_roll",
        "studentRollNumber",
        "loginRoll",
        "loggedInRoll"

    ];


    for(
        const key of keys
    ){

        const value =
        localStorage.getItem(
            key
        );


        if(
            value &&
            String(value).trim()
        ){

            const roll =
            normalizeRoll(
                value
            );


            if(roll){

                return {

                    roll:roll,
                    name:"",
                    className:""

                };

            }

        }

    }


    return null;

}


/* =====================================================
   FIND STUDENT
===================================================== */

async function findStudent(roll){

    const finalRoll =
    normalizeRoll(roll);


    if(!finalRoll){

        return null;

    }


    /* subscriptionStudents */

    try{

        const snap =
        await getDocs(
            collection(
                db,
                "subscriptionStudents"
            )
        );


        for(
            const d of snap.docs
        ){

            const x =
            d.data();


            const databaseRoll =
            normalizeRoll(
                x.roll
            );


            if(
                databaseRoll ===
                finalRoll
            ){

                return {

                    id:d.id,

                    ...x

                };

            }

        }

    }
    catch(error){

        console.error(
            "subscriptionStudents:",
            error
        );

        throw error;

    }


    /* students_v2 fallback */

    try{

        const oldSnap =
        await getDocs(
            collection(
                db,
                "students_v2"
            )
        );


        for(
            const d of oldSnap.docs
        ){

            const x =
            d.data();


            const databaseRoll =
            normalizeRoll(

                x.Roll ||
                x.roll ||
                x.RollNumber ||
                x.rollNumber

            );


            if(
                databaseRoll ===
                finalRoll
            ){

                return {

                    id:d.id,

                    name:
                    x.Name ||
                    x.name ||
                    "Student",

                    roll:
                    databaseRoll,

                    className:
                    x.Class ||
                    x.className ||
                    x.class ||
                    "-",

                    status:
                    "approved",

                    enabled:true,

                    source:
                    "students_v2"

                };

            }

        }

    }
    catch(error){

        console.error(
            "students_v2:",
            error
        );

    }


    return null;

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

function displayStudent(
    student,
    loginRoll
){

    const finalRoll =
    normalizeRoll(
        student.roll ||
        loginRoll
    );


    const name =
    student.name ||
    student.Name ||
    "STUDENT";


    const className =
    student.className ||
    student.Class ||
    student.class ||
    "-";


    studentName.textContent =
    name;


    studentInfo.innerHTML = `

        <span class="info-badge">

            <i class="fa-solid fa-id-card"></i>

            ROLL:
            ${esc(finalRoll)}

        </span>


        <span class="info-badge">

            <i class="fa-solid fa-graduation-cap"></i>

            CLASS:
            ${esc(className)}

        </span>

    `;


    localStorage.setItem(
        "studentRoll",
        finalRoll
    );


    localStorage.setItem(
        "studentLoginRoll",
        finalRoll
    );


    const raw =
    localStorage.getItem(
        "tspStudentSession"
    );


    if(raw){

        try{

            const session =
            JSON.parse(raw);


            session.roll =
            finalRoll;

            session.name =
            name;

            session.className =
            className;


            localStorage.setItem(
                "tspStudentSession",
                JSON.stringify(session)
            );

        }
        catch(error){

            console.error(
                "Session update:",
                error
            );

        }

    }

}


/* =====================================================
   LOAD EXAM
===================================================== */

async function loadExam(roll){

    const finalRoll =
    normalizeRoll(roll);


    try{

        const examSnap =
        await getDocs(
            collection(
                db,
                "cbtTests"
            )
        );


        const now =
        new Date();


        const exams = [];


        examSnap.forEach(
        function(d){

            const x =
            d.data();


            const status =
            String(
                x.status || ""
            )
            .trim()
            .toUpperCase();


            if(
                status === "CLOSED"
            ){

                return;

            }


            const start =
            x.start
            ?
            new Date(x.start)
            :
            null;


            const end =
            x.end
            ?
            new Date(x.end)
            :
            null;


            if(
                !start ||
                !end ||
                isNaN(
                    start.getTime()
                ) ||
                isNaN(
                    end.getTime()
                )
            ){

                return;

            }


            if(
                now <= end
            ){

                exams.push({

                    id:d.id,

                    ...x,

                    startDate:start,

                    endDate:end

                });

            }

        });


        if(
            !exams.length
        ){

            showNoExam();

            return;

        }


        exams.sort(
        function(a,b){

            const aLive =
            now >= a.startDate &&
            now <= a.endDate;


            const bLive =
            now >= b.startDate &&
            now <= b.endDate;


            if(
                aLive &&
                !bLive
            ){

                return -1;

            }


            if(
                !aLive &&
                bLive
            ){

                return 1;

            }


            return (
                a.startDate -
                b.startDate
            );

        });


        const exam =
        exams[0];


        /* EXACT PIN */

        const pinId =
        exam.id +
        "_" +
        finalRoll;


        let pin = "";


        try{

            const pinSnap =
            await getDoc(
                doc(
                    db,
                    "cbtExamPins",
                    pinId
                )
            );


            if(
                pinSnap.exists()
            ){

                const pinData =
                pinSnap.data();


                const pinRoll =
                normalizeRoll(
                    pinData.studentRoll
                );


                if(
                    pinRoll ===
                    finalRoll
                ){

                    pin =
                    String(
                        pinData.pin ||
                        ""
                    );

                }

            }

        }
        catch(pinError){

            console.error(
                "PIN:",
                pinError
            );

        }


        const live =
        now >= exam.startDate &&
        now <= exam.endDate;


        lcdContent.innerHTML = `

            <div class="lcd-type">

                ${
                    live
                    ?
                    "🟢 CBT EXAM LIVE"
                    :
                    "🔔 UPCOMING CBT EXAM"
                }

            </div>


            <div class="lcd-heading">

                ${esc(
                    exam.testName ||
                    "CBT EXAMINATION"
                )}

            </div>


            <div class="lcd-message">

                📚
                ${esc(
                    exam.subject ||
                    "CBT TEST"
                )}

            </div>


            <div class="lcd-info">

                📅
                ${formatDate(
                    exam.startDate
                )}

                &nbsp; | &nbsp;

                ⏰
                ${formatTime(
                    exam.startDate
                )}

            </div>


            ${
                pin
                ?

                `

                <div class="pin-display">

                    🎟️ YOUR PIN:

                    <strong>
                        ${esc(pin)}
                    </strong>

                </div>

                `

                :

                `

                <div class="pin-display">

                    🔐 PIN NOT GENERATED

                </div>

                `
            }


            <div class="lcd-roll">

                ROLL NO:
                ${esc(finalRoll)}

            </div>

        `;

    }
    catch(error){

        console.error(
            "Exam error:",
            error
        );


        lcdContent.innerHTML = `

            <div class="error-text">

                ⚠️ Exam information
                load नहीं हो पाई।

            </div>

        `;

    }

}

/* =====================================================
   DATE
===================================================== */

function formatDate(date){

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(date){

    return date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    );

}

   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    function(){

        const keys = [

            "studentRoll",
            "studentLoginRoll",
            "student_roll",
            "studentRollNumber",
            "loginRoll",
            "loggedInRoll",
            "tspStudentSession",
            "studentLoginData",
            "studentData",
            "loggedInStudent"

        ];


        keys.forEach(
        function(key){

            localStorage.removeItem(
                key
            );

        });


        location.href =
        "index.html";

    }
);


/* =====================================================
   START DASHBOARD
===================================================== */

async function startDashboard(){

    try{

        const session =
        getLoginSession();


        if(
            !session ||
            !session.roll
        ){

            studentName.textContent =
            "LOGIN REQUIRED";


            studentInfo.innerHTML = `

                <span class="info-badge">

                    <i class="fa-solid fa-lock"></i>

                    PLEASE LOGIN AGAIN

                </span>

            `;


            lcdContent.innerHTML = `

                <div class="lcd-type">
                    🔐 STUDENT LOGIN
                </div>

                <div class="lcd-heading">
                    LOGIN REQUIRED
                </div>

                <div class="lcd-message">
                    कृपया Student Login से दोबारा login करें।
                </div>

            `;

            return;

        }


        const student =
        await findStudent(
            session.roll
        );


        if(!student){

            studentName.textContent =
            "STUDENT NOT FOUND";


            studentInfo.innerHTML = `

                <span class="info-badge">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    ROLL:
                    ${esc(session.roll)}

                </span>

            `;


            lcdContent.innerHTML = `

                <div class="lcd-type">
                    ⚠️ STUDENT RECORD
                </div>

                <div class="lcd-heading">
                    STUDENT NOT FOUND
                </div>

                <div class="lcd-message">
                    Roll Number:
                    ${esc(session.roll)}
                </div>

            `;

            return;

        }


        const status =
        String(
            student.status || ""
        )
        .trim()
        .toLowerCase();


        const approved =

        status === "approved" ||

        student.enabled === true ||

        student.source ===
        "students_v2";


        if(!approved){

            const pendingRoll =
            normalizeRoll(
                student.roll ||
                session.roll
            );


            studentName.textContent =
            student.name ||
            "STUDENT";


            studentInfo.innerHTML = `

                <span class="info-badge">

                    <i class="fa-solid fa-clock"></i>

                    ROLL:
                    ${esc(pendingRoll)}

                </span>

                <span class="info-badge">
                    ACCESS PENDING
                </span>

            `;


            lcdContent.innerHTML = `

                <div class="lcd-type">
                    🔒 STUDENT ACCESS
                </div>

                <div class="lcd-heading">
                    ACCESS PENDING
                </div>

                <div class="lcd-message">
                    Admin approval के बाद portal access मिलेगा।
                </div>

            `;

            return;

        }


        displayStudent(
            student,
            session.roll
        );


        await loadExam(
            normalizeRoll(
                student.roll ||
                session.roll
            )
        );

    }
    catch(error){

        console.error(
            "DASHBOARD ERROR:",
            error
        );


        studentName.textContent =
        "ERROR";


        studentInfo.innerHTML = `

            <span class="info-badge">

                <i class="fa-solid fa-triangle-exclamation"></i>

                DASHBOARD ERROR

            </span>

        `;


        lcdContent.innerHTML = `

            <div class="error-text">

                Dashboard load नहीं हो पाया।

                <br><br>

                कृपया page refresh करें।

            </div>

        `;

    }

}


/* =====================================================
   START
===================================================== */

startDashboard();
