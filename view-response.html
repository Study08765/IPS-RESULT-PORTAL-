<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Student CBT Report</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef4ff;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#0052D4,#3B82F6);
color:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,82,212,.25);
margin-bottom:20px;
}

.header h2{
font-size:30px;
margin-bottom:20px;
}

.info{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.info div{
background:rgba(255,255,255,.15);
padding:15px;
border-radius:15px;
}

.info small{
opacity:.9;
}

.info h3{
margin-top:6px;
font-size:18px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin:20px 0;
}

.card{
background:#fff;
padding:20px;
text-align:center;
border-radius:18px;
box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.card h2{
font-size:34px;
color:#0052D4;
margin-bottom:8px;
}

.question{
background:#fff;
padding:20px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.question h3{
margin-bottom:12px;
}

.correct{
color:#16a34a;
font-weight:700;
}

.wrong{
color:#dc2626;
font-weight:700;
}

@media(max-width:768px){

body{
padding:12px;
}

.header h2{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>Student CBT Report</h2>

<div class="info">

<div>
<small>Name</small>
<h3 id="studentName">Loading...</h3>
</div>

<div>
<small>Roll No</small>
<h3 id="studentRoll">Loading...</h3>
</div>

<div>
<small>Class</small>
<h3 id="studentClass">Loading...</h3>
</div>

<div>
<small>Exam</small>
<h3 id="examName">Loading...</h3>
</div>

</div>

</div>

<div class="summary">

<div class="card">
<h2 id="correctCount">0</h2>
<p>Correct</p>
</div>

<div class="card">
<h2 id="wrongCount">0</h2>
<p>Wrong</p>
</div>

<div class="card">
<h2 id="marks">0/0</h2>
<p>Marks</p>
</div>

<div class="card">
<h2 id="percentage">0%</h2>
<p>Percentage</p>
</div>

</div>

<div id="questionList"></div>
<script type="module">

import { db } from "./firebase.js";

import {
doc,
getDoc,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params = new URLSearchParams(location.search);
const responseId = params.get("id");

const responseSnap = await getDoc(
doc(db,"cbtResponses",responseId)
);

if(!responseSnap.exists()){

alert("Response Not Found");

throw new Error("Response Not Found");

}

const response = responseSnap.data();

document.getElementById("studentName").textContent=response.studentName;
document.getElementById("studentRoll").textContent=response.studentRoll;
document.getElementById("studentClass").textContent=response.studentClass;

const testSnap = await getDoc(
doc(db,"cbtTests",response.examId)
);

if(testSnap.exists()){

document.getElementById("examName").textContent =
testSnap.data().testName;

}

const q = query(
collection(db,"cbtQuestions"),
where("testId","==",response.examId)
);

const snap = await getDocs(q);

let questions=[];

snap.forEach(d=>{

questions.push({
id:d.id,
...d.data()
});

});

questions.sort((a,b)=>{

const x=a.createdAt?.seconds||0;
const y=b.createdAt?.seconds||0;

return x-y;

});

let correct=0;
let wrong=0;

const questionList=document.getElementById("questionList");
  questions.forEach((q,index)=>{

const studentAnswer =
response.answers?.[q.id] ?? "Not Answered";

const correctAnswer = q.answer;

const isCorrect = studentAnswer === correctAnswer;

if(isCorrect){
correct++;
}else{
wrong++;
}

questionList.innerHTML += `

<div class="question">

<h3>Q${index+1}. ${q.question}</h3>

<p>
<b>Student Answer :</b>
<span class="${isCorrect ? "correct":"wrong"}">
${studentAnswer}
</span>
</p>

<p>
<b>Correct Answer :</b>
<span class="correct">
${correctAnswer}
</span>
</p>

<p class="${isCorrect ? "correct":"wrong"}">
${isCorrect ? "✅ Correct":"❌ Wrong"}
</p>

</div>

`;

});
  const total = questions.length;

document.getElementById("correctCount").textContent = correct;
document.getElementById("wrongCount").textContent = wrong;
document.getElementById("marks").textContent = `${correct}/${total}`;
document.getElementById("percentage").textContent =
total ? ((correct / total) * 100).toFixed(2) + "%" : "0%";

</script>

</body>
</html>
