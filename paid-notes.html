<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE STUDY POINT | PAID NOTES</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Poppins,sans-serif}body{margin:0;background:#eef6ff;color:#173b62}
.header{background:linear-gradient(135deg,#064b99,#0878d8);color:#fff;padding:20px;border-radius:0 0 28px 28px}
.top{max-width:1050px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:55px;height:55px;border-radius:50%;background:#fff;padding:3px;border:3px solid #ffd700}.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
h1{font-size:21px;margin:0;font-weight:800}.sub{font-size:10px}.back{display:inline-block;color:#fff;margin-top:13px;text-decoration:none;font-size:12px}
.container{max-width:1050px;margin:auto;padding:18px 12px}.title{text-align:center;margin-bottom:15px}.title h2{color:#064b99}.title p{font-size:11px;color:#70849a}
select{width:100%;padding:12px;border:1px solid #ccd9e7;border-radius:11px;background:#fff}.filter,.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 7px 20px #164b7a18}.filter{margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card h3{margin:8px 0 4px;color:#064b99}.subject{font-size:11px;color:#71849a}.price{font-weight:800;color:#064b99;margin:10px 0}.badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;background:#fff0d0;color:#8a5a00}.free{background:#e5f8ed;color:#087a3b}
.btn{width:100%;border:0;border-radius:11px;padding:11px;background:#075fb6;color:#fff;font-weight:800;cursor:pointer}.btn.free{background:#087a3b}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;padding:20px;width:min(430px,100%)}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.qr{display:block;width:240px;height:240px;object-fit:contain;margin:15px auto;border:1px solid #ddd;border-radius:10px}.small{font-size:11px;line-height:1.6;color:#687b91}
@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:18px}}
</style></head><body>
<header class="header"><div class="top"><div class="logo"><img src="icon-512.png"></div><div><h1>THE STUDY POINT</h1><div class="sub">PAID NOTES & STUDY MATERIAL</div></div></div>
<a class="back" href="index.html">← Back to Portal</a></header>
<main class="container"><div class="title"><h2>📚 PAID NOTES</h2><p>Class 6 to 10 • Hindi • English • Mathematics • Science • Social Science • General Knowledge</p></div>
<div class="filter"><select id="classFilter"><option value="all">All Classes</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option></select></div>
<div id="grid" class="grid">Loading...</div></main>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAUcTdpMctPg2lcqSapoTgFHXizEE35RCY",
  authDomain: "ips-result-portal.firebaseapp.com",
  projectId: "ips-result-portal",
  storageBucket: "ips-result-portal.firebasestorage.app",
  messagingSenderId: "877536597914",
  appId: "1:877536597914:web:d77c26ef46a9da2c928c23",
  measurementId: "G-4PD16WMHTT"
};
const db=getFirestore(initializeApp(firebaseConfig)); let notes=[];
const grid=document.getElementById("grid"), filter=document.getElementById("classFilter");
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){
 try{const s=await getDocs(collection(db,"paidNotes"));notes=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.enabled!==false);render()}
 catch(e){grid.innerHTML="Firebase error: "+e.message}
}
function render(){
 const a=notes.filter(n=>filter.value==="all"||n.className===filter.value);
 if(!a.length){grid.innerHTML="<div>No notes available yet.</div>";return}
 grid.innerHTML=a.map(n=>`<div class="card"><span class="badge ${n.accessType==="free"?"free":""}">${n.accessType==="free"?"FREE":"PAID"}</span>
 <h3>${esc(n.className)}</h3><div class="subject">${esc(n.subject)} • ${esc(n.title)}</div>
 <div class="price">${n.accessType==="free"?"FREE":"₹"+(n.price||0)}</div>
 <button class="btn ${n.accessType==="free"?"free":""}" onclick="openNote('${n.id}')">${n.accessType==="free"?"OPEN NOTES":"BUY NOW"}</button></div>`).join("");
}
window.openNote=id=>{
 const n=notes.find(x=>x.id===id); if(!n)return;
 document.getElementById("modalTitle").textContent=n.className+" • "+n.subject;
 if(n.accessType==="free"){
   document.getElementById("modalBody").innerHTML=`<p class="small">यह notes FREE है।</p><a class="btn free" target="_blank" style="display:block;text-align:center;text-decoration:none" href="${esc(n.pdfUrl)}">OPEN PDF</a>`;
 }else{
   document.getElementById("modalBody").innerHTML=`<p class="small"><b>${esc(n.title)}</b><br>Price: ₹${n.price||0}</p>
   ${n.qrUrl?`<img class="qr" src="${esc(n.qrUrl)}">`:"<p>No QR added by admin.</p>"}
   <p class="small">QR scan करके payment करें। Payment के बाद Admin approval से access दिया जाएगा।</p>
   <button class="btn" onclick="alert('Payment request भेजने के लिए आगे approval system जोड़ा जा सकता है।')">I HAVE PAID</button>`;
 }
 document.getElementById("modal").classList.add("show");
};
window.closeModal=()=>document.getElementById("modal").classList.remove("show");
filter.onchange=render; load();
</script></body></html>
