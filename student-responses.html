<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Responses</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef4ff;
padding:20px;
}

.header{
background:linear-gradient(135deg,#0052D4,#1565C0);
color:#fff;
padding:20px;
border-radius:18px;
margin-bottom:20px;
}

.header h2{
font-size:28px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

th{
background:#0052D4;
color:#fff;
padding:15px;
}

td{
padding:14px;
text-align:center;
border-bottom:1px solid #eee;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
margin:2px;
}

.retest{
background:#16a34a;
color:#fff;
}

.delete{
background:#dc2626;
color:#fff;
}

</style>

</head>

<body>

<div class="header">

<h2>Student Responses</h2>

<p>Submitted CBT Exams</p>

</div>

<table>

<thead>

<tr>

<th>Roll</th>

<th>Name</th>

<th>Class</th>

<th>Exam</th>

<th>Submitted</th>

<th>Action</th>

</tr>

</thead>

<tbody id="responseTable">

<tr>

<td colspan="6">

Loading...

</td>

</tr>

</tbody>

</table>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const table = document.getElementById("responseTable");

async function loadResponses(){

const snapshot = await getDocs(collection(db,"cbtResponses"));

let html = "";

snapshot.forEach(doc=>{

const d = doc.data();

html += `
<tr>

<td>${d.studentRoll}</td>

<td>${d.studentName}</td>

<td>${d.studentClass}</td>

<td>${d.examId}</td>

<td>${d.submitted ? "Submitted" : "-"}</td>

<td>

<button class="retest" data-id="${doc.id}">
Allow Retest
</button>

<button class="delete" data-id="${doc.id}">
Delete
</button>

</td>

</tr>
`;

});

if(html===""){
html="<tr><td colspan='6'>No Responses Found</td></tr>";
}

table.innerHTML = html;

// Retest Button
document.querySelectorAll(".retest").forEach(btn=>{

btn.onclick = async function(){

const id = this.dataset.id;

await updateDoc(doc(db,"cbtResponses",id),{
allowRetest:true
});

alert("Retest Allowed Successfully");

loadResponses();

};

});

// Delete Button
document.querySelectorAll(".delete").forEach(btn=>{

btn.onclick = async function(){

if(!confirm("Delete this response?")) return;

const id = this.dataset.id;

await deleteDoc(doc(db,"cbtResponses",id));

alert("Response Deleted Successfully");

loadResponses();

};

});

}

</script>

</body>
  </html>
