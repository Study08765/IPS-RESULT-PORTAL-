<script type="module">


/* =====================================================

import {

from

from

const firebaseConfig = {

    "AIzaSyAUcTdpMctPg2lcqSapoTgFHXizEE35RCY",

    "ips-result-portal.firebaseapp.com",

    messagingSenderId:
    "877536597914",

    appId:
    "1:877536597914:web:d77c26ef46a9da2c928c23",

    measurementId:
    "G-4PD16WMHTT"

};


const app =
initializeApp(
    firebaseConfig
);

const db =
getFirestore(app);


/* =====================================================
   CLOUDINARY
   अपना Cloud Name और Unsigned Upload Preset यहाँ डालें
===================================================== */

const CLOUDINARY_CLOUD_NAME =
"YOUR_CLOUD_NAME";

const CLOUDINARY_UPLOAD_PRESET =
"YOUR_UNSIGNED_UPLOAD_PRESET";


/* =====================================================
   VARIABLES
===================================================== */

let notes = [];

let paymentRequests = [];

const grid =
document.getElementById("grid");

const filter =
document.getElementById("classFilter");

const modal =
document.getElementById("modal");

const modalTitle =
document.getElementById("modalTitle");

const modalBody =
document.getElementById("modalBody");


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

    return String(value ?? "")
    .replace(
        /[&<>"']/g,
        function(c){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[c];

        }
    );

}


/* =====================================================
   NORMALIZE ROLL
===================================================== */

function normalizeRoll(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    let roll =
    String(value)
    .trim()
    .toUpperCase();

    if(
        roll.startsWith("TSP")
    ){

        const number =
        roll.substring(3)
        .replace(
            /[^0-9]/g,
            ""
        );

        if(number){

            return "TSP" +
            String(
                parseInt(
                    number,
                    10
                )
            )
            .padStart(
                3,
                "0"
            );

        }

    }

    if(
        /^[0-9]+$/.test(roll)
    ){

        return "TSP" +
        String(
            parseInt(
                roll,
                10
            )
        )
        .padStart(
            3,
            "0"
        );

    }

    return roll;

}


/* =====================================================
   LOGIN SESSION
===================================================== */

function getSession(){

    const raw =
    localStorage.getItem(
        "tspStudentSession"
    );

    if(raw){

        try{

            const session =
            JSON.parse(raw);

            if(
                session &&
                session.roll
            ){

                return {

                    roll:
                    normalizeRoll(
                        session.roll
                    ),

                    name:
                    session.name || "",

                    className:
                    session.className || "",

                    mobile:
                    session.mobile ||
                    session.phone ||
                    ""

                };

            }

        }
        catch(error){

            console.error(
                "Session:",
                error
            );

        }

    }


    const roll =
    localStorage.getItem(
        "studentRoll"
    );

    if(roll){

        return {

            roll:
            normalizeRoll(roll),

            name:"",

            className:"",

            mobile:""

        };

    }

    return null;

}


/* =====================================================
   LOAD NOTES
===================================================== */

async function loadNotes(){

    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "paidNotes"
            )
        );

        notes =
        snapshot.docs
        .map(
            d => ({

                id:d.id,

                ...d.data()

            })
        )
        .filter(
            n =>
            n.enabled !== false
        );

        await loadRequests();

        render();

    }
    catch(error){

        console.error(error);

        grid.innerHTML = `

            <div class="empty">

                ❌ Notes load नहीं हो सके।

                <br><br>

                ${esc(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   LOAD PAYMENT REQUESTS
===================================================== */

async function loadRequests(){

    const session =
    getSession();

    paymentRequests = [];

    if(
        !session ||
        !session.roll
    ){

        return;

    }

    try{

        const q =
        query(

            collection(
                db,
                "notePaymentRequests"
            ),

            where(
                "studentRoll",
                "==",
                session.roll
            ),

            limit(100)

        );

        const snapshot =
        await getDocs(q);

        paymentRequests =
        snapshot.docs
        .map(
            d => ({

                id:d.id,

                ...d.data()

            })
        );

    }
    catch(error){

        console.error(
            "Requests:",
            error
        );

    }

}


/* =====================================================
   GET REQUEST
===================================================== */

function getRequest(noteId){

    const list =
    paymentRequests.filter(
        r =>
        r.noteId === noteId
    );

    if(!list.length){

        return null;

    }

    list.sort(
        (a,b) => {

            const aTime =
            a.createdAt?.seconds || 0;

            const bTime =
            b.createdAt?.seconds || 0;

            return bTime - aTime;

        }
    );

    return list[0];

}


/* =====================================================
   APPROVED
===================================================== */

function isApproved(noteId){

    const request =
    getRequest(noteId);

    return !!(
        request &&
        String(
            request.status || ""
        )
        .toLowerCase()
        ===
        "approved"
    );

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const selected =
    filter.value;

    const filtered =
    notes.filter(
        note =>
        selected === "all" ||
        note.className === selected
    );

    if(!filtered.length){

        grid.innerHTML = `

            <div class="empty">

                📚 अभी इस class के लिए
                कोई notes available नहीं हैं।

            </div>

        `;

        return;

    }


    grid.innerHTML =
    filtered.map(
        note => {

            const free =
            note.accessType === "free";

            const approved =
            isApproved(note.id);

            const request =
            getRequest(note.id);

            let buttonText =
            "🔐 BUY NOW";

            let buttonClass = "";

            let statusHTML = "";


            if(free){

                buttonText =
                "📖 OPEN NOTES";

                buttonClass =
                "free-btn";

            }
            else if(approved){

                buttonText =
                "🔓 OPEN PREMIUM NOTES";

                statusHTML = `

                    <div class="status approved">

                        ✓ PREMIUM UNLOCKED

                    </div>

                `;

            }
            else if(
                request &&
                String(
                    request.status || ""
                ).toLowerCase()
                ===
                "pending"
            ){

                buttonText =
                "⏳ PAYMENT PENDING";

                statusHTML = `

                    <div class="status pending">

                        ⏳ Verification Pending

                    </div>

                `;

            }
            else if(
                request &&
                String(
                    request.status || ""
                ).toLowerCase()
                ===
                "rejected"
            ){

                buttonText =
                "🔄 BUY AGAIN";

                statusHTML = `

                    <div class="status rejected">

                        ❌ Previous Request Rejected

                    </div>

                `;

            }


            return `

                <div class="card">

                    <span class="badge ${
                        free
                        ? "free"
                        : "premium"
                    }">

                        ${
                            free
                            ? "🟢 FREE NOTES"
                            : "🔐 PREMIUM NOTES"
                        }

                    </span>


                    <div class="class-name">

                        ${esc(
                            note.className
                        )}

                    </div>


                    <div class="note-title">

                        ${esc(
                            note.title ||
                            "Premium Study Notes"
                        )}

                    </div>


                    <div class="subject">

                        📖
                        ${esc(
                            note.subject ||
                            "Study Material"
                        )}

                    </div>


                    <div class="price ${
                        free
                        ? "free-price"
                        : ""
                    }">

                        ${
                            free
                            ? "FREE"
                            :
                            "₹" +
                            (
                                note.price ||
                                0
                            )
                        }

                    </div>


                    <button
                    class="main-btn ${buttonClass}"
                    onclick="openNote('${esc(note.id)}')">

                        ${buttonText}

                    </button>


                    ${statusHTML}

                </div>

            `;

        }
    ).join("");

}

/* =====================================================
   CLOUDINARY UPLOAD
===================================================== */

async function uploadScreenshot(file){

    if(
        CLOUDINARY_CLOUD_NAME ===
        "YOUR_CLOUD_NAME" ||

        CLOUDINARY_UPLOAD_PRESET ===
        "YOUR_UNSIGNED_UPLOAD_PRESET"
    ){

        throw new Error(
            "Cloudinary Cloud Name और Upload Preset अभी set नहीं किए गए हैं।"
        );

    }


    const formData =
    new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
    await fetch(

        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

        {

            method:"POST",

            body:formData

        }

    );


    if(!response.ok){

        throw new Error(
            "Screenshot upload failed."
        );

    }


    const data =
    await response.json();


    if(
        !data.secure_url
    ){

        throw new Error(
            "Cloudinary URL नहीं मिला।"
        );

    }


    return data.secure_url;

}


/* =====================================================
   SUBMIT PAYMENT
===================================================== */

window.submitPayment =
async function(noteId){

    const note =
    notes.find(
        n =>
        n.id === noteId
    );


    if(!note){

        return;

    }


    const session =
    getSession();


    if(
        !session ||
        !session.roll
    ){

        alert(
            "Student Login required."
        );

        return;

    }


    const name =
    document
    .getElementById("payName")
    ?.value
    .trim();


    const mobile =
    document
    .getElementById("payMobile")
    ?.value
    .trim();


    const utr =
    document
    .getElementById("payUtr")
    ?.value
    .trim();


    const screenshot =
    document
    .getElementById("paymentScreenshot")
    ?.files?.[0];


    if(!name){

        alert(
            "Student Name दर्ज करें।"
        );

        return;

    }


    if(
        !/^[0-9]{10}$/.test(
            mobile
        )
    ){

        alert(
            "सही 10 digit Mobile Number दर्ज करें।"
        );

        return;

    }


    if(!utr){

        alert(
            "UTR / Transaction ID दर्ज करें।"
        );

        return;

    }


    if(!screenshot){

        alert(
            "Payment Screenshot upload करें।"
        );

        return;

    }


    if(
        !screenshot.type.startsWith(
            "image/"
        )
    ){

        alert(
            "केवल image screenshot upload करें।"
        );

        return;

    }


    if(
        screenshot.size >
        3 * 1024 * 1024
    ){

        alert(
            "Screenshot 3 MB से कम होना चाहिए।"
        );

        return;

    }


    const button =
    document.getElementById(
        "submitPayment"
    );


    button.disabled = true;

    button.textContent =
    "⏳ UPLOADING SCREENSHOT...";


    try{

        /* ==========================
           CLOUDINARY
        ========================== */

        const screenshotUrl =
        await uploadScreenshot(
            screenshot
        );


        button.textContent =
        "⏳ SAVING REQUEST...";


        /* ==========================
           FIRESTORE
        ========================== */

        await addDoc(

            collection(
                db,
                "notePaymentRequests"
            ),

            {

                noteId:
                note.id,

                noteTitle:
                note.title ||
                "Premium Study Notes",

                className:
                note.className ||
                "",

                subject:
                note.subject ||
                "",

                amount:
                Number(
                    note.price ||
                    0
                ),

                studentRoll:
                normalizeRoll(
                    session.roll
                ),

                studentName:
                name,

                mobile:
                mobile,

                utr:
                utr,

                screenshotUrl:
                screenshotUrl,

                screenshotName:
                screenshot.name,

                status:
                "pending",

                createdAt:
                serverTimestamp(),

                verifiedAt:
                null,

                verifiedBy:
                "",

                rejectionReason:
                ""

            }

        );


        alert(
            "✅ Payment Request Successfully Submitted!\n\nAdmin verification के बाद Premium Notes unlock होंगे।"
        );


        await loadRequests();

        render();

        closeModal();

    }
    catch(error){

        console.error(
            "Payment Error:",
            error
        );


        alert(
            "❌ Payment request submit नहीं हो सकी।\n\n"
            +
            error.message
        );


        button.disabled = false;

        button.textContent =
        "💳 SUBMIT PAYMENT REQUEST";

    }

};
