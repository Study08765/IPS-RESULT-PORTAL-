<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish Results</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
margin-bottom:20px;
color:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
padding:15px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#1d4ed8;
color:#fff;
}
  .action-btn{
padding:10px 16px;
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
margin:4px;
transition:.3s;
color:#fff;
box-shadow:0 6px 15px rgba(0,0,0,.2);
}

.result-btn{
background:linear-gradient(135deg,#16a34a,#22c55e);
}

.key-btn{
background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.action-btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,.25);
  }
  .stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.stat-card h2{
font-size:32px;
margin-bottom:8px;
}

.stat-card p{
font-size:15px;
font-weight:600;
  }
</style>
</head>

<body>

<div class="container">
<div class="stats">

<div class="stat-card">
<h2 id="totalTests">0</h2>
<p>Total Tests</p>
</div>

<div class="stat-card">
<h2 id="publishedResults">0</h2>
<p>Published Results</p>
</div>

<div class="stat-card">
<h2 id="publishedKeys">0</h2>
<p>Published Keys</p>
</div>

<div class="stat-card">
<h2 id="hiddenResults">0</h2>
<p>Hidden Results</p>
</div>

</div>
<h1>Publish Results</h1>

<table>

<thead>

<tr>

<th>Test</th>
<th>Class</th>
<th>Subject</th>
<th>Result</th>
<th>Answer Key</th>
<th>Action</th>

</tr>

</thead>

<tbody id="testList">

</tbody>

</table>

</div>

<script type="module">
import { db } from "./firebase.js";

import {
collection,
onSnapshot,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const list = document.getElementById("testList");

onSnapshot(collection(db,"cbtTests"), (snapshot)=>{

list.innerHTML = "";
let total = 0;
let published = 0;
let keys = 0;
snapshot.forEach((doc)=>{

const x = doc.data();
total++;

if (x.resultPublished) published++;

if (x.answerKeyPublished) keys++;
list.innerHTML += `
<tr>
<td>${x.testName}</td>
<td>${x.className}</td>
<td>${x.subject}</td>
<td>${x.resultPublished ? "🟢 Published" : "🔴 Hidden"}</td>
<td>${x.answerKeyPublished ? "🟢 Published" : "🔴 Hidden"}</td>
<td>
<button class="action-btn result-btn"
onclick="toggleResult('${doc.id}')">
${x.resultPublished ? "🔴 Hide Result" : "🟢 Publish Result"}
</button>

<button class="action-btn key-btn"
onclick="toggleKey('${doc.id}')">
${x.answerKeyPublished ? "🔒 Hide Key" : "🔑 Publish Key"}
</button>
</td>
</tr>
`;

});
document.getElementById("totalTests").textContent = total;
document.getElementById("publishedResults").textContent = published;
document.getElementById("publishedKeys").textContent = keys;
document.getElementById("hiddenResults").textContent = total - published;
});
  window.toggleResult = async(id)=>{

const row = [...document.querySelectorAll("button")]
.find(btn => btn.getAttribute("onclick") === `toggleResult('${id}')`);

const current =
row.textContent.includes("Hide");

await updateDoc(doc(db,"cbtTests",id),{

resultPublished:!current

});

};

window.toggleKey = async(id)=>{

const row = [...document.querySelectorAll("button")]
.find(btn => btn.getAttribute("onclick") === `toggleKey('${id}')`);

const current =
row.textContent.includes("Hide");

await updateDoc(doc(db,"cbtTests",id),{

answerKeyPublished:!current

});

};
</script>

</body>
  </html>
