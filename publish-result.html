<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish Results</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:
radial-gradient(circle at 10% 10%,rgba(37,99,235,.10),transparent 30%),
radial-gradient(circle at 90% 20%,rgba(124,58,237,.08),transparent 30%),
linear-gradient(135deg,#f8fbff,#eef4ff);
min-height:100vh;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
margin-bottom:20px;
color:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
padding:15px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#1d4ed8;
color:#fff;
}
  .action-btn{
padding:8px 13px;
border:none;
border-radius:9px;
font-size:12px;
font-weight:600;
cursor:pointer;
margin:3px;
transition:all .25s ease;
color:#fff;
white-space:nowrap;
box-shadow:0 4px 10px rgba(15,23,42,.15);
}

.action-btn:hover{
transform:translateY(-2px);
box-shadow:0 7px 15px rgba(15,23,42,.20);
}

.action-btn:active{
transform:scale(.96);
}
  }
  .stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.stat-card h2{
font-size:32px;
margin-bottom:8px;
}

.stat-card p{
font-size:15px;
font-weight:600;
  }
  .stat-card{
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,.25);
}

.stat-card:nth-child(1){
background:linear-gradient(135deg,#2563eb,#1e40af);
}

.stat-card:nth-child(2){
background:linear-gradient(135deg,#16a34a,#059669);
}

.stat-card:nth-child(3){
background:linear-gradient(135deg,#7c3aed,#9333ea);
}

.stat-card:nth-child(4){
background:linear-gradient(135deg,#ef4444,#dc2626);
}

.stat-card::after{
content:"";
position:absolute;
width:90px;
height:90px;
border-radius:50%;
background:rgba(255,255,255,.10);
top:-35px;
right:-25px;
}

.stat-card h2{
position:relative;
z-index:1;
}

.stat-card p{
position:relative;
z-index:1;
opacity:.9;
  }
  .page-header{
background:linear-gradient(135deg,#0f3d91,#2563eb);
padding:22px 25px;
border-radius:18px;
color:#fff;
margin-bottom:20px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 12px 30px rgba(37,99,235,.25);
}

.header-icon{
width:55px;
height:55px;
border-radius:15px;
background:rgba(255,255,255,.18);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

.page-header h1{
margin:0;
color:#fff;
font-size:25px;
}

.page-header p{
margin-top:4px;
font-size:13px;
opacity:.85;
  }
  table{
border-collapse:separate;
border-spacing:0;
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 12px 35px rgba(15,23,42,.10);
border:1px solid #e8eef8;
}

th{
background:linear-gradient(135deg,#0f3d91,#2563eb);
color:#fff;
font-size:14px;
letter-spacing:.2px;
border:none;
padding:16px 12px;
}

td{
padding:14px 12px;
border:none;
border-bottom:1px solid #edf2f7;
font-size:14px;
color:#334155;
}

tbody tr{
transition:.25s;
}

tbody tr:hover{
background:#f5f9ff;
}

tbody tr:last-child td{
border-bottom:none;
}
  .status{
display:inline-flex;
align-items:center;
justify-content:center;
padding:6px 11px;
border-radius:30px;
font-size:12px;
font-weight:700;
white-space:nowrap;
}

.status-published{
background:#dcfce7;
color:#15803d;
border:1px solid #bbf7d0;
}

.status-hidden{
background:#fee2e2;
color:#dc2626;
border:1px solid #fecaca;
  }
  .result-btn{
background:linear-gradient(135deg,#16a34a,#22c55e);
}

.key-btn{
background:linear-gradient(135deg,#2563eb,#3b82f6);
  }
  .table-wrapper{
width:100%;
overflow-x:auto;
border-radius:18px;
-webkit-overflow-scrolling:touch;
}

table{
min-width:850px;
}

@media(max-width:600px){
body{
padding:12px;
}

.page-header{
padding:17px;
border-radius:15px;
}

.stats{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.stat-card{
padding:15px 8px;
border-radius:13px;
}

.stat-card h2{
font-size:25px;
}

.stat-card p{
font-size:11px;
}
  .swipe-hint{
display:none;
font-size:11px;
font-weight:600;
color:#64748b;
text-align:right;
margin:0 4px 7px;
}

@media(max-width:600px){
.swipe-hint{
display:block;
}
  }
    }
  
</style>
</head>

<body>

<div class="container">
<div class="stats">

<div class="stat-card">
<h2 id="totalTests">0</h2>
<p>Total Tests</p>
</div>

<div class="stat-card">
<h2 id="publishedResults">0</h2>
<p>Published Results</p>
</div>

<div class="stat-card">
<h2 id="publishedKeys">0</h2>
<p>Published Keys</p>
</div>

<div class="stat-card">
<h2 id="hiddenResults">0</h2>
<p>Hidden Results</p>
</div>

</div>
<div class="page-header">
  <div class="header-icon">🏆</div>
  <div>
    <h1>Publish Results</h1>
    <p>Manage CBT Results & Answer Keys</p>
  </div>
</div>
  <div class="swipe-hint">
  👈 Swipe to view full table 👉
</div>

<div class="table-wrapper">
<div class="table-wrapper">
<table>

<thead>

<tr>

<th>Test</th>
<th>Class</th>
<th>Subject</th>
<th>Result</th>
<th>Answer Key</th>
<th>Action</th>

</tr>

</thead>

<tbody id="testList">

</tbody>

</table>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";

import {
collection,
onSnapshot,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const list = document.getElementById("testList");

onSnapshot(collection(db,"cbtTests"), (snapshot)=>{

list.innerHTML = "";
let total = 0;
let published = 0;
let keys = 0;
snapshot.forEach((doc)=>{

const x = doc.data();
total++;

if (x.resultPublished) published++;

if (x.answerKeyPublished) keys++;
list.innerHTML += `
<tr>
<td>${x.testName}</td>
<td>${x.className}</td>
<td>${x.subject}</td>
<td>
<span class="status ${x.resultPublished ? "status-published" : "status-hidden"}">
${x.resultPublished ? "✓ Published" : "● Hidden"}
</span>
</td>

<td>
<span class="status ${x.answerKeyPublished ? "status-published" : "status-hidden"}">
${x.answerKeyPublished ? "✓ Published" : "● Hidden"}
</span>
</td>
<td>
<button class="action-btn result-btn"
onclick="toggleResult('${doc.id}')">
${x.resultPublished ? "🔴 Hide Result" : "🟢 Publish Result"}
</button>

<button class="action-btn key-btn"
onclick="toggleKey('${doc.id}')">
${x.answerKeyPublished ? "🔒 Hide Key" : "🔑 Publish Key"}
</button>
</td>
</tr>
`;

});
document.getElementById("totalTests").textContent = total;
document.getElementById("publishedResults").textContent = published;
document.getElementById("publishedKeys").textContent = keys;
document.getElementById("hiddenResults").textContent = total - published;
});
  window.toggleResult = async(id)=>{

const row = [...document.querySelectorAll("button")]
.find(btn => btn.getAttribute("onclick") === `toggleResult('${id}')`);

const current =
row.textContent.includes("Hide");

await updateDoc(doc(db,"cbtTests",id),{

resultPublished:!current

});

};

window.toggleKey = async(id)=>{

const row = [...document.querySelectorAll("button")]
.find(btn => btn.getAttribute("onclick") === `toggleKey('${id}')`);

const current =
row.textContent.includes("Hide");

await updateDoc(doc(db,"cbtTests",id),{

answerKeyPublished:!current

});

};
</script>

</body>
  </html>
