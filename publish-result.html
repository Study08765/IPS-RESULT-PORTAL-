<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#071a3d">

<title>Publish Results | CBT Admin</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,
body{
width:100%;
min-height:100%;
}

body{

padding:14px;

color:#172554;

background:

radial-gradient(
circle at 0% 0%,
rgba(37,99,235,.13),
transparent 28%
),

radial-gradient(
circle at 100% 15%,
rgba(16,185,129,.08),
transparent 25%
),

linear-gradient(
180deg,
#f7faff 0%,
#eef5ff 100%
);

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

width:100%;

max-width:1180px;

margin:auto;

}


/* =====================================================
   PREMIUM HEADER
===================================================== */

.page-header{

position:relative;

overflow:hidden;

display:flex;

align-items:center;

gap:15px;

padding:18px 20px;

margin-bottom:14px;

border-radius:20px;

background:

linear-gradient(
135deg,
#061536 0%,
#0b327d 50%,
#1261d6 100%
);

color:#fff;

border:
1px solid
rgba(255,255,255,.15);

box-shadow:

0 15px 35px
rgba(7,34,91,.22);

}


/* Golden line */

.page-header::before{

content:"";

position:absolute;

top:0;
left:50%;

transform:translateX(-50%);

width:150px;
height:3px;

border-radius:
0 0 10px 10px;

background:#fbbf24;

box-shadow:
0 0 14px
rgba(251,191,36,.7);

}


/* Decorative circle */

.page-header::after{

content:"";

position:absolute;

width:180px;
height:180px;

right:-90px;
top:-100px;

border-radius:50%;

background:
rgba(255,255,255,.07);

}


/* Icon */

.header-icon{

position:relative;

z-index:2;

width:52px;
height:52px;

flex-shrink:0;

display:flex;

align-items:center;

justify-content:center;

border-radius:15px;

font-size:26px;

background:
rgba(255,255,255,.13);

border:
1px solid
rgba(255,255,255,.20);

box-shadow:
inset 0 1px 2px
rgba(255,255,255,.18);

}


/* Header text */

.header-text{

position:relative;

z-index:2;

}

.page-header h1{

font-size:22px;

font-weight:900;

line-height:1.2;

color:#fff;

}

.page-header p{

margin-top:3px;

font-size:10px;

font-weight:500;

color:#dbeafe;

}


/* =====================================================
   STATS
===================================================== */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:10px;

margin-bottom:15px;

}


.stat-card{

position:relative;

overflow:hidden;

min-height:100px;

padding:15px 14px;

border-radius:17px;

color:#fff;

box-shadow:
0 9px 22px
rgba(15,23,42,.12);

border:
1px solid
rgba(255,255,255,.22);

transition:.25s;

}

.stat-card:hover{

transform:
translateY(-3px);

box-shadow:
0 14px 28px
rgba(15,23,42,.16);

}


/* Circle */

.stat-card::after{

content:"";

position:absolute;

width:90px;
height:90px;

right:-30px;
top:-40px;

border-radius:50%;

background:
rgba(255,255,255,.11);

}


/* Bottom shine */

.stat-card::before{

content:"";

position:absolute;

left:15px;
bottom:0;

width:75px;
height:3px;

border-radius:5px 5px 0 0;

background:
rgba(255,255,255,.35);

}


/* Colors */

.stat-card:nth-child(1){

background:
linear-gradient(
135deg,
#2563eb,
#1e40af
);

}

.stat-card:nth-child(2){

background:
linear-gradient(
135deg,
#16a34a,
#047857
);

}

.stat-card:nth-child(3){

background:
linear-gradient(
135deg,
#d97706,
#b45309
);

}

.stat-card:nth-child(4){

background:
linear-gradient(
135deg,
#dc2626,
#991b1b
);

}


.stat-icon{

position:relative;

z-index:2;

font-size:17px;

margin-bottom:5px;

}

.stat-card h2{

position:relative;

z-index:2;

font-size:27px;

font-weight:900;

line-height:1;

}

.stat-card p{

position:relative;

z-index:2;

margin-top:6px;

font-size:9px;

font-weight:700;

opacity:.92;

}


/* =====================================================
   SECTION BAR
===================================================== */

.section-heading{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

margin:
3px
2px
9px;

}


.section-left{

display:flex;

align-items:center;

gap:8px;

}


.section-icon{

width:34px;
height:34px;

display:flex;

align-items:center;

justify-content:center;

border-radius:10px;

background:#fff;

border:
1px solid
#dbe5f2;

box-shadow:
0 4px 10px
rgba(15,23,42,.06);

font-size:17px;

}


.section-heading h2{

font-size:16px;

font-weight:900;

color:#172554;

}


/* LIVE */

.live-badge{

display:flex;

align-items:center;

gap:6px;

padding:
6px
10px;

border-radius:30px;

background:#ecfdf5;

border:
1px solid
#bbf7d0;

color:#15803d;

font-size:8px;

font-weight:900;

letter-spacing:.5px;

}


.live-dot{

width:7px;
height:7px;

border-radius:50%;

background:#22c55e;

box-shadow:
0 0 0 4px
rgba(34,197,94,.12);

animation:
livePulse 1.7s infinite;

}

@keyframes livePulse{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.35);
}

}


/* =====================================================
   TABLE CARD
===================================================== */

.table-wrapper{

width:100%;

overflow-x:auto;

border-radius:18px;

background:#fff;

border:
1px solid
#e1e8f2;

box-shadow:
0 12px 30px
rgba(15,23,42,.09);

-webkit-overflow-scrolling:touch;

}


/* top premium line */

.table-top-line{

height:3px;

background:

linear-gradient(
90deg,
#fbbf24,
#2563eb,
#16a34a
);

}


/* =====================================================
   TABLE
===================================================== */

table{

width:100%;

min-width:780px;

border-collapse:separate;

border-spacing:0;

background:#fff;

}


th{

padding:
13px
10px;

background:

linear-gradient(
135deg,
#071a3d,
#0b4bb3
);

color:#fff;

font-size:10px;

font-weight:800;

letter-spacing:.4px;

text-align:center;

white-space:nowrap;

}


td{

padding:
12px
9px;

border-bottom:
1px solid
#edf2f7;

font-size:10px;

font-weight:500;

color:#475569;

text-align:center;

}


tbody tr{

transition:.2s;

}

tbody tr:hover{

background:#f7faff;

}

tbody tr:last-child td{

border-bottom:none;

}


/* Test name */

.test-name{

font-weight:800;

color:#123b83;

line-height:1.35;

}


/* =====================================================
   STATUS
===================================================== */

.status{

display:inline-flex;

align-items:center;

justify-content:center;

padding:
5px
9px;

border-radius:30px;

font-size:8px;

font-weight:800;

white-space:nowrap;

}


.status-published{

background:#ecfdf5;

color:#15803d;

border:
1px solid
#bbf7d0;

}


.status-hidden{

background:#fef2f2;

color:#dc2626;

border:
1px solid
#fecaca;

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.action-btn{

display:inline-flex;

align-items:center;

justify-content:center;

padding:
7px
10px;

margin:2px;

border:none;

border-radius:8px;

color:#fff;

font-size:8px;

font-weight:800;

cursor:pointer;

white-space:nowrap;

box-shadow:
0 4px 9px
rgba(15,23,42,.14);

transition:.18s;

}


.action-btn:hover{

transform:
translateY(-2px);

box-shadow:
0 7px 14px
rgba(15,23,42,.20);

}


.action-btn:active{

transform:
scale(.96);

}


.action-btn:disabled{

opacity:.55;

cursor:wait;

transform:none;

}


/* Result */

.result-btn{

background:
linear-gradient(
135deg,
#16a34a,
#047857
);

}


/* Answer Key */

.key-btn{

background:
linear-gradient(
135deg,
#f59e0b,
#b45309
);

}


/* =====================================================
   MOBILE HINT
===================================================== */

.swipe-hint{

display:none;

margin:
0
3px
6px;

font-size:9px;

font-weight:600;

color:#64748b;

text-align:right;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-state{

padding:35px 20px;

text-align:center;

}

.empty-icon{

font-size:38px;

margin-bottom:7px;

}

.empty-state h3{

font-size:15px;

font-weight:800;

color:#172554;

}

.empty-state p{

margin-top:4px;

font-size:10px;

color:#64748b;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

body{

padding:8px;

}


.page-header{

padding:
16px
14px;

margin-bottom:10px;

border-radius:16px;

gap:10px;

}


.header-icon{

width:45px;
height:45px;

border-radius:13px;

font-size:22px;

}


.page-header h1{

font-size:18px;

}


.page-header p{

font-size:8px;

}


.stats{

grid-template-columns:
repeat(2,1fr);

gap:7px;

margin-bottom:11px;

}


.stat-card{

min-height:83px;

padding:
11px
10px;

border-radius:13px;

}


.stat-icon{

font-size:14px;

margin-bottom:4px;

}


.stat-card h2{

font-size:22px;

}


.stat-card p{

margin-top:4px;

font-size:7px;

}


.section-heading{

margin-bottom:6px;

}


.section-icon{

width:29px;
height:29px;

font-size:14px;

border-radius:8px;

}


.section-heading h2{

font-size:14px;

}


.live-badge{

padding:
5px
8px;

font-size:7px;

}


.live-dot{

width:6px;
height:6px;

}


.swipe-hint{

display:block;

}


.table-wrapper{

border-radius:14px;

}


th{

padding:
11px
8px;

font-size:8px;

}


td{

padding:
10px
8px;

font-size:8px;

}


.status{

padding:
5px
7px;

font-size:7px;

}


.action-btn{

padding:
6px
8px;

font-size:7px;

border-radius:7px;

}

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:360px){

body{

padding:6px;

}


.page-header{

padding:
14px
11px;

}


.header-icon{

width:41px;
height:41px;

font-size:20px;

}


.page-header h1{

font-size:16px;

}


.page-header p{

font-size:7px;

}


.stat-card{

min-height:78px;

padding:
10px
8px;

}


.stat-card h2{

font-size:20px;

}


.stat-card p{

font-size:6.5px;

}


.section-heading h2{

font-size:13px;

}

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
   HEADER
===================================================== -->

<div class="page-header">

<div class="header-icon">
🏆
</div>

<div class="header-text">

<h1>
Publish Results
</h1>

<p>
Manage CBT Results &amp; Answer Keys
</p>

</div>

</div>


<!-- =====================================================
   STATISTICS
===================================================== -->

<div class="stats">


<div class="stat-card">

<div class="stat-icon">
📚
</div>

<h2 id="totalTests">
0
</h2>

<p>
TOTAL TESTS
</p>

</div>


<div class="stat-card">

<div class="stat-icon">
🏆
</div>

<h2 id="publishedResults">
0
</h2>

<p>
PUBLISHED RESULTS
</p>

</div>


<div class="stat-card">

<div class="stat-icon">
📘
</div>

<h2 id="publishedKeys">
0
</h2>

<p>
PUBLISHED KEYS
</p>

</div>


<div class="stat-card">

<div class="stat-icon">
🔒
</div>

<h2 id="hiddenResults">
0
</h2>

<p>
HIDDEN RESULTS
</p>

</div>


</div>


<!-- =====================================================
   SECTION
===================================================== -->

<div class="section-heading">

<div class="section-left">

<div class="section-icon">
📋
</div>

<h2>
CBT Test Management
</h2>

</div>


<div class="live-badge">

<span class="live-dot"></span>

LIVE

</div>

</div>


<div class="swipe-hint">

👈 Swipe table to view actions 👉

</div>


<!-- =====================================================
   TABLE
===================================================== -->

<div class="table-wrapper">

<div class="table-top-line"></div>

<table>

<thead>

<tr>

<th>
TEST
</th>

<th>
CLASS
</th>

<th>
SUBJECT
</th>

<th>
RESULT
</th>

<th>
ANSWER KEY
</th>

<th>
ACTION
</th>

</tr>

</thead>


<tbody id="testList">

<tr>

<td colspan="6">

<div class="empty-state">

<div class="empty-icon">
⏳
</div>

<h3>
Loading CBT Tests...
</h3>

<p>
Please wait...
</p>

</div>

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script type="module">

import { db }
from "./firebase.js";


import {

collection,
onSnapshot,
doc,
updateDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const list =
document.getElementById(
"testList"
);


/* =====================================================
   LIVE TEST LIST
===================================================== */

onSnapshot(

collection(
db,
"cbtTests"
),

(snapshot)=>{


list.innerHTML = "";


let total = 0;

let published = 0;

let keys = 0;


/* EMPTY */

if(snapshot.empty){

list.innerHTML = `

<tr>

<td colspan="6">

<div class="empty-state">

<div class="empty-icon">
📚
</div>

<h3>
No CBT Tests Found
</h3>

<p>
Create a CBT test first.
</p>

</div>

</td>

</tr>

`;

document.getElementById(
"totalTests"
).textContent = "0";

document.getElementById(
"publishedResults"
).textContent = "0";

document.getElementById(
"publishedKeys"
).textContent = "0";

document.getElementById(
"hiddenResults"
).textContent = "0";

return;

}


/* =====================================================
   BUILD TABLE
===================================================== */

snapshot.forEach(
(document)=>{


const x =
document.data();


total++;


if(
x.resultPublished === true
){

published++;

}


if(
x.answerKeyPublished === true
){

keys++;

}


list.innerHTML += `

<tr>


<td>

<div class="test-name">

${escapeHTML(
x.testName || "-"
)}

</div>

</td>


<td>

${escapeHTML(
x.className || "-"
)}

</td>


<td>

${escapeHTML(
x.subject || "-"
)}

</td>


<td>

<span class="status ${
x.resultPublished === true
? "status-published"
: "status-hidden"
}">

${
x.resultPublished === true
? "✓ Published"
: "● Hidden"
}

</span>

</td>


<td>

<span class="status ${
x.answerKeyPublished === true
? "status-published"
: "status-hidden"
}">

${
x.answerKeyPublished === true
? "✓ Published"
: "● Hidden"
}

</span>

</td>


<td>


<button

class="action-btn result-btn"

onclick="toggleResult('${document.id}')">

${
x.resultPublished === true
? "🔴 Hide Result"
: "🟢 Publish Result"
}

</button>


<button

class="action-btn key-btn"

onclick="toggleKey('${document.id}')">

${
x.answerKeyPublished === true
? "🔒 Hide Key"
: "🔑 Publish Key"
}

</button>


</td>


</tr>

`;

});


/* =====================================================
   STATS
===================================================== */

document.getElementById(
"totalTests"
).textContent =
total;


document.getElementById(
"publishedResults"
).textContent =
published;


document.getElementById(
"publishedKeys"
).textContent =
keys;


document.getElementById(
"hiddenResults"
).textContent =
total - published;


},

(error)=>{

console.error(
"Firebase Error:",
error
);

list.innerHTML = `

<tr>

<td colspan="6">

<div class="empty-state">

<div class="empty-icon">
⚠️
</div>

<h3>
Unable to Load Tests
</h3>

<p>
Please check your connection.
</p>

</div>

</td>

</tr>

`;

});


/* =====================================================
   RESULT TOGGLE
===================================================== */

window.toggleResult =
async function(id){


const button =
[
...document.querySelectorAll(
".result-btn"
)

].find(

btn =>
btn.getAttribute("onclick") ===
`toggleResult('${id}')`

);


if(!button)
return;


const current =
button.textContent
.includes("Hide Result");


button.disabled = true;

const oldHTML =
button.innerHTML;

button.innerHTML =
"⏳ Updating...";


try{

await updateDoc(

doc(
db,
"cbtTests",
id
),

{

resultPublished:
!current

}

);

}

catch(error){

console.error(error);

alert(
"Unable to update Result."
);

button.disabled = false;

button.innerHTML =
oldHTML;

}

};


/* =====================================================
   ANSWER KEY TOGGLE
===================================================== */

window.toggleKey =
async function(id){


const button =
[
...document.querySelectorAll(
".key-btn"
)

].find(

btn =>
btn.getAttribute("onclick") ===
`toggleKey('${id}')`

);


if(!button)
return;


const current =
button.textContent
.includes("Hide Key");


button.disabled = true;

const oldHTML =
button.innerHTML;

button.innerHTML =
"⏳ Updating...";


try{

await updateDoc(

doc(
db,
"cbtTests",
id
),

{

answerKeyPublished:
!current

}

);

}

catch(error){

console.error(error);

alert(
"Unable to update Answer Key."
);

button.disabled = false;

button.innerHTML =
oldHTML;

}

};


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>


</body>

  </html>
