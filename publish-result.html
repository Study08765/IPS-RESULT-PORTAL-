<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publish Results | CBT Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

min-height:100vh;

padding:20px;

color:#172554;

background:

radial-gradient(
circle at 5% 5%,
rgba(37,99,235,.12),
transparent 28%
),

radial-gradient(
circle at 95% 15%,
rgba(16,185,129,.10),
transparent 28%
),

linear-gradient(
135deg,
#f8fbff 0%,
#eef4ff 50%,
#f6fbff 100%
);

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

width:100%;

max-width:1250px;

margin:auto;

}


/* =====================================================
   PREMIUM HEADER
===================================================== */

.page-header{

position:relative;

overflow:hidden;

display:flex;

align-items:center;

gap:18px;

padding:25px 28px;

margin-bottom:22px;

border-radius:24px;

color:#fff;

background:

linear-gradient(
135deg,
#03154d 0%,
#0646b5 52%,
#087cf0 100%
);

border:
1px solid
rgba(255,255,255,.18);

box-shadow:

0 18px 42px
rgba(3,21,77,.24);

}


/* Golden top line */

.page-header::before{

content:"";

position:absolute;

top:0;
left:50%;

transform:translateX(-50%);

width:220px;
height:4px;

border-radius:
0 0 15px 15px;

background:#fbbf24;

box-shadow:
0 0 15px
rgba(251,191,36,.65);

}


/* Decorative circle */

.page-header::after{

content:"";

position:absolute;

width:210px;
height:210px;

right:-90px;
top:-110px;

border-radius:50%;

background:
rgba(255,255,255,.07);

}


/* Header icon */

.header-icon{

position:relative;

z-index:2;

width:62px;
height:62px;

flex-shrink:0;

display:flex;

align-items:center;
justify-content:center;

border-radius:18px;

font-size:31px;

background:
rgba(255,255,255,.14);

border:
1px solid
rgba(255,255,255,.22);

box-shadow:

inset
0 1px 2px
rgba(255,255,255,.25),

0 8px 20px
rgba(0,0,0,.12);

}


/* Header text */

.header-text{

position:relative;

z-index:2;

}

.page-header h1{

margin:0;

font-size:28px;

font-weight:900;

letter-spacing:.3px;

color:#fff;

}

.page-header p{

margin-top:5px;

font-size:12px;

font-weight:500;

color:#dbeafe;

}


/* =====================================================
   STATS
===================================================== */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:16px;

margin-bottom:24px;

}


/* Stat card */

.stat-card{

position:relative;

overflow:hidden;

min-height:125px;

padding:20px;

border-radius:20px;

color:#fff;

border:
1px solid
rgba(255,255,255,.25);

box-shadow:

0 12px 28px
rgba(15,23,42,.13);

transition:
transform .25s ease,
box-shadow .25s ease;

}

.stat-card:hover{

transform:
translateY(-4px);

box-shadow:

0 18px 35px
rgba(15,23,42,.17);

}


/* Decorative circle */

.stat-card::after{

content:"";

position:absolute;

width:105px;
height:105px;

right:-30px;
top:-42px;

border-radius:50%;

background:
rgba(255,255,255,.11);

}


/* Decorative bottom shine */

.stat-card::before{

content:"";

position:absolute;

width:130px;
height:5px;

left:20px;
bottom:0;

border-radius:
8px 8px 0 0;

background:
rgba(255,255,255,.22);

}


/* Different colors */

.stat-card:nth-child(1){

background:
linear-gradient(
135deg,
#2563eb,
#1e40af
);

}

.stat-card:nth-child(2){

background:
linear-gradient(
135deg,
#16a34a,
#047857
);

}

.stat-card:nth-child(3){

background:
linear-gradient(
135deg,
#d97706,
#b45309
);

}

.stat-card:nth-child(4){

background:
linear-gradient(
135deg,
#ef4444,
#b91c1c
);

}


.stat-icon{

position:relative;

z-index:2;

font-size:22px;

margin-bottom:8px;

}

.stat-card h2{

position:relative;

z-index:2;

font-size:34px;

font-weight:900;

line-height:1;

margin-bottom:8px;

}

.stat-card p{

position:relative;

z-index:2;

font-size:11px;

font-weight:700;

opacity:.92;

letter-spacing:.3px;

}


/* =====================================================
   MANAGEMENT HEADER
===================================================== */

.section-heading{

display:flex;

align-items:center;

justify-content:space-between;

gap:12px;

margin:
5px
3px
12px;

}

.section-heading h2{

font-size:20px;

font-weight:900;

color:#172554;

}


/* Live badge */

.live-badge{

display:inline-flex;

align-items:center;

gap:7px;

padding:
7px
12px;

border-radius:50px;

background:#ecfdf5;

color:#15803d;

border:
1px solid
#bbf7d0;

font-size:10px;

font-weight:800;

letter-spacing:.5px;

}

.live-dot{

width:8px;
height:8px;

border-radius:50%;

background:#22c55e;

box-shadow:
0 0 0 4px
rgba(34,197,94,.13);

animation:
livePulse 1.7s
ease-in-out
infinite;

}

@keyframes livePulse{

0%,100%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.35);
opacity:.65;
}

}


/* =====================================================
   TABLE CARD
===================================================== */

.table-wrapper{

width:100%;

overflow-x:auto;

border-radius:22px;

background:#fff;

border:
1px solid
#e2e8f0;

box-shadow:

0 18px 42px
rgba(15,23,42,.10);

-webkit-overflow-scrolling:touch;

}


/* Top golden line */

.table-wrapper::before{

content:"";

display:block;

height:3px;

background:
linear-gradient(
90deg,
#fbbf24,
#2563eb,
#16a34a
);

}


/* =====================================================
   TABLE
===================================================== */

table{

width:100%;

min-width:900px;

border-collapse:separate;

border-spacing:0;

background:#fff;

}

th{

padding:
17px
13px;

border:none;

background:
linear-gradient(
135deg,
#03154d,
#0646b5
);

color:#fff;

font-size:12px;

font-weight:800;

letter-spacing:.4px;

text-align:center;

white-space:nowrap;

}

th:first-child{

border-top-left-radius:0;

}

th:last-child{

border-top-right-radius:0;

}


td{

padding:
15px
13px;

border:none;

border-bottom:
1px solid
#edf2f7;

text-align:center;

font-size:12px;

font-weight:500;

color:#334155;

}

tbody tr{

transition:
background .2s ease,
transform .2s ease;

}

tbody tr:hover{

background:#f7faff;

}

tbody tr:last-child td{

border-bottom:none;

}


/* =====================================================
   TEST NAME
===================================================== */

.test-name{

font-weight:800;

color:#123b83;

}


/* =====================================================
   STATUS
===================================================== */

.status{

display:inline-flex;

align-items:center;

justify-content:center;

gap:5px;

padding:
7px
12px;

border-radius:50px;

font-size:10px;

font-weight:800;

white-space:nowrap;

}

.status-published{

background:#ecfdf5;

color:#15803d;

border:
1px solid
#bbf7d0;

}

.status-hidden{

background:#fef2f2;

color:#dc2626;

border:
1px solid
#fecaca;

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.action-btn{

position:relative;

padding:
9px
13px;

border:none;

border-radius:10px;

font-size:10px;

font-weight:800;

cursor:pointer;

margin:3px;

transition:
transform .18s ease,
box-shadow .18s ease,
opacity .18s ease;

color:#fff;

white-space:nowrap;

box-shadow:
0 5px 12px
rgba(15,23,42,.14);

}

.action-btn:hover{

transform:
translateY(-2px);

box-shadow:
0 8px 17px
rgba(15,23,42,.20);

}

.action-btn:active{

transform:
translateY(2px);

}

.action-btn:disabled{

opacity:.55;

cursor:wait;

transform:none;

}


/* Result button */

.result-btn{

background:
linear-gradient(
135deg,
#16a34a,
#047857
);

}


/* Answer key button */

.key-btn{

background:
linear-gradient(
135deg,
#d97706,
#b45309
);

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state{

padding:
45px
20px;

text-align:center;

color:#64748b;

}

.empty-icon{

font-size:45px;

margin-bottom:10px;

}

.empty-state h3{

font-size:17px;

color:#172554;

margin-bottom:5px;

}

.empty-state p{

font-size:11px;

}


/* =====================================================
   SWIPE HINT
===================================================== */

.swipe-hint{

display:none;

margin:
0
5px
8px;

text-align:right;

color:#64748b;

font-size:10px;

font-weight:600;

}


/* =====================================================
   LOADING
===================================================== */

.loading-row{

padding:
40px;

text-align:center;

color:#64748b;

font-size:12px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:750px){

body{

padding:10px;

}

.page-header{

padding:
20px
17px;

border-radius:19px;

gap:12px;

}

.header-icon{

width:52px;
height:52px;

font-size:25px;

border-radius:15px;

}

.page-header h1{

font-size:21px;

}

.page-header p{

font-size:10px;

}

.stats{

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-bottom:19px;

}

.stat-card{

min-height:110px;

padding:
16px
13px;

border-radius:16px;

}

.stat-icon{

font-size:18px;

margin-bottom:6px;

}

.stat-card h2{

font-size:26px;

}

.stat-card p{

font-size:9px;

}

.section-heading{

margin-bottom:9px;

}

.section-heading h2{

font-size:16px;

}

.live-badge{

padding:
6px
9px;

font-size:8px;

}

.swipe-hint{

display:block;

}

.table-wrapper{

border-radius:17px;

}

th{

font-size:10px;

padding:
13px
9px;

}

td{

font-size:10px;

padding:
12px
9px;

}

.status{

font-size:9px;

padding:
6px
9px;

}

.action-btn{

font-size:9px;

padding:
8px
10px;

}

}


/* =====================================================
   EXTRA SMALL
===================================================== */

@media(max-width:380px){

body{

padding:8px;

}

.page-header{

padding:
17px
14px;

}

.header-icon{

width:47px;
height:47px;

font-size:22px;

}

.page-header h1{

font-size:18px;

}

.stats{

gap:8px;

}

.stat-card{

padding:
14px
9px;

}

.stat-card h2{

font-size:23px;

}

.stat-card p{

font-size:8px;

}

.section-heading h2{

font-size:15px;

}

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
   PREMIUM HEADER
===================================================== -->

<div class="page-header">

<div class="header-icon">
🏆
</div>

<div class="header-text">

<h1>
Publish Results
</h1>

<p>
Manage CBT Results &amp; Answer Keys
</p>

</div>

</div>


<!-- =====================================================
   STATISTICS
===================================================== -->

<div class="stats">


<div class="stat-card">

<div class="stat-icon">
📚
</div>

<h2 id="totalTests">
0
</h2>

<p>
TOTAL CBT TESTS
</p>

</div>


<div class="stat-card">

<div class="stat-icon">
🏆
</div>

<h2 id="publishedResults">
0
</h2>

<p>
PUBLISHED RESULTS
</p>

</div>


<div class="stat-card">

<div class="stat-icon">
📘
</div>

<h2 id="publishedKeys">
0
</h2>

<p>
PUBLISHED ANSWER KEYS
</p>

</div>


<div class="stat-card">

<div class="stat-icon">
🔒
</div>

<h2 id="hiddenResults">
0
</h2>

<p>
HIDDEN RESULTS
</p>

</div>


</div>


<!-- =====================================================
   SECTION HEADING
===================================================== -->

<div class="section-heading">

<h2>
CBT Test Management
</h2>

<div class="live-badge">

<span class="live-dot"></span>

LIVE

</div>

</div>


<div class="swipe-hint">

👈 Swipe table to view actions 👉

</div>


<!-- =====================================================
   TABLE
===================================================== -->

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>
TEST
</th>

<th>
CLASS
</th>

<th>
SUBJECT
</th>

<th>
RESULT
</th>

<th>
ANSWER KEY
</th>

<th>
ACTION
</th>

</tr>

</thead>


<tbody id="testList">

<tr>

<td colspan="6">

<div class="loading-row">

⏳ Loading CBT Tests...

</div>

</td>

</tr>

</tbody>

</table>

</div>


</div>


<!-- =====================================================
   FIREBASE
===================================================== -->

<script type="module">

import { db }
from "./firebase.js";


import {

collection,
onSnapshot,
doc,
updateDoc

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const list =
document.getElementById(
"testList"
);


/* =====================================================
   LIVE CBT TEST LIST
===================================================== */

onSnapshot(

collection(
db,
"cbtTests"
),

(snapshot)=>{


list.innerHTML = "";


let total = 0;

let published = 0;

let keys = 0;


if(snapshot.empty){

list.innerHTML = `

<tr>

<td colspan="6">

<div class="empty-state">

<div class="empty-icon">
📚
</div>

<h3>
No CBT Tests Found
</h3>

<p>
Create a CBT test first to manage its result and answer key.
</p>

</div>

</td>

</tr>

`;

document.getElementById(
"totalTests"
).textContent = 0;

document.getElementById(
"publishedResults"
).textContent = 0;

document.getElementById(
"publishedKeys"
).textContent = 0;

document.getElementById(
"hiddenResults"
).textContent = 0;

return;

}


/* =====================================================
   BUILD ROWS
===================================================== */

snapshot.forEach(
(document)=>{


const x =
document.data();


total++;


if(
x.resultPublished === true
){

published++;

}


if(
x.answerKeyPublished === true
){

keys++;

}


/* =====================================================
   TABLE ROW
===================================================== */

list.innerHTML += `

<tr>


<td>

<div class="test-name">

${escapeHTML(
x.testName || "-"
)}

</div>

</td>


<td>

${escapeHTML(
x.className || "-"
)}

</td>


<td>

${escapeHTML(
x.subject || "-"
)}

</td>


<td>

<span class="status ${
x.resultPublished === true
? "status-published"
: "status-hidden"
}">

${
x.resultPublished === true
? "✓ Published"
: "● Hidden"
}

</span>

</td>


<td>

<span class="status ${
x.answerKeyPublished === true
? "status-published"
: "status-hidden"
}">

${
x.answerKeyPublished === true
? "✓ Published"
: "● Hidden"
}

</span>

</td>


<td>


<button

class="action-btn result-btn"

onclick="toggleResult('${document.id}')">

${
x.resultPublished === true
? "🔴 Hide Result"
: "🟢 Publish Result"
}

</button>


<button

class="action-btn key-btn"

onclick="toggleKey('${document.id}')">

${
x.answerKeyPublished === true
? "🔒 Hide Key"
: "🔑 Publish Key"
}

</button>


</td>


</tr>

`;

});


/* =====================================================
   UPDATE STATS
===================================================== */

document.getElementById(
"totalTests"
).textContent =
total;


document.getElementById(
"publishedResults"
).textContent =
published;


document.getElementById(
"publishedKeys"
).textContent =
keys;


document.getElementById(
"hiddenResults"
).textContent =
total - published;


},
(error)=>{

console.error(
"CBT Test Listener Error:",
error
);


list.innerHTML = `

<tr>

<td colspan="6">

<div class="empty-state">

<div class="empty-icon">
⚠️
</div>

<h3>
Unable to Load Tests
</h3>

<p>
Please check your internet connection and Firebase configuration.
</p>

</div>

</td>

</tr>

`;

});


/* =====================================================
   PUBLISH / HIDE RESULT
===================================================== */

window.toggleResult =
async function(id){


const button =
[
...document.querySelectorAll(
".result-btn"
)

].find(

btn =>
btn.getAttribute(
"onclick"
) ===
`toggleResult('${id}')`

);


if(!button)
return;


const current =
button.textContent
.includes(
"Hide Result"
);


button.disabled = true;

const oldText =
button.innerHTML;

button.innerHTML =
"⏳ Updating...";


try{


await updateDoc(

doc(
db,
"cbtTests",
id
),

{

resultPublished:
!current

}

);


}
catch(error){


console.error(error);


alert(
"Unable to update Result. Please try again."
);


button.disabled = false;

button.innerHTML =
oldText;

}

};


/* =====================================================
   PUBLISH / HIDE ANSWER KEY
===================================================== */

window.toggleKey =
async function(id){


const button =
[
...document.querySelectorAll(
".key-btn"
)

].find(

btn =>
btn.getAttribute(
"onclick"
) ===
`toggleKey('${id}')`

);


if(!button)
return;


const current =
button.textContent
.includes(
"Hide Key"
);


button.disabled = true;

const oldText =
button.innerHTML;

button.innerHTML =
"⏳ Updating...";


try{


await updateDoc(

doc(
db,
"cbtTests",
id
),

{

answerKeyPublished:
!current

}

);


}
catch(error){


console.error(error);


alert(
"Unable to update Answer Key. Please try again."
);


button.disabled = false;

button.innerHTML =
oldText;

}

};


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>


</body>

  </html>
