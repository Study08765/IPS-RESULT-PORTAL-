<script type="module">

import { db }
from "./firebase.js";

import {

collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
serverTimestamp,
getDocs,
query,
where,
writeBatch,
setDoc,
getDoc

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const saveBtn =
document.getElementById("saveBtn");

const list =
document.getElementById("testList");

const statusBox =
document.getElementById("statusBox");

const pinModal =
document.getElementById("pinModal");

const pinList =
document.getElementById("pinList");

const pinModalTitle =
document.getElementById("pinModalTitle");


let currentExam = {
id:"",
code:"",
name:"",
className:"",
subject:"",
start:"",
end:""
};


let currentPins = [];


/* =========================================
   STATUS
========================================= */

function showStatus(message,type="success"){

statusBox.textContent =
message;

statusBox.className =
"statusBox " + type;

statusBox.style.display =
"block";

setTimeout(()=>{

statusBox.style.display =
"none";

},6000);

}


/* =========================================
   ESCAPE
========================================= */

function esc(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

});

}


/* =========================================
   RANDOM 4 DIGIT PIN
========================================= */

function generatePin(){

return String(
Math.floor(
1000 +
Math.random()*9000
)
);

}


/* =========================================
   GET ALL APPROVED STUDENTS

   IMPORTANT:
   CLASS IS NOT USED FOR PIN FILTERING
========================================= */

async function getAllStudents(){

const studentsMap =
new Map();


/* OLD STUDENTS */

try{

const oldSnap =
await getDocs(
collection(
db,
"students_v2"
)
);

oldSnap.forEach((d)=>{

const x=d.data();

const roll =
String(
x.Roll || ""
)
.trim()
.toUpperCase();

if(!roll)
return;

studentsMap.set(
roll,
{
roll:roll,
name:x.Name || "",
className:x.Class || ""
}
);

});

}
catch(error){

console.error(
"students_v2 error:",
error
);

}


/* NEW REGISTERED STUDENTS */

try{

const newSnap =
await getDocs(
collection(
db,
"subscriptionStudents"
)
);

newSnap.forEach((d)=>{

const x=d.data();

const roll =
String(
x.roll || ""
)
.trim()
.toUpperCase();

if(!roll)
return;


/*
   ONLY APPROVED / ENABLED STUDENTS
*/

const approved =
x.status === "approved" ||
x.status === "Approved" ||
x.status === "APPROVED" ||
x.enabled === true;

if(!approved)
return;


/*
   NEW STUDENT DATA HAS PRIORITY
*/

studentsMap.set(
roll,
{
roll:roll,
name:x.name || "",
className:x.className || ""
}
);

});

}
catch(error){

console.error(
"subscriptionStudents error:",
error
);

}


const students =
Array.from(
studentsMap.values()
);


students.sort(
(a,b)=>
a.roll.localeCompare(
b.roll,
undefined,
{
numeric:true
}
)
);


return students;

}


/* =========================================
   GENERATE EXAM PINS
========================================= */

async function generateExamPins(
examId,
examCode
){

const students =
await getAllStudents();


if(!students.length){

return 0;

}


const usedPins =
new Set();

let count=0;

const chunkSize=400;


for(
let start=0;
start<students.length;
start+=chunkSize
){

const chunk =
students.slice(
start,
start+chunkSize
);

const batch =
writeBatch(db);


for(
const student of chunk
){

let pin;

do{

pin =
generatePin();

}
while(
usedPins.has(pin)
);

usedPins.add(pin);


const pinRef =
doc(
db,
"cbtExamPins",
examId +
"_" +
student.roll
);


batch.set(
pinRef,
{

examId:examId,

examCode:examCode,

studentRoll:
student.roll,

studentName:
student.name,

studentClass:
student.className,

pin:pin,

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}
);

count++;

}


await batch.commit();

}


return count;

}


/* =========================================
   CREATE TEST
========================================= */

saveBtn.onclick =
async()=>{

const data={

testName:
document.getElementById(
"testName"
).value.trim(),

className:
document.getElementById(
"class"
).value,

subject:
document.getElementById(
"subject"
).value,

examCode:
document.getElementById(
"examCode"
).value.trim(),

duration:
document.getElementById(
"duration"
).value,

questions:
document.getElementById(
"questions"
).value,

marks:
document.getElementById(
"marks"
).value,

start:
document.getElementById(
"start"
).value,

end:
document.getElementById(
"end"
).value,

status:
document.getElementById(
"status"
).value,

isLive:false,

resultPublished:false,

answerKeyPublished:false,

pinSystem:true,

createdAt:
serverTimestamp()

};


/* VALIDATION */

if(data.testName===""){

alert("Enter Test Name");
return;

}

if(data.className==="Select Class"){

alert("Select Class");
return;

}

if(data.subject==="Select Subject"){

alert("Select Subject");
return;

}

if(data.examCode===""){

alert("Enter Exam Code");
return;

}

if(data.duration===""){

alert("Enter Duration");
return;

}

if(data.questions===""){

alert("Enter Total Questions");
return;

}

if(data.marks===""){

alert("Enter Total Marks");
return;

}

if(
data.start==="" ||
data.end===""
){

alert("Start और End Date दोनों भरें।");
return;

}


try{

saveBtn.disabled=true;

saveBtn.innerHTML =
'<i class="fa-solid fa-spinner fa-spin"></i> CREATING TEST...';


/* CREATE TEST */

const examRef =
await addDoc(
collection(
db,
"cbtTests"
),
data
);


/* GENERATE PINS */

saveBtn.innerHTML =
'<i class="fa-solid fa-key"></i> GENERATING STUDENT PINS...';


const pinCount =
await generateExamPins(
examRef.id,
data.examCode
);


/* SAVE PIN INFORMATION */

await setDoc(

doc(
db,
"cbtTests",
examRef.id
),

{

pinSystem:true,

pinGenerated:true,

pinStudentCount:
pinCount,

pinGeneratedAt:
serverTimestamp()

},

{
merge:true
}

);


/* SUCCESS */

clearForm();

showStatus(

`Test Created Successfully. ${pinCount} student Exam PINs generated.`,

"success"

);

}
catch(error){

console.error(
"CREATE TEST ERROR:",
error
);

showStatus(
"Test create नहीं हुआ: " +
error.message,
"error"
);

}
finally{

saveBtn.disabled=false;

saveBtn.innerHTML =
'<i class="fa-solid fa-shield-halved"></i> CREATE TEST + GENERATE STUDENT PINS';

}

};


/* =========================================
   LOAD TESTS
========================================= */

onSnapshot(

collection(
db,
"cbtTests"
),

(snapshot)=>{

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=`

<tr>
<td colspan="6">
No Tests Found
</td>
</tr>

`;

return;

}


snapshot.forEach((d)=>{

const x=d.data();

list.innerHTML += `

<tr>

<td>
<b>${esc(x.testName)}</b>
</td>

<td>
${esc(x.className)}
</td>

<td>
${esc(x.subject)}
</td>

<td>
<b>${esc(x.examCode || "-")}</b>
</td>

<td>
${esc(x.status)}
</td>

<td>

<button
class="questionBtn"
onclick="openQuestions('${d.id}')">

<i class="fa-solid fa-list-check"></i>
Questions

</button>


<button
class="pinBtn"
onclick="viewPins('${d.id}')">

<i class="fa-solid fa-key"></i>
View PINs

</button>


<button
class="deleteBtn"
onclick="deleteTest('${d.id}','${esc(x.testName || "")}')">

<i class="fa-solid fa-trash"></i>
Delete

</button>

</td>

</tr>

`;

});

},

(error)=>{

console.error(error);

showStatus(
"Tests load नहीं हुए।",
"error"
);

}

);


/* =========================================
   VIEW PINS
========================================= */

window.viewPins =
async function(examId){

pinModal.style.display="block";

pinList.innerHTML=`

<tr>
<td colspan="5">

<div class="loadingText">

<i class="fa-solid fa-spinner fa-spin"></i>

Loading PINs...

</div>

</td>
</tr>

`;


try{

const examSnap =
await getDoc(
doc(
db,
"cbtTests",
examId
)
);

if(!examSnap.exists()){

alert("Exam not found.");
return;

}


const exam =
examSnap.data();


currentExam={

id:examId,

code:
exam.examCode || "",

name:
exam.testName || "CBT Examination",

className:
exam.className || "",

subject:
exam.subject || "",

start:
exam.start || "",

end:
exam.end || ""

};


pinModalTitle.innerHTML =
'<i class="fa-solid fa-key"></i> Exam PINs - ' +
esc(currentExam.code);


const snap =
await getDocs(

query(

collection(
db,
"cbtExamPins"
),

where(
"examId",
"==",
examId
)

)

);


pinList.innerHTML="";

currentPins=[];


if(snap.empty){

pinList.innerHTML=`

<tr>
<td colspan="5">

<div class="empty">

No PINs Found

</div>

</td>
</tr>

`;

return;

}


snap.forEach((d)=>{

currentPins.push({

id:d.id,
...d.data()

});

});


currentPins.sort(
(a,b)=>
String(a.studentRoll)
.localeCompare(
String(b.studentRoll),
undefined,
{
numeric:true
}
)
);


currentPins.forEach((x)=>{

pinList.innerHTML += `

<tr>

<td>
<b>${esc(x.studentRoll)}</b>
</td>

<td>
${esc(x.studentName || "-")}
</td>

<td>
${esc(x.studentClass || "-")}
</td>

<td>

<span class="pin-code">

${esc(x.pin)}

</span>

</td>

<td>

<button
class="actionBtn resetBtn"
onclick="resetPin('${esc(x.id)}','${esc(x.studentRoll)}','${esc(examId)}')">

<i class="fa-solid fa-rotate"></i>
Reset

</button>

</td>

</tr>

`;

});

}
catch(error){

console.error(
"VIEW PIN ERROR:",
error
);

pinList.innerHTML=`

<tr>
<td colspan="5">
Unable to load PINs.
</td>
</tr>

`;

}

};


/* =========================================
   RESET PIN
========================================= */

window.resetPin =
async function(
docId,
roll,
examId
){

const ok =
confirm(

`क्या ${roll} का Exam PIN Reset करना चाहते हैं?

पुराना PIN तुरंत काम करना बंद कर देगा।`

);

if(!ok)
return;


try{

const snap =
await getDocs(

query(

collection(
db,
"cbtExamPins"
),

where(
"examId",
"==",
examId
)

)

);


const existingPins =
new Set();


snap.forEach((d)=>{

if(
d.id !== docId &&
d.data().pin
){

existingPins.add(
String(
d.data().pin
)
);

}

});


let newPin;

do{

newPin=generatePin();

}
while(
existingPins.has(newPin)
);


await setDoc(

doc(
db,
"cbtExamPins",
docId
),

{

pin:newPin,

updatedAt:
serverTimestamp()

},

{
merge:true
}

);


alert(

`PIN Reset Successfully

Roll: ${roll}
New PIN: ${newPin}`

);


viewPins(examId);

}
catch(error){

alert(
"PIN reset नहीं हुआ:\n" +
error.message
);

}

};

"click",

/* =========================================
   DELETE TEST
========================================= */

window.deleteTest =
async function(
id,
testName
){

const confirmed =
confirm(

`⚠️ DELETE TEST

Test:
${testName || "Selected Test"}

/* =========================================
   AUTO EXAM CODE
========================================= */

function generateCode(){

const subject =
document.getElementById(
"subject"
).value;

const cls =
document.getElementById(
"class"
).value;


if(
subject==="Select Subject" ||
cls==="Select Class"
){

return;

}


const prefix =
subject
.substring(0,3)
.toUpperCase();


const classNo =
cls.replace(
"Class ",
""
);


const random =
Math.floor(
100+
Math.random()*900
);


document.getElementById(
"examCode"
).value =
prefix+
classNo+
random;

}


document.getElementById(
"subject"
).addEventListener(
"change",
generateCode
);


document.getElementById(
"class"
).addEventListener(
"change",
generateCode
);
