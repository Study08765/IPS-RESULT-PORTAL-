<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Test | THE STUDY POINT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
padding:25px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
padding:20px 25px;
border-radius:20px;
margin-bottom:25px;
border:1px solid rgba(255,255,255,.2);
}

.header h1{
color:#fff;
font-size:30px;
font-weight:700;
}

.header a{
text-decoration:none;
background:#facc15;
color:#111827;
padding:10px 18px;
border-radius:10px;
font-weight:600;
transition:.3s;
}

.header a:hover{
transform:translateY(-2px);
}

.form-box{
background:#fff;
border-radius:20px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
margin-bottom:25px;
}

.row{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
font-weight:600;
margin-bottom:8px;
color:#1e3a8a;
}

.input-group input,
.input-group select{
width:100%;
padding:14px;
border:2px solid #dbeafe;
border-radius:12px;
font-size:15px;
outline:none;
transition:.3s;
}

.input-group input:focus,
.input-group select:focus{
border-color:#2563eb;
box-shadow:0 0 10px rgba(37,99,235,.25);
}

.saveBtn{
width:100%;
margin-top:10px;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#2563eb,#1d4ed8);
color:#fff;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.saveBtn:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(37,99,235,.35);
}

.title{
color:#fff;
margin:20px 0;
font-size:28px;
font-weight:700;
}

.table-box{
background:#fff;
border-radius:20px;
overflow:auto;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1d4ed8;
color:#fff;
padding:16px;
text-align:center;
}

td{
padding:15px;
text-align:center;
border-bottom:1px solid #e5e7eb;
}

tr:hover{
background:#eff6ff;
}

.editBtn{
background:#22c55e;
color:#fff;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
margin-right:6px;
}

.deleteBtn{
background:#ef4444;
color:#fff;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

@media(max-width:768px){

body{
padding:15px;
}

.header{
flex-direction:column;
gap:15px;
text-align:center;
}

.header h1{
font-size:24px;
}

.form-box{
padding:20px;
}

.title{
font-size:22px;
}

  }

</style>

</head>
<body>

<script>
if(localStorage.getItem("adminLogin")!="true"){
location.href="admin-login.html";
}
</script>

<div class="container">

<div class="header">

<h1>Create CBT Test</h1>

<a href="admin-dashboard.html">
<i class="fa-solid fa-arrow-left"></i>
Dashboard
</a>

</div>

<div class="form-box">

<div class="input-group">
<label>Test Name</label>
<input type="text" id="testName" placeholder="English Weekly Test">
</div>

<div class="row">

<div class="input-group">

<label>Class</label>

<select id="class">
<option>Select Class</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>

</select>

</div>

<div class="input-group">

<label>Subject</label>

<select id="subject">

<option>Select Subject</option>

<option>English</option>

<option>Hindi</option>

<option>Mathematics</option>

<option>Science</option>

<option>Social Science</option>

<option>Computer</option>

<option>GK</option>

</select>

</div>

</div>

<div class="row">

<div class="input-group">

<label>Exam Code</label>

<input type="text" id="examCode" placeholder="ENG-001">

</div>

<div class="input-group">

<label>Duration (Minutes)</label>

<input type="number" id="duration">

</div>

</div>

<div class="row">

<div class="input-group">

<label>Total Questions</label>

<input type="number" id="questions">

</div>

<div class="input-group">

<label>Total Marks</label>

<input type="number" id="marks">

</div>

</div>

<div class="row">

<div class="input-group">

<label>Start Date</label>

<input type="datetime-local" id="start">

</div>

<div class="input-group">

<label>End Date</label>

<input type="datetime-local" id="end">

</div>

</div>

<div class="input-group">

<label>Status</label>

<select id="status">

<option>OPEN</option>

<option>CLOSED</option>

</select>

</div>

<button class="saveBtn">

<i class="fa-solid fa-floppy-disk"></i>

CREATE TEST

</button>

</div>

<h2 class="title">
Created Tests
</h2>

<div class="table-box">

<table>

<thead>

<tr>

<th>Test</th>

<th>Class</th>

<th>Subject</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="testList">

</tbody>

</table>

</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ========= Firebase Config =========
// यहाँ वही firebaseConfig पेस्ट करें
// जो आपके पुराने Portal में firebase.js में है.

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const saveBtn=document.querySelector(".saveBtn");
const list=document.getElementById("testList");

saveBtn.onclick=async()=>{

const data={

testName:document.getElementById("testName").value,

className:document.getElementById("class").value,

subject:document.getElementById("subject").value,

examCode:document.getElementById("examCode").value,

duration:document.getElementById("duration").value,

questions:document.getElementById("questions").value,

marks:document.getElementById("marks").value,

start:document.getElementById("start").value,

end:document.getElementById("end").value,

status:document.getElementById("status").value,

createdAt:serverTimestamp()

};

if(data.testName==""){
alert("Enter Test Name");
return;
}

await addDoc(collection(db,"cbtTests"),data);

alert("Test Created Successfully");

};

onSnapshot(collection(db,"cbtTests"),(snapshot)=>{

list.innerHTML="";

snapshot.forEach((d)=>{

const x=d.data();

list.innerHTML+=`

<tr>

<td>${x.testName}</td>

<td>${x.className}</td>

<td>${x.subject}</td>

<td>${x.status}</td>

<td>

<button class="deleteBtn"
onclick="deleteTest('${d.id}')">

Delete

</button>

</td>

</tr>

`;

});

});

window.deleteTest=async(id)=>{

if(confirm("Delete Test ?")){

await deleteDoc(doc(db,"cbtTests",id));

}

};
// ---------- Auto Exam Code ----------
function generateCode() {

    const subject = document.getElementById("subject").value;
    const cls = document.getElementById("class").value;

    if(subject==="Select Subject" || cls==="Select Class"){
        return;
    }

    const prefix = subject.substring(0,3).toUpperCase();
    const classNo = cls.replace("Class ","");
    const random = Math.floor(100 + Math.random()*900);

    document.getElementById("examCode").value =
    prefix + classNo + random;

}

document.getElementById("subject")
.addEventListener("change",generateCode);

document.getElementById("class")
.addEventListener("change",generateCode);

// ---------- Clear Form ----------
function clearForm(){

document.getElementById("testName").value="";
document.getElementById("class").selectedIndex=0;
document.getElementById("subject").selectedIndex=0;
document.getElementById("examCode").value="";
document.getElementById("duration").value="";
document.getElementById("questions").value="";
document.getElementById("marks").value="";
document.getElementById("start").value="";
document.getElementById("end").value="";
document.getElementById("status").selectedIndex=0;

}
</script>

</body>
  </html>
